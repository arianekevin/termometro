async function overview() {
  const [o, rel, fw] = await Promise.all([read('/api/overview'), lastRelease().catch(() => null), read('/api/follow').catch(() => ({ items: [] }))])
  const n = o.now, b = o.before
  if (!n.visits && !b.visits) return empty(L.noVisits)
  // Compare only when the period before has data on at least half as many days: otherwise +3000% says nothing.
  const comparable = o.before_daily.length >= Math.max(1, Math.ceil(o.daily.length / 2))
  // A small base makes a giant percent (10 → 200 is +1900%): below 20 before, the value before; beyond ±500%, how many times.
  const diff = (now, before, worseUp) => {
    if (!comparable) return ''
    if (!before) return now ? `<span class="delta ${worseUp ? 'bad' : 'meta'}">${L.dnew}</span>` : ''
    const pct = Math.round((now - before) / before * 100)
    if (!pct) return `<span class="delta meta">=</span>`
    const cls = worseUp === undefined ? 'meta' : (pct > 0) === worseUp ? 'bad' : 'ok'
    const text = before < 20 ? L.dwas(num(before)) : Math.abs(pct) > 500 ? `×${num(Math.round(now / before))}` : `${pct > 0 ? '+' : ''}${pct}%`
    return `<span class="delta ${cls}" title="${esc(L.dtip(pct))}">${pct > 0 ? '▲' : '▼'} ${text}</span>`
  }
  const points = n.score - b.score
  const vs = !comparable ? L.noCompare : o.days === 1 ? L.vsDay : L.vsBefore(o.days)
  const series = (k) => o.daily.map((d) => d[k])
  const tile = (label, value, cls, delta, key, foot) => `<div class="card tile"><div class="label">${label}${key === 'score' ? help('overall') : ''}</div>
    <div class="row"><div class="big ${cls}">${value}${delta}</div>${spark(series(key), `${label} ${L.perDay}: ${Math.min(...series(key))}–${Math.max(...series(key))}`)}</div>
    <div class="meta">${foot}</div></div>`

  const sentence = (i) => L.insight[i.kind](nameFields(i), esc(L.names[i.type ?? i.top_signal] ?? i.type ?? i.top_signal ?? ''))
  const good = o.insights.filter((i) => groupOf(i.kind) === 'better')
  const todo = groupTodos(o.insights.filter((i) => groupOf(i.kind) !== 'better'))
  for (const g of todo) g.says = g.items.map(sentence)
  const follows = fw.items ?? []
  const verdict = verdictBanner(todo)

  const byRoute = Object.fromEntries(o.screens.map((r) => [r.route, r]))
  const mini = (i) => {
    const r = i.route && byRoute[i.route]
    if (i.n && i.type) return `<span class="mag">${num(i.n)}×</span>`
    if (r) return spark(o.daily.map((d) => r.days[d.day]?.score ?? 0), `${i.route} ${L.perDay}`, 72, 22)
    return ''
  }
  const grouped = {}
  for (const i of o.insights) (grouped[groupOf(i.kind)] ??= []).push(i)
  const groups = Object.keys(GROUPS).filter((g) => grouped[g])
  const byType = o.insights.length ? `<div class="groups">${groups.map((g, n) => `<section class="card group"><div class="label">${L.groups[g]} · ${grouped[g].length}</div>
      <ul class="insights">${grouped[g].map((i) => `<li><span class="pill ${i.severity}">${L.sev[i.severity]}</span>
        <div class="text">${sentence(i)} <a ${linkAttrs(i.link)}>${L.see} →</a><div class="tech">${techOf(i)}</div>
          <button class="small demand" data-copy="${esc(demandOf(i, sentence(i), o.days))}">${L.demand.copy}</button></div>${mini(i)}</li>`).join('')}</ul></section>`).join('')}</div>`
    : ''
  const view = recall('todoView') === 'type' ? 'type' : 'list'
  const insights = `<section class="card todo"><div class="head"><div><div class="label">${L.todo.title}${help('todo')}</div><div class="meta">${L.todo.hint}</div></div>
      ${o.insights.length ? `<div class="seg" role="group">${[['list', L.todo.byList], ['type', L.todo.byType]].map(([v, t]) =>
        `<button data-todo-view="${v}" aria-pressed="${view === v}">${t}</button>`).join('')}</div>` : ''}</div>
    <div class="todo-list" ${view === 'list' ? '' : 'hidden'}>${todo.length ? `<ol class="todos">${todo.map((g, k) => todoRow(g, k, o.days, follows)).join('')}</ol>
      ${todo.length > TODO_TOP ? `<button class="small" id="todo-all" aria-expanded="false" data-n="${todo.length}">${L.todo.all(todo.length)}</button>` : ''}`
      : `<p class="meta">${L.todo.none}</p>`}</div>
    <div class="todo-type" ${view === 'type' ? '' : 'hidden'}>${byType}</div></section>
    ${followCard(follows)}
    ${rel || good.length ? `<div class="two">${releaseCard(rel)}${good.length ? `<section class="card good"><div class="label">${L.todo.good} · ${good.length}</div><div class="meta">${L.todo.goodHint}</div>
      <ul class="insights">${good.map((i) => `<li><div class="text">${sentence(i)} <a ${linkAttrs(i.link)}>${L.see} →</a></div>${mini(i)}</li>`).join('')}</ul></section>` : ''}</div>` : ''}`

  return `
    ${verdict}
    <section class="numbers">
      ${tile(L.overall, n.score, band(n.score), comparable && b.visits ? `<span class="delta ${points > 0 ? 'bad' : points < 0 ? 'ok' : 'meta'}">${points > 0 ? '▲ +' : points < 0 ? '▼ ' : ''}${points || '='}</span>` : '', 'score',
        `<span class="pill ${band(n.score)}">${say(n.score)}</span> ${L.allScreens}`)}
      ${tile(L.visits, num(n.visits), '', diff(n.visits, b.visits), 'visits', L.sessions(n.sessions))}
      ${tile(L.people, num(n.users), '', diff(n.users, b.users), 'users', vs)}
      ${tile(L.failures, num(n.failures), n.failures ? 'bad' : 'ok', diff(n.failures, b.failures, true), 'failures', vs)}
    </section>
    ${insights}
    ${kindsCard(o)}

    ${heatMap(o)}
    <section class="card"><div class="head"><div style="flex:1;min-width:240px"><div class="label">${L.forAi}</div><div class="meta">${L.forAiHint}</div></div>
      <div class="field"><button id="copy-report" class="primary">${L.copyReport}</button><a class="button" style="height:36px;padding:0 12px;border:1px solid var(--line-strong)"
        href="/api/report?${esc(query())}" download="termometro-${esc($('#project').value)}.json">${L.downloadJson}</a></div></div></section>`
}

  return `
    <section class="numbers">

const stepHtml = (s, t, here) => `<li class="${here ? 'here' : isFailure(s) || s.type === 'rage' || s.type === 'dead' ? 'sig' : ''}">
  <span class="t">${t}</span><span>${esc(stepText(namedStep(s)))} <code class="tech">${esc([s.type === 'page' ? '' : s.route, s.target].filter(Boolean).join(' · ') || s.route)}</code></span></li>`
const stepsHtml = (list, isHere) => list.map((s, i) => stepHtml(s, i ? gap(s.at - list[i - 1].at) : '', isHere(s))).join('')
// Who was in a session, leaving out what is not known: "Hugo Sá u27", the id muted beside the name.
const whoHtml = (t) => [t.version && esc(t.version), t.agent && esc(t.agent), t.device && esc(F().devicesNames[t.device] ?? t.device),
  t.user && (personName(t.user) ? `${esc(personName(t.user))} <code class="idm" title="${esc(t.user)}">${esc(short(t.user))}</code>` : `${L.user} <code title="${esc(t.user)}">${esc(short(t.user))}</code>`),
  t.role && esc(t.role)].filter(Boolean)
// A step told with names: "Opened Users", "Clicked Users › New user", "Saved Save".
function namedStep(s) {
  const page = screenText(s.route) || s.route
  return { ...s, route: page, target: s.target ? (controlLabel(s.route, s.target) ? `${page} › ${controlLabel(s.route, s.target)}` : s.target) : s.target,
    detail: s.type === 'action' && actionText(s.detail) ? `${actionText(s.detail)} (${s.detail})` : s.detail }
}
const counts = (title, list, name = (k) => k) => `<div><div class="label">${title}</div>${list.length
  ? `<ul class="counts">${list.map((x) => `<li><span>${esc(name(x.key) || F().unknown)}</span><b>${num(x.n)}</b></li>`).join('')}</ul>` : '<p class="meta">—</p>'}</div>`
const sameStep = (a, b) => a.at === b.at && a.type === b.type && a.detail === b.detail

function issueMarkdown(d, link = location.href) {
  const I = F().issue, name = L.names[d.type] ?? d.type, list = (xs) => xs.map((x) => `${x.key || F().unknown} (${x.n})`).join(', ')
  const t = d.trails[0]
  const lines = [`## ${name}: ${d.detail}`, '',
    `- ${I.occurrences}: ${F().occurrences(d)} ${I.period($('#days').value)}`,
    `- ${I.first}: ${d.first_version} (${when(d.first_at)}) · ${I.last}: ${d.last_version ? `${d.last_version} (${when(d.last_at)})` : when(d.last_at)}`,
    `- ${F().where}: ${list(d.routes)}`, `- ${F().versions}: ${list(d.versions)}`, `- ${F().agents}: ${list(d.agents)}`,
    `- ${F().devices}: ${list(d.devices.map((x) => ({ ...x, key: F().devicesNames[x.key] ?? x.key })))}`]
  if (d.after_clicking.length) lines.push(`- ${F().afterClicking}: ${list(d.after_clicking)}`)
  if (d.account_list?.length) lines.push(`- ${FD().accountsMd}: ${list(d.account_list.map((x) => ({ ...x, key: accountText(x.key) })))}`)
  if (d.stacks.length) lines.push('', `### ${F().stack}`, '```', d.stacks[0].key, '```')
  if (t) {
    const ctx = [t.agent, t.device && (F().devicesNames[t.device] ?? t.device), t.version].filter(Boolean).join(', ')
    lines.push('', `### ${I.steps}${ctx ? ` (${ctx})` : ''}`)
    ;[...t.before, t.failure].forEach((s, i, all) => { const g = i ? gap(s.at - all[i - 1].at) : ''
      lines.push(`${i + 1}. ${i === all.length - 1 ? '**' : ''}${stepText(namedStep(s))}${s.type !== 'page' ? ` — ${s.route}` : ''}${i === all.length - 1 ? '**' : ''}${g ? ` (${g})` : ''}`) })
  }
  lines.push('', `${I.link}: ${link}`)
  return lines.join('\n')
}

// Times per day of one failure: thin columns, the days under them, a mark on the day it first appeared; the tooltip says
// the day and how many times.
function failureChart(d) {
  const days = d.days ?? [], n = days.length
  if (n < 2) return ''
  const by = Object.fromEntries(d.per_day.map((x) => [x.day, x.n])), vals = days.map((x) => by[x] ?? 0)
  const max = Math.max(...vals), top = Math.max(1, max) * 1.15, peak = days[vals.indexOf(max)]
  const first = d.first_at ? new Date(d.first_at).toISOString().slice(0, 10) : '', at = days.indexOf(first)
  return `<div class="fchart"><div class="label">${FD().byDay}${help('failureDays')}</div>
    <div class="meta">${esc(dayText(days[0]))} → ${esc(dayText(days[n - 1]))}${max ? ` · ${esc(FD().peak(num(max), dayText(peak)))}` : ''}</div>
    <div class="chart small">${max ? `<div class="rule" style="top:${100 - max / top * 100}%"><em>${num(max)}×</em></div>` : ''}${at > 0 ? `<div class="deploy" style="left:${at * 100 / n}%" data-tip="${esc(`${FD().started}: ${dayText(first)} · ${d.first_version}`)}"><span>${esc(d.first_version)}</span></div>` : ''}
      <div class="cols">${days.map((x, i) => `<div class="c" tabindex="0" data-tip="${esc(FD().dayTip(dayText(x), num(vals[i])))}"><i class="acc" style="height:${vals[i] ? Math.max(2, vals[i] / top * 100) : 0}%"></i></div>`).join('')}</div>
    </div>${dayAxis(days, 'sm')}</div>`
}

// Every table can leave as CSV: what is on screen, so the numbers match what was read.
// Long lists: where the top is what matters, pages of 10 turned by hand; where people browse (data-scroll), 30 more
// whenever the end comes into view. A row and its detail row move together; the selected row's page opens first.
const PAGE = 10, CHUNK = 30
function paginate(root = $('#content')) {
  root?.querySelectorAll('.table').forEach((wrap) => {
    const body = wrap.querySelector('tbody')
    if (!body || wrap.dataset.paged) return
    const groups = []
    for (const tr of body.children) if (tr.classList.contains('detail') && groups.length) groups[groups.length - 1].push(tr); else groups.push([tr])
    const scroll = !!wrap.closest('[data-scroll]'), size = scroll ? CHUNK : PAGE
    if (groups.length <= size) return
    wrap.dataset.paged = '1'
    const show = (from, to) => groups.forEach((g, i) => g.forEach((tr) => tr.classList.toggle('off', i < from || i >= to)))
    if (scroll) {
      let shown = size
      show(0, shown)
      const end = Object.assign(document.createElement('div'), { className: 'sentinel' })
      wrap.after(end)
      const io = new IntersectionObserver((seen) => {
        if (!seen.some((x) => x.isIntersecting)) return
        shown += size; show(0, shown)
        if (shown >= groups.length) { io.disconnect(); end.remove() }
      }, { rootMargin: '400px' })
      io.observe(end)
      return
    }
    let page = Math.max(0, Math.floor(groups.findIndex((g) => g[0].classList.contains('sel')) / size))
    const nav = Object.assign(document.createElement('div'), { className: 'pager' })
    const draw = () => {
      show(page * size, page * size + size)
      nav.innerHTML = `<button class="small" data-p="-1" ${page ? '' : 'disabled'}>← ${L.prev}</button>
        <span class="meta">${L.range(page * size + 1, Math.min(groups.length, (page + 1) * size), groups.length)}</span>
        <button class="small" data-p="1" ${(page + 1) * size < groups.length ? '' : 'disabled'}>${L.next} →</button>`
    }
    nav.addEventListener('click', (e) => {
      const b = e.target.closest('[data-p]')
      if (!b || b.disabled) return
      page += +b.dataset.p; draw(); wrap.scrollIntoView({ block: 'nearest' })
    })
    draw(); wrap.after(nav)
  })
}

function addCsvButtons() {
  document.querySelectorAll('#content .card').forEach((card, i) => {
    const t = card.querySelector(':scope > .table table, :scope > details > .table table')
    if (!t || card.querySelector(':scope > .csv')) return
    const b = Object.assign(document.createElement('button'), { className: 'small csv', textContent: L.csv, title: L.csvTip })
    b.addEventListener('click', () => {
      const cell = (c) => `"${c.textContent.replace(/\s+/g, ' ').trim().replace(/"/g, '""')}"`
      // Action columns (copy, watch…) are not data: a header or cell marked data-nocsv stays out, the whole column with it.
      const skip = new Set([...(t.tHead?.rows[0]?.cells ?? [])].flatMap((c, j) => c.hasAttribute('data-nocsv') ? [j] : []))
      const rows = [...t.querySelectorAll('tr')].filter((r) => !r.hidden && !r.classList.contains('detail'))
        .map((r) => [...r.children].filter((c, j) => !skip.has(j) && !c.hasAttribute('data-nocsv')).map(cell).join(','))
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob(['\ufeff' + rows.join('\n')], { type: 'text/csv' })),
        download: `termometro-${state.tab}-${i + 1}.csv` })
      a.click(); URL.revokeObjectURL(a.href)
    })
    const head = card.querySelector(':scope > .head')
    // The main action stays at the right end; CSV sits before it.
    const main = head?.querySelector(':scope > .primary')
    if (main) main.before(b); else if (head) head.append(b); else card.prepend(b)
  })
}

// The page header is sticky and its height changes with the width: what sticks under it (a failure's bar) and
// what scrolls into view stays clear of it.
function watchHeader() {
  const h = $('header'), set = () => document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px')
  if (!h || h.dataset.watched) return
  h.dataset.watched = '1'
  set(); new ResizeObserver(set).observe(h)
}
document.addEventListener('click', (e) => {
  if (e.target.closest?.('[data-fail-back]')) return go('failures', { days: $('#days').value })
  const row = e.target.closest?.('#content tr.row[data-signal]') // remember where the row was, to come back to it
  if (row) state.failBack = { signal: row.dataset.signal, detail: row.dataset.detail, top: row.getBoundingClientRect().top }
}, true)

// "Copiar demanda" on a list row: the failure's detail is read inside the click (so the browser still lets the page write
// to the clipboard when it arrives) and told the same way as in the detail; the row does not open.
document.addEventListener('click', (e) => {
  const b = e.target.closest?.('#content [data-copy-failure]')
  if (!b) return
  e.stopPropagation(); e.preventDefault()
  const row = b.closest('tr.row'), was = b.textContent, params = { signal: row.dataset.signal, detail: row.dataset.detail }
  const link = location.origin + location.pathname + hashFor('failures', params)
  const text = read('/api/failure', params).then((d) => issueMarkdown(d, link))
  const item = typeof ClipboardItem !== 'undefined' ? new ClipboardItem({ 'text/plain': text.then((t) => new Blob([t], { type: 'text/plain' })) }) : null
  ;(item ? navigator.clipboard.write([item]) : text.then((t) => navigator.clipboard.writeText(t)))
    .then(() => { b.textContent = L.copied; setTimeout(() => { b.textContent = was }, 1500) }, () => {})
}, true)

async function showSession(button) {
  const box = button.closest('.trail'), zero = Number(box.dataset.zero)
  const s = await read('/api/session', { session: button.dataset.session })
  box.querySelector('.steps').innerHTML = stepsHtml(s.steps, (x) => x.at === zero && isFailure(x))
  button.replaceWith(Object.assign(document.createElement('div'), { className: 'meta', textContent: s.truncated ? F().truncated : '' }))
}

      : `<p class="meta">${W.none}</p>`}</section>`
  const T = L.detour
  const detourCard = `<section class="card"><div class="label">${T.title}${help('detours')}</div><div class="meta">${T.hint}</div>
    ${pat.forms.length ? table(`<th>${L.screen}</th><th class="n">${T.started}</th><th>${T.left}</th><th>${T.away}</th>`, pat.forms.map((x) => `<tr>

      <td>${x.away ? `<b>${Math.round(x.away_share * 100)}%</b> <span class="meta">(${num(x.away)})</span><div class="meta">${T.for(x.away_seconds)}</div>` : '—'}</td></tr>`).join(''))
      : `<p class="meta">${T.none}</p>`}</section>`
  return patCard + detourCard + wayCard + reachCard() + `
    <section class="card"><div class="label">${J().pairs}${help('pairs')}</div><div class="meta">${J().pairsHint}</div>
      ${j.pairs.length ? `<ul class="insights">${j.pairs.slice(0, 15).map((p) => { const e = { ...p, a: esc(actionText(p.a) || p.a), b: esc(actionText(p.b) || p.b), clicks: p.clicks_median, screens: p.screens_median }
        return `<li>${p.linked ? `<span class="pill idea">${J().linked}</span>` : ''}<div class="text">${J().pair(e)}<div class="meta">${J().pairMeta(e)}</div><div class="tech"><code>${esc(p.a)}</code> → <code>${esc(p.b)}</code></div></div></li>` }).join('')}</ul>`
        : `<p class="meta">${J().noPairs}</p>`}
    </section>
    <section class="card"><div class="head"><div><div class="label">${J().flow}${help('flow')}</div><div class="meta">${J().flowHint}</div></div>
        <select id="flow-screen" aria-label="${L.screen}">${j.screens.map((x) => `<option value="${esc(x.route)}" ${x.route === state.route ? 'selected' : ''}>${esc(screenText(x.route) ? `${screenText(x.route)} (${x.route})` : x.route)}</option>`).join('')}</select></div>
      <div class="flow">
        <div><div class="label">${J().from}</div>${flowList(sc.from, J().start)}</div>
        <div class="here"><div class="route">${scr(sc.route)}</div><div class="meta">${L.visitsN(sc.visits)} · ${J().timeOn(sc.seconds_median)}</div></div>
        <div><div class="label">${J().to}</div>${flowList(sc.to, '—')}</div>

      <div class="funnel">${fu.steps.map((x, i) => `<div class="fstep">
          <div class="fhead"><span>${i + 1}. ${esc(stepLabel(x.step))}</span><button class="small" data-funnel-remove="${i}" aria-label="${J().removeStep}">×</button></div>
          <div class="bar big"><i style="width:${pct(x.share)}%;background:var(--fill)"></i></div>
          <div class="meta">${J().reached(x.sessions, pct(x.share))}${i && fu.steps[i - 1].sessions ? ` · <span class="${x.sessions < fu.steps[i - 1].sessions * 0.7 ? 'bad' : ''}">${J().lost(Math.round((1 - x.sessions / fu.steps[i - 1].sessions) * 100))}</span>` : ''}</div>

async function openMap(route = '', mode = 'heat') {
  const res = await fetch('/api/map-token?project=' + encodeURIComponent($('#project').value), { method: 'POST' })
  if (!res.ok) return
  const { token, url } = await res.json()
  // Straight to the screen when its route is a plain path (a record's page, /x/:id, needs a real id: the app's home).
  const target = new URL(route && !route.includes(':') ? route.replace(/^\//, '') : '', url.endsWith('/') ? url : url + '/')
  target.searchParams.set('termometro_map', token)
  if (mode === 'routes') target.searchParams.set('termometro_mode', 'routes')
  window.open(target.href, '_blank', 'noopener')
}

        <span class="meta">${num(o.a.failures)} → ${num(o.b.failures)} ${L.failures.toLowerCase()} · ${L.todo.sessions(o.b.sessions)}</span></div>

// An empty view: the period, the mark or the filters left nothing out of what the project did receive. Says which,
// when the last event came, and offers the one step that brings data back (filled, at the right end).
const NO_PERIOD_TABS = ['dictionary', 'features'] // they work without data in the period: names and the feature editor
const DAY_MS = 864e5
function emptyState() {
  const s = state.status ?? {}, E = L.nodata, days = +$('#days').value, p = projectNow(), now = Date.now()
  const label = { version: L.version, account: L.account, role: L.role, feature: L.feature }
  const cuts = ['account', 'version', 'role', 'feature'].filter((id) => $('#' + id)?.value).map((id) => `${label[id]}: ${optText(id)}`)
  if (state.user) cuts.push(`${L.user}: ${personName(state.user) || short(state.user)}`)
  const mark = p?.mark && !state.all && p.mark > now - days * DAY_MS ? p.mark : 0
  const markName = mark ? `«${[(p.marks ?? []).find((m) => m.at === mark)?.name, dateOf(mark)].filter(Boolean).join(' · ')}»` : ''
  const stamp = (at) => E.at(dateOf(at), new Date(at).toLocaleTimeString(PT ? 'pt-BR' : 'en', { hour: '2-digit', minute: '2-digit' }))
  const last = s.last_match, max = Math.max(...[...$('#days').options].map((o) => +o.value))
  const lines = [], acts = []
  let main = ''
  if (!last) lines.push(E.noneCut)
  else {
    lines.push((cuts.length ? E.lastCut : E.last)(stamp(last), ago(last)))
    const need = Math.ceil((now - last) / DAY_MS + 0.01), n = widenTo(need)
    if (mark && last < mark) main = `<button class="primary" data-empty="all" data-days="${need > days && need <= max ? n : ''}">${E.whole}</button>`
    else if (need > max) lines.push(E.tooOld(max))
    else if (n > days) main = `<button class="primary" data-empty="days" data-days="${n}">${E.widen(n)}</button>`
  }
  if (cuts.length && s.last_at && s.last_at !== last) lines.push(E.lastAny(ago(s.last_at)))
  if (mark) { lines.push(E.mark(esc(markName))); if (!main) acts.push(`<button data-empty="all">${E.whole}</button>`) }
  if (cuts.length) {
    lines.push(E.cuts(esc(cuts.join(' · '))))
    if (!main && !last) main = `<button class="primary" data-empty="clear">${E.clear}</button>`; else acts.push(`<button data-empty="clear">${E.clear}</button>`)
  }
  return `<section class="card nodata" role="status"><div class="label">${E.title(days)}</div>
    ${lines.map((x) => `<p>${x}</p>`).join('')}
    ${acts.length || main ? `<div class="actions-row nodata-acts">${acts.join('')}${main}</div>` : ''}</section>`
}
function onEmptyClick(b) {
  if (b.dataset.empty === 'clear') {
    for (const id of ['version', 'account', 'role', 'feature']) { $('#' + id).value = ''; keep(id, '') }
    state.user = ''
  }
  if (b.dataset.empty === 'all') state.all = '1'
  if (b.dataset.days) { $('#days').value = b.dataset.days; keep('days', b.dataset.days) }
  render()
}

        p.areas.map((a, i) => { const b = a.before

    </section>
    <section class="card"><div class="label">${PR().low}${help('low')}</div><div class="meta">${PR().lowHint(2)}</div>
      ${p.low_use.length ? table(`<th>${L.element}</th><th class="n">${PR().seen}</th><th class="n">${PR().clicked}</th><th data-nocsv><span class="sr">${PR().watch}</span></th>`,
        p.low_use.map((x) => `<tr><td>${ctl(x.route, x.target)}</td><td class="n">${num(x.sessions)}</td><td class="n">${num(x.clicked)} <span class="meta">${pctOf(x.share)}</span></td>${watchCell(x)}</tr>`).join(''))
        : `<p class="meta">${PR().none}</p>`}</section>
    <section class="card"><div class="label">${PR().news}${help('news')}</div><div class="meta">${PR().newsHint}</div>
      ${p.new.length ? table(`<th>${L.element}</th><th>${PR().since}</th><th class="n">${PR().seen}</th><th class="n">${PR().used}</th><th data-nocsv><span class="sr">${PR().watch}</span></th>`,
        p.new.map((x) => `<tr><td>${ctl(x.route, x.target)}</td><td>${esc(when(x.first_seen))}</td><td class="n">${num(x.sessions)}</td>
          <td class="n">${pctOf(x.share)}<div class="bar"><i style="width:${x.share * 100}%;background:var(--fill)"></i></div></td>${watchCell(x)}</tr>`).join(''))
        : `<p class="meta">${PR().noNews}</p>`}</section>`
}

// Features & accounts --------------------------------------------------------------------------------------------
const FT = () => L.feat, AC = () => L.acc
// Columns of a magnitude per day, in the accent colour, with a tooltip per day.
function barsChart(title, days, value, tip) {
  if (days.length < 2) return ''
  const top = Math.max(1, ...days.map(value)) * 1.1
  return `<section class="card"><div class="label">${title}</div><div class="meta">${esc(dayText(days[0].day))} → ${esc(dayText(days[days.length - 1].day))}</div>
    <div class="chart small"><div class="cols">${days.map((d) => `<div class="c" tabindex="0" data-tip="${esc(tip(d))}">
      <i class="acc" style="height:${Math.max(1.5, value(d) / top * 100)}%"></i></div>`).join('')}</div></div>${dayAxis(days.map((d) => d.day), 'sm')}</section>`
}
// Now against before, where down is the bad direction (engagement): ▼ red, ▲ green.
const change = (now, before) => before === null || before === undefined ? '' : now === before ? '<span class="delta meta">=</span>'
  : `<span class="delta ${now < before ? 'bad' : 'ok'}">${now < before ? '▼' : '▲'}&nbsp;${FT().before(num(before))}</span>`
const ruleText = (r) => {
  if (r.kind === 'screen') return screenText(r.key) || r.key
  if (r.kind === 'control') { const [route, target] = r.key.split('\t'); return controlText(route, target) || `${screenText(route) || route} › ${target}` }
  if (r.kind === 'action') return actionText(r.key) || r.key
  return r.key
}
const ruleHtml = (r) => `<span class="pill idea">${FT().kinds[r.kind]}</span> ${named(ruleText(r) === r.key ? '' : ruleText(r), r.key.replace('\t', ' · '))}`

  const r = await read('/api/features')
  const fid = $('#feature').value

    <button class="primary" data-feat="new">${FT().create}</button></div></section>`
  if (fid) {
    const ft = r.features.find((x) => x.id === fid)
    if (ft) return featureDetail(ft, r)
  }
  if (!r.features.length) return head + empty(FT().none)
  return head + `<div class="fgrid">${r.features.map((ft) => `<section class="card feature">
      <div class="head"><div class="fname">${esc(ft.name)}</div><span><span class="pill ${band(ft.score)}">${FT().score} ${ft.score}</span>${scoreDelta(ft.score, ft.before_detail?.score)}</span></div>
      <div class="row"><div><div class="big">${num(ft.uses)}</div><div class="meta">${FT().uses} ${change(ft.uses, ft.before)}</div></div>
        ${spark(ft.daily.map((d) => d.n), `${ft.name}: ${FT().usesByDay}`, 120, 28, ft.daily.map((d) => d.day))}</div>
      <div class="adopt"><div class="meta">${FT().inSessions}${help('adoption')} ${Math.round(ft.session_share * 100)}% ${FT().sessionsOf()}</div>
        <div class="bar"><i style="width:${ft.session_share * 100}%;background:var(--fill)"></i></div></div>
      <div class="meta">${FT().peopleOf(ft.users, r.active_users)}${countDelta(ft.users, ft.before_detail?.users)} · ${num(ft.accounts)} ${FT().accounts.toLowerCase()} · ${num(ft.failures)} ${FT().failures.toLowerCase()}${countDelta(ft.failures, ft.before_detail?.failures)}</div>
      <div class="actions-row"><button class="primary small" data-feat="open" data-id="${esc(ft.id)}">${FT().analyse}</button>

      <div class="fname big-name">${esc(ft.name)}</div><div class="rules">${ft.rules.map((x) => `<div>${ruleHtml(x)}</div>`).join('')}</div></div>

    <section class="numbers">

      <div class="card"><div class="label">${FT().people}</div><div class="big">${num(ft.users)}${countDelta(ft.users, ft.before_detail?.users)}</div><div class="meta">${FT().peopleOf(ft.users, r.active_users)} · ${num(ft.accounts)} ${FT().accounts.toLowerCase()}</div></div>
      <div class="card"><div class="label">${FT().score}${help('featureScore')}</div><div class="big ${band(ft.score)}">${ft.score}${scoreDelta(ft.score, ft.before_detail?.score)}</div><div class="meta">${num(ft.failures)} ${FT().failures.toLowerCase()}${countDelta(ft.failures, ft.before_detail?.failures)}</div></div>

        rows.map((a) => `<tr class="row" data-account="${esc(a.account)}" tabindex="0"><td>${esc(accountText(a.account))}${a.drops.some((d) => d.feature === ft.id) ? ` <span class="pill bad">${AC().fell}</span>` : ''}</td>
          <td class="n">${num(a.f.now)}${accDelta(a.f.now, a.f.before, a.f.move)}</td><td class="n">${num(a.now.users_day)}</td></tr>`).join('')) : `<p class="meta">${AC().none}</p>`}

async function featureEditor() {

  if (!state.dict) state.dict = await read('/api/dictionary')
  const d = state.dict
  const opts = (kind, list, text) => `<option value="">${FT().pick}</option>` + list.slice(0, 600).map((x) =>
    `<option value="${esc(x.key)}">${esc(text(x))}</option>`).join('')
  const pickers = {
    screen: opts('screen', d.screens, (x) => (screenText(x.key) ? `${screenText(x.key)} — ${x.key}` : x.key)),
    control: opts('control', d.controls, (x) => `${controlText(x.route, x.target) || (screenText(x.route) || x.route) + ' › ' + L.unnamed} — ${x.target}`),
    action: opts('action', d.actions, (x) => (actionText(x.key) ? `${actionText(x.key)} — ${x.key}` : x.key)),
  }
  return `<section class="card feditor"><div class="label">${ed.id ? FT().edit : FT().create}</div>
    <label class="stack"><span class="meta">${FT().name}</span><input id="feat-name" value="${esc(ed.name ?? '')}" placeholder="${FT().namePh}"></label>
    <div><div class="meta">${FT().parts}</div><div class="meta">${FT().partsHint}</div>
      <ul class="rules-edit">${(ed.rules ?? []).map((x, i) => `<li>${ruleHtml(x)}<button class="small" data-feat="drop-rule" data-i="${i}" aria-label="${FT().remove}">×</button></li>`).join('')}</ul>
      <div class="addrule"><select id="rule-kind">${Object.entries(FT().kinds).map(([k, v]) => `<option value="${k}" ${k === (ed.kind ?? 'action') ? 'selected' : ''}>${v}</option>`).join('')}</select>
        ${(ed.kind ?? 'action') === 'track' ? `<input id="rule-key" placeholder="${FT().trackPh}">` : `<select id="rule-key">${pickers[ed.kind ?? 'action']}</select>`}
        <button data-feat="add-rule">${FT().add}</button></div></div>
    <p class="error" id="feat-error" hidden>${FT().needs}</p>

async function onFeatureClick(e) {
  if (e.target.closest('[data-copy]')) return // copying a row's summary does not open the account
  if (e.target.closest('[data-acc-down]')) { state.accDown = !state.accDown; return render() }
  const sortBy = e.target.closest('[data-acc-sort]')
  if (sortBy) { state.accSort = sortBy.dataset.accSort; keep('accSort', state.accSort); return render() }
  const ac = e.target.closest('[data-acc-copy]')
  if (ac) { // the row's summary, copied without opening the account; a check says it worked
    navigator.clipboard?.writeText(ac.dataset.accCopy).then(() => { ac.classList.add('done'); ac.title = L.copied; setTimeout(() => { ac.classList.remove('done'); ac.title = AC().copySummary }, 1500) })
    return
  }
  const b = e.target.closest('[data-feat]')
  const row = e.target.closest('tr[data-account]')
  if (row) { $('#account').value = row.dataset.account; keep('account', row.dataset.account); return go('accounts', {}) }
  if (!b) return
  const what = b.dataset.feat, ed = state.featureEdit
  if (what === 'new') { state.featureEdit = { rules: [] }; return render() }
  if (what === 'watch') { // from Produto: the editor opens with this button as the feature's first part
    const { route, target } = b.dataset
    state.featureEdit = { name: controlLabel(route, target), rules: [{ kind: 'control', key: route + '\t' + target }], kind: 'control' }
    return state.tab === 'features' ? render() : go('features', {})
  }
  if (what === 'edit') { const ft = NM().features.find((x) => x.id === b.dataset.id); state.featureEdit = { ...ft, rules: [...ft.rules] }; return render() }
  if (what === 'open') { $('#feature').value = b.dataset.id; keep('feature', b.dataset.id); return render() }
  if (what === 'all') { $('#feature').value = ''; keep('feature', ''); return render() }
  if (what === 'cancel') { state.featureEdit = null; return render() }
  if (what === 'add-rule') {
    const key = $('#rule-key').value.trim(), kind = $('#rule-kind').value
    if (key && !ed.rules.some((x) => x.kind === kind && x.key === key)) ed.rules.push({ kind, key })
    ed.name = $('#feat-name').value; return render()
  }
  if (what === 'drop-rule') { ed.rules.splice(+b.dataset.i, 1); ed.name = $('#feat-name').value; return render() }
  const send = async (body) => {
    const res = await fetch('/api/features?project=' + encodeURIComponent($('#project').value), { method: 'POST', body: JSON.stringify(body) })
    if (res.status === 401) { boot(); return null }
    if (res.ok) return res.json()
    const why = (await res.json().catch(() => ({}))).error ?? ''
    const box = $('#feat-error'); if (box) { box.textContent = why.includes('already') ? FT().duplicate : FT().needs; box.hidden = false }
    return null
  }
  if (what === 'save') {
    ed.name = $('#feat-name').value.trim()
    if (!ed.name || !ed.rules.length) { $('#feat-error').hidden = false; return }
    const out = await send({ id: ed.id, name: ed.name, rules: ed.rules })
    if (!out) return
    state.featureEdit = null; await loadFilters(); $('#feature').value = out.id; keep('feature', out.id); return render()
  }
  if (what === 'remove' && confirm(FT().confirmRemove(featureName(b.dataset.id)))) {
    await send({ id: b.dataset.id, delete: true })
    await loadFilters(); $('#feature').value = ''; keep('feature', ''); return render()
  }
}

// An account's trend, as a chip that says it in words (the colour only repeats it).
const TREND = { down: ['bad', '▼'], flat: ['flat', '='], up: ['ok', '▲'] }
const trendChip = (t) => t ? `<span class="pill trend ${TREND[t][0]}">${TREND[t][1]} ${AC().trend[t]}</span>` : '<span class="meta">—</span>'
// A number now against before, as a %: coloured only when it moved beyond chance (the server's move), the number before in the tooltip.
const pctText = (now, before) => !before ? (now ? AC().fromZero : '=') : Math.round((now - before) / before * 100) || '='
const accDelta = (now, before, mv) => { if (before === null || before === undefined) return ''
  const p = pctText(now, before), cls = mv === 'down' ? 'bad' : mv === 'up' ? 'ok' : 'meta'
  return `<span class="delta ${cls}" title="${esc(FT().before(num(before)))}">${typeof p === 'number' ? `${p > 0 ? '▲ +' : '▼ −'}${Math.abs(p)}%` : p === '=' ? '=' : '▲ ' + p}</span>` }
// What customer success pastes in a ticket or a chat: who, the trend, how much it suffers, the numbers before → now, the features that fell.
function accountSummary(a, e) {
  const line = (label, now, before) => `${label}: ${before === null || before === undefined ? num(now) : `${num(before)} → ${num(now)}`}${before ? (typeof pctText(now, before) === 'number' ? ` (${pctText(now, before) > 0 ? '+' : '−'}${Math.abs(pctText(now, before))}%)` : '') : ''}`
  const fell = a.features.filter((x) => x.move === 'down').map((x) => `- ${(e.features.find((f) => f.id === x.id) ?? {}).name ?? x.id}: ${num(x.before)} → ${num(x.now)}`)
  return [`${AC().account}: ${accountText(a.account)}`,
    `${AC().trendCol}: ${a.trend ? AC().trend[a.trend] : '—'} (${a.before ? AC().period(e.days) : AC().noCompare})`,
    `${AC().score}: ${a.before ? `${a.before.score} → ` : ''}${a.now.score} (${say(a.now.score)})`,
    line(AC().failures, a.now.failures, a.before?.failures),
    line(AC().usersDay, a.now.users_day, a.before?.users_day), line(AC().sessionsDay, a.now.sessions_day, a.before?.sessions_day),
    line(AC().people, a.now.users, a.before?.users),
    ...(fell.length ? [`${AC().fellFeatures}:`, ...fell] : []),
    `${L.demand.evidence}: ${location.origin + location.pathname + hashFor('accounts', { account: a.account })}`].join('\n')
}
// Business name first, the id muted under it; without a name, the id alone.
const accCell = (id) => { const n = NM().accounts?.[id]
  return n ? `<span class="acc-cell"><span class="nm acc-name" title="${esc(n)}">${esc(n)}</span> <code class="tech" title="${esc(id)}">${esc(id)}</code></span>`
    : `<span class="acc-cell"><code class="acc-name" title="${esc(id)}">${esc(id)}</code></span>` }
// "Worst first": 25 points per number that dropped, plus the frustration, how much it rose and the failures per 100 visits.
const downsOf = (a) => Object.values(a.moves ?? {}).filter((m) => m === 'down').length + a.features.filter((f) => f.move === 'down').length
const painOf = (a) => downsOf(a) * 25 + a.now.score + Math.max(0, a.now.score - (a.before?.score ?? a.now.score)) + (a.now.visits ? a.now.failures / a.now.visits * 100 : 0)
const COPY_ICON = '<svg class="copy-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'
  + '<svg class="ok-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>'

async function accounts() {
  const e = await read('/api/engagement')
  const id = $('#account').value
  if (id) return accountDetail(e, id)
  if (!e.accounts.length) return empty(AC().none)
  const feats = e.features
  const down = e.accounts.filter((a) => a.trend === 'down').length
  const sort = state.accSort ?? recall('accSort') ?? 'trend'
  const rows = (state.accDown ? e.accounts.filter((a) => a.trend === 'down') : [...e.accounts])
  if (sort === 'worst') rows.sort((a, b) => painOf(b) - painOf(a))
  return `<section class="card"><div class="label">${AC().title}${help('accounts')}</div><div class="meta">${AC().hint(Math.round(e.covered))} ${e.comparable ? '' : AC().noCompare} ${AC().open}</div>
    ${feats.length ? '' : `<p class="meta">${AC().noFeatures}</p>`}
    <div class="chips">${e.comparable ? `<button data-acc-down aria-pressed="${!!state.accDown}" ${down || state.accDown ? '' : 'disabled'}>${AC().onlyDown(down)}</button>` : ''}
      <span class="sep">${AC().sort}</span>${['trend', 'worst'].map((k) => `<button data-acc-sort="${k}" aria-pressed="${sort === k}">${k === 'trend' ? AC().byTrend : AC().worst}</button>`).join('')}</div>
    ${rows.length ? table(`<th>${AC().account}</th><th>${AC().trendCol}</th><th class="n">${AC().score}</th><th class="n">${AC().failures}</th><th class="n">${AC().usersDay}</th><th class="n">${AC().sessionsDay}</th><th class="n">${AC().people}</th>${feats.map((f) => `<th class="n">${esc(f.name)}</th>`).join('')}<th class="act" data-nocsv><span class="sr">${AC().copySummary}</span></th>`,
      rows.map((a) => `<tr class="row" data-account="${esc(a.account)}" tabindex="0">
        <td>${accCell(a.account)}</td>
        <td>${trendChip(a.trend)}</td>
        <td class="n">${scoreHtml(a.now.score)}${scoreDelta(a.now.score, a.before?.score)}</td>
        <td class="n">${num(a.now.failures)}${countDelta(a.now.failures, a.before?.failures)}</td>
        <td class="n">${num(a.now.users_day)}${a.before ? accDelta(a.now.users_day, a.before.users_day, a.moves?.users_day) : ''}</td>
        <td class="n">${num(a.now.sessions_day)}${a.before ? accDelta(a.now.sessions_day, a.before.sessions_day, a.moves?.sessions_day) : ''}</td>
        <td class="n">${num(a.now.users)}</td>
        ${a.features.map((f) => `<td class="n">${num(f.now)}${accDelta(f.now, f.before, f.move)}</td>`).join('')}
        <td class="act" data-nocsv><button class="icon" data-acc-copy="${esc(accountSummary(a, e))}" title="${esc(AC().copySummary)}" aria-label="${esc(AC().copyOf(accountText(a.account)))}">${COPY_ICON}</button></td></tr>`).join('')) : `<p class="meta">${AC().noneDown}</p>`}</section>`
}

// What hurts this account: its worst screens (and the element that irritates there) and the failures that hit it most.
// Every read here already carries the account filter, and so do the links.
async function accountPain() {
  const [s, f] = await Promise.all([read('/api/summary'), read('/api/failures')])
  const screens = s.routes.filter((r) => r.visits && r.score).slice(0, 5)
  const fails = f.failures.slice(0, 5)
  const hot = (r) => { const t = r.targets[0]; return t ? `<span class="why">${esc(AC().hot(`${L.names[t.type] ?? t.type} — ${controlLabel(r.key, t.target) || t.target}`, t.n))}</span>` : '' }
  return `<section class="card"><div class="label">${AC().pain}${help('accountPain')}</div><div class="meta">${AC().painHint}</div>
    <div class="pain"><div><div class="label">${AC().painScreens}</div>
      ${screens.length ? `<ul class="counts">${screens.map((r) => `<li><span><a ${linkAttrs({ tab: 'frustration', params: { route: r.key } })}>${esc(screenText(r.key) || r.key)}</a>${hot(r)}</span>
        <span>${scoreHtml(r.score)}${scoreDelta(r.score, r.before?.score)}</span></li>`).join('')}</ul>` : `<p class="meta">${AC().noPain}</p>`}</div>
    <div><div class="label">${AC().painFailures}</div>
      ${fails.length ? `<ul class="counts">${fails.map((x) => `<li><span><a ${linkAttrs({ tab: 'failures', params: { signal: x.type, detail: x.detail } })}>${esc(L.names[x.type] ?? x.type)}</a>
        <code title="${esc(x.detail)}">${esc(x.detail)}</code></span><span class="meta">${AC().sessionsN(x.sessions)}</span></li>`).join('')}</ul>` : `<p class="meta">${AC().noFail}</p>`}</div></div></section>`
}

      <div class="card"><div class="label">${AC().sessionsDay}</div><div class="big">${num(a.now.sessions_day)} ${a.before ? accDelta(a.now.sessions_day, a.before.sessions_day, a.moves?.sessions_day) : ''}</div></div>
      <div class="card"><div class="label">${AC().people}</div><div class="big">${num(a.now.users)}</div></div>
    </section>

      ${table(`<th>Feature</th><th class="n">${FT().uses}</th><th>${FT().usesByDay}</th>`, e.features.map((f) => { const x = a.features.find((y) => y.id === f.id)
        return `<tr><td>${esc(f.name)}${a.drops.some((d) => d.feature === f.id) ? ` <span class="pill bad">${AC().fell}</span>` : ''}</td><td class="n">${num(x.now)}${accDelta(x.now, x.before, x.move)}</td>
          <td>${spark(days.map((d) => d.features[f.id] ?? 0), `${f.name}: ${FT().usesByDay}`, 120, 28, days.map((d) => d.day))}</td></tr>` }).join(''))}</section>` : `<section class="card"><p class="meta">${AC().noFeatures}</p></section>`}`

// Map ---------------------------------------------------------------------------------------------------------
const MP = () => L.mapTab
const STEP_SHARE = 0.15 // a step shown on the map: at least this share of what follows an element...
const STEP_MIN = 5      // ...and seen at least this many times (2 of 3 is chance, not a route)
async function map() {
  const { screens } = await read('/api/usage')
  if (!screens.length) return empty(L.noVisits)
  if (!screens.some((x) => x.route === state.route)) state.route = screens[0].route
  // A phone opens the phone's drawing when there is one; the toggle remembers the choice for the visit.
  const d = await read('/api/usage', { route: state.route, viewport: state.mapView || (innerWidth < 640 ? 'mobile' : 'desktop') })
  state.mapData = d
  if (state.mapSel && !d.layout?.boxes[state.mapSel] && !d.elements.some((e) => e.target === state.mapSel)) state.mapSel = ''
  const project = state.me.projects.find((p) => p.name === $('#project').value)
  const max = Math.max(1, ...d.paths.map((p) => p.n))
  const nameOf = (t, label) => `${screenText(d.route) || d.route} › ${label || L.unnamed}`
  const lens = state.mapLens || 'routes'
  const open = project?.url
    ? `<div class="open"><span class="meta">${MP().openApp}</span><button data-open-map="heat">${MP().openHeat}</button><button data-open-map="routes">${MP().openRoutes}</button></div>`
    : `<span class="meta">${L.mapNoUrl}</span>`
  return `<section class="card" id="map-card"><div class="head"><div><div class="label">${MP().title}${help('map')}</div><div class="meta">${MP().hint}</div></div>
      <select id="map-screen" aria-label="${L.screen}">${screens.map((x) => `<option value="${esc(x.route)}" ${x.route === state.route ? 'selected' : ''}>${esc(screenText(x.route) ? `${screenText(x.route)} (${x.route})` : x.route)} · ${num(x.visits)}</option>`).join('')}</select></div>
    <div class="mapbar">${d.layout ? `<div class="seg" role="group" aria-label="${MP().lensLabel}">${Object.entries(MP().lenses).map(([k, t]) =>
        `<button data-map-lens="${k}" aria-pressed="${lens === k}">${t}</button>`).join('')}</div>` : ''}
      ${d.layouts.length > 1 ? `<div class="seg" role="group" aria-label="${MP().viewLabel}">${d.layouts.map((k) =>
        `<button data-map-view="${k}" aria-pressed="${d.layout.viewport === k}">${MP().views[k]}</button>`).join('')}</div>` : ''}
      ${open}</div>
    ${state.route.includes(':') && project?.url ? `<p class="meta mapnote">${MP().recordPage}</p>` : ''}
    <div id="map-body">${d.layout ? mapBody() : `<p class="meta mapnote">${MP().noLayout}</p>`}</div></section>
    <section class="card"><div class="label">${MP().routes}</div><div class="meta">${MP().routesHint}</div>
      ${d.paths.length ? `<ol class="mroutes">${d.paths.slice(0, 15).map((p) => `<li>
        <div class="mstep"><span>${named(nameOf(p.from, p.from_label), p.from)}</span><span class="arrow" aria-hidden="true">→</span><span>${named(nameOf(p.to, p.to_label), p.to)}</span></div>
        <div class="mbar"><i style="width:${p.n / max * 100}%"></i><b>${num(p.n)}</b></div></li>`).join('')}</ol>` : `<p class="meta">${MP().noRoutes}</p>`}
    </section>`
}

// What the map knows of each element: its numbers, how much of its clicks irritate and why, its steps out and in as shares.
function mapModel() {
  const d = state.mapData, lay = d.layout, route = d.route
  const byT = Object.fromEntries(d.elements.map((e) => [e.target, e]))
  const nameOf = (t) => controlLabel(route, t) || lay?.labels?.[t] || byT[t]?.label || ''
  const out = {}, inn = {}
  for (const p of d.paths) { (out[p.from] ??= []).push(p); (inn[p.to] ??= []).push(p) }
  const total = (list) => (list ?? []).reduce((a, p) => a + p.n, 0)
  const info = (t) => {
    const e = byT[t] ?? { target: t, clicks: 0, users: 0, rage: 0, dead: 0, errors: 0 }
    const bad = e.rage + e.dead + e.errors
    const rate = bad ? bad / Math.max(e.clicks, bad) : 0
    const reason = Object.entries(e.reasons ?? {}).sort((a, b) => b[1] - a[1])[0]?.[0] ?? ''
    return { ...e, name: nameOf(t), bad, rate, reason, sev: !bad ? 0 : rate < 0.1 ? 1 : rate < 0.3 ? 2 : 3, arrivals: total(inn[t]),
      out: (out[t] ?? []).map((p) => ({ ...p, share: p.n / total(out[t]) })).sort((a, b) => b.n - a.n),
      in: (inn[t] ?? []).map((p) => ({ ...p, share: p.n / total(inn[t]) })).sort((a, b) => b.n - a.n) }
  }
  const all = [...new Set([...Object.keys(lay?.boxes ?? {}), ...d.elements.map((e) => e.target)])].map(info)
  const byTarget = Object.fromEntries(all.map((x) => [x.target, x]))
  const share = (a, b) => byTarget[a]?.out.find((p) => p.to === b)?.share ?? 0
  return { lay, route, all, byT: byTarget, nameOf, share, loop: (a, b) => share(a, b) >= STEP_SHARE && share(b, a) >= STEP_SHARE }
}

// The steps drawn. Nothing picked: each drawn element's most common next step, when it is 15% or more of what follows it.
// One element picked: everything that leaves it.
function mapSteps(m, sel) {
  const boxes = m.lay.boxes
  if (sel) return (m.byT[sel]?.out ?? []).filter((p) => boxes[p.to] && boxes[p.from])
  return m.all.map((x) => x.out[0]).filter((p) => p && p.n >= STEP_MIN && p.share >= STEP_SHARE && boxes[p.from] && boxes[p.to]).sort((a, b) => b.share - a.share)
}

const mapPct = (r) => Math.round(r * 100)
// Why an element irritates, in words: the reason the collector saw most, else what kind of trouble it was.
function mapWhy(x) {
  if (x.reason && L.rageWhy[x.reason]) return MP().mostly(L.rageWhy[x.reason])
  return x.errors >= x.dead && x.errors >= x.rage ? MP().errorsAfter : x.dead >= x.rage ? MP().deadMostly : ''
}

function mapBody() {
  const m = mapModel(), lay = m.lay, lens = state.mapLens || 'routes', sel = m.byT[state.mapSel] ? state.mapSel : ''
  const unnamed = (t) => m.nameOf(t) || unnamedText(t)
  const els = m.all.filter((x) => lay.boxes[x.target])
  const off = m.all.filter((x) => !lay.boxes[x.target] && x.clicks).length
  const maxClicks = Math.max(1, ...els.map((x) => x.clicks))
  const steps = lens === 'routes' ? mapSteps(m, sel) : []
  const ranges = [1, 2, 3, 4].map((i) => [Math.floor(maxClicks * (i - 1) / 4) + 1, Math.ceil(maxClicks * i / 4)])
  const G = MP().legend
  const legend = lens === 'routes'
    ? `<span><i class="ln go"></i>${G.best}</span><span><i class="ln back"></i>${MP().backForth}</span><span>${G.thick}</span><span>${G.min}</span>${sel ? `<span><i class="ln from"></i>${G.from}</span>` : ''}`
    : lens === 'problems'
      ? `<span>${G.problems}</span>${G.sev.map((t, i) => `<span><i class="sw" style="background:var(--ms${i + 1})"></i>${t}</span>`).join('')}<span>${G.calm}</span>`
      : `<span>${G.usage}</span>${ranges.map(([a, b], i) => `<span><i class="sw" style="background:var(--mu${i + 1})"></i>${num(Math.min(a, b))}–${num(b)}</span>`).join('')}<span><i class="sw never"></i>${G.never}</span>`
  const when = new Date(lay.at).toLocaleDateString(PT ? 'pt-BR' : 'en', { day: '2-digit', month: 'short' })
  const hint = sel && lens === 'routes' ? MP().onlyOf(unnamed(sel)) : MP().lensHint[lens]
  return `<p class="meta" id="map-hint" style="margin:8px 0 0">${esc(hint)}</p>
    <div class="mapwrap"><figure class="mapfig"><div id="map-svg">${mapSvg(m, els, steps, lens, sel, maxClicks, unnamed)}</div>
      <figcaption class="maplegend">${legend}</figcaption>
      <p class="meta mapnote">${MP().drawn(when, num(lay.vw))}${off ? ' ' + MP().offMap(off) : ''}</p></figure>
    <aside class="mappanel" aria-live="polite">${sel ? mapPanel(m, m.byT[sel], unnamed) : mapTop(m, els, steps, lens, unnamed)}</aside></div>`
}

// The drawing. Text, pills and arrowheads keep their size on screen: k is page pixels per screen pixel at the drawn width.
function mapSvg(m, els, steps, lens, sel, maxClicks, unnamed) {
  const lay = m.lay, k = state.mapK?.[lay.viewport + lay.vw] ?? Math.max(1, lay.dw / Math.max(280, ($('#content')?.clientWidth ?? 1000) - 380))
  const bottom = Math.max(lay.vh, ...Object.values(lay.boxes).map((b) => b[1] + b[3] + 16))
  const W = lay.dw, H = Math.min(lay.dh, bottom)
  const fs = 12 * k, pad = 6 * k
  const fit = (text, w) => { const n = Math.floor((w - 2 * pad) / (fs * 0.58)); return n < 3 ? '' : text.length > n ? text.slice(0, n - 1) + '…' : text }
  const lm = (lay.landmarks ?? []).map((l) => { const [x, y, w, h] = l.box
    return `<rect class="lm" x="${x}" y="${y}" width="${w}" height="${h}" rx="${6 * k}"/>` }).join('')
  const touched = new Set(sel ? [sel, ...steps.map((p) => p.to), ...m.byT[sel].in.filter((p) => p.share >= STEP_SHARE).map((p) => p.from)] : [])
  const step = (x) => !x.clicks ? 0 : Math.min(4, Math.ceil(x.clicks / maxClicks * 4))
  const pills = [], taken = Object.values(lay.boxes).map((b) => [...b])
  const tipOf = (x) => [unnamed(x.target) + (m.nameOf(x.target) ? '' : ` (${x.target})`), MP().clicks(x.clicks),
    x.bad ? `${MP().irritates(mapPct(x.rate))}${mapWhy(x) ? ` (${mapWhy(x)})` : ''}` : '',
    x.out[0] ? MP().afterX(`${unnamed(x.out[0].to)} ${mapPct(x.out[0].share)}%`) : ''].filter(Boolean).join(' · ')
  const boxes = els.map((x) => {
    const [bx, by, bw, bh] = lay.boxes[x.target]
    const cls = lens === 'problems' ? (x.sev ? 's' + x.sev : '') : lens === 'usage' ? (step(x) ? 'u' + step(x) : 'never') : ''
    const dim = lens === 'routes' && sel && !touched.has(x.target)
    const label = bh >= 15 * k ? fit(unnamed(x.target), bw) : ''
    // The number in words above the element: how much it irritates, or how much it is clicked.
    if (lens === 'problems' && x.sev) pills.push(mapPill(lay.boxes[x.target], MP().irritates(mapPct(x.rate)), k, [W, H], 'bad', taken))
    if (lens === 'usage' && x.clicks) pills.push(mapPill(lay.boxes[x.target], MP().clicks(x.clicks), k, [W, H], 'ink', taken))
    const hit = Math.max(0, 8 * k - Math.min(bw, bh) / 2)
    return `<g class="me ${cls}${sel === x.target ? ' sel' : ''}${dim ? ' dim' : ''}" data-map-el="${esc(x.target)}" tabindex="0" role="button" data-tip="${esc(tipOf(x))}" aria-label="${esc(tipOf(x))}">
      <rect class="hit" x="${bx - hit}" y="${by - hit}" width="${bw + 2 * hit}" height="${bh + 2 * hit}"/>
      <rect class="box" x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="${Math.min(6 * k, bh / 2)}"/>
      ${label ? `<text x="${bx + pad}" y="${by + bh / 2 + 4 * k}" font-size="${fs}">${esc(label)}</text>` : ''}</g>`
  }).join('')
  // A curved arrow from the edge of one element to the edge of the other.
  const curve = (a, b, bend) => {
    const ca = [a[0] + a[2] / 2, a[1] + a[3] / 2], cb = [b[0] + b[2] / 2, b[1] + b[3] / 2]
    const dx = cb[0] - ca[0], dy = cb[1] - ca[1], len = Math.hypot(dx, dy) || 1
    const bd = Math.min(bend * k, len * 0.28), cx = (ca[0] + cb[0]) / 2 - dy / len * bd, cy = (ca[1] + cb[1]) / 2 + dx / len * bd
    const edge = (r, c, tx, ty) => { const ux = tx - c[0], uy = ty - c[1], l = Math.hypot(ux, uy) || 1
      const t = Math.min(r[2] / 2 / (Math.abs(ux / l) || 1e-9), r[3] / 2 / (Math.abs(uy / l) || 1e-9)) + 4 * k
      return [c[0] + ux / l * Math.min(t, l * 0.9), c[1] + uy / l * Math.min(t, l * 0.9)] }
    const [sx, sy] = edge(a, ca, cx, cy), [ex, ey] = edge(b, cb, cx, cy)
    return { d: `M${sx},${sy} Q${cx},${cy} ${ex},${ey}`, mx: 0.25 * sx + 0.5 * cx + 0.25 * ex, my: 0.25 * sy + 0.5 * cy + 0.25 * ey }
  }
  const incoming = lens === 'routes' && sel ? m.byT[sel].in.filter((p) => p.share >= STEP_SHARE && lay.boxes[p.from] && p.from !== sel).map((p) =>
    `<path class="from" d="${curve(lay.boxes[p.from], lay.boxes[sel], 50).d}"/>`).join('') : ''
  const arrows = steps.map((p) => {
    const loop = m.loop(p.from, p.to), c = curve(lay.boxes[p.from], lay.boxes[p.to], 90)
    pills.push(mapPill([c.mx, c.my, 0, 0], `${mapPct(p.share)}%`, k, [W, H], loop ? 'back' : 'go', null))
    return `<path class="${loop ? 'back' : 'go'}" d="${c.d}" stroke-width="${2 + p.share * 7}" marker-end="url(#mk-${loop ? 'back' : 'go'})"/>`
  }).join('')
  const mk = (id, cls) => `<marker id="${id}" class="${cls}" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="${12 * k}" markerHeight="${12 * k}" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>`
  return `<svg class="mapsvg" viewBox="0 0 ${W} ${H}" style="max-width:${W}px" data-k="${k}" role="group" aria-label="${esc(MP().title)}">
    <defs>${mk('mk-go', 'go')}${mk('mk-back', 'back')}</defs>${lm}${boxes}<g class="arr" aria-hidden="true">${incoming}${arrows}</g>
    <g class="pills" aria-hidden="true">${pills.join('')}</g></svg>`
}

// Words on the drawing: a percentage centred on an arrow (no `taken`), or a number next to an element — above it, else
// right, left or below, wherever it covers no other element or word (`taken` collects what is already there).
function mapPill(box, text, k, [W, H], kind, taken) {
  const fs = 12 * k, w = text.length * fs * 0.6 + 14 * k, h = 20 * k, g = 3 * k
  const [bx, by, bw, bh] = box
  let left = bx + bw / 2 - w / 2, top = by + bh / 2 - h / 2
  if (taken) {
    const hits = (l, t) => t < 0 || l < 0 || l + w > W || t + h > H || taken.some((r) => r !== box && l < r[0] + r[2] && l + w > r[0] && t < r[1] + r[3] && t + h > r[1] &&
      !(r[0] === bx && r[1] === by && r[2] === bw && r[3] === bh))
    const spots = [[bx, by - h - g], [bx + bw + g, by + bh / 2 - h / 2], [bx - w - g, by + bh / 2 - h / 2], [bx, by + bh + g],
      ...(bw >= 2 * w ? [[bx + bw - w - g, by + bh / 2 - h / 2]] : [])] // a wide row with no room around: inside, at its right end
    ;[left, top] = spots.find(([l, t]) => !hits(l, t)) ?? spots[0]
    taken.push([left, top, w, h])
  }
  left = Math.max(0, Math.min(left, W - w)); top = Math.max(0, Math.min(top, H - h))
  return `<g class="pill ${kind}"><rect x="${left}" y="${top}" width="${w}" height="${h}" rx="${h / 2}"/><text x="${left + 7 * k}" y="${top + 14 * k}" font-size="${fs}">${esc(text)}</text></g>`
}

const mapItem = (t, name, value, say = '', dim = false) => `<li><button data-map-el="${esc(t)}"${dim ? ' class="dim"' : ''}><span class="name">${esc(name)}</span><span class="num">${esc(value)}</span>${say ? `<span class="say">${say}</span>` : ''}</button></li>`
const mapChip = (kind, text) => `<span class="chip ${kind}">${esc(text)}</span>`

// Nothing picked: what to look at under the lens, strongest first, and a reading of it.
function mapTop(m, els, steps, lens, unnamed) {
  let title, lead, items, note = ''
  if (lens === 'routes') {
    title = MP().look; lead = MP().lookLead
    items = steps.map((p) => mapItem(p.from, `${unnamed(p.from)} → ${unnamed(p.to)}`, `${mapPct(p.share)}%`,
      esc(MP().times(p.n)) + (m.loop(p.from, p.to) ? ' · ' + mapChip('warn', MP().backForth) : '')))
    const strong = steps.find((p) => p.share >= 0.6), loop = steps.find((p) => m.loop(p.from, p.to))
    note = !steps.length ? MP().noSteps : [strong && MP().readStrong(mapPct(strong.share), unnamed(strong.from), unnamed(strong.to)),
      loop && MP().readLoop(unnamed(loop.from), unnamed(loop.to)), !strong && !loop && MP().readSpread].filter(Boolean).join(' ')
  } else if (lens === 'problems') {
    title = MP().irritTitle; lead = MP().irritLead
    const bad = m.all.filter((x) => x.bad).sort((a, b) => b.rate - a.rate || b.bad - a.bad)
    items = bad.slice(0, 8).map((x) => mapItem(x.target, unnamed(x.target), `${mapPct(x.rate)}%`, esc(mapWhy(x))))
    const first = bad[0]
    note = !first ? MP().noProblems : MP().fixFirst(unnamed(first.target), mapPct(first.rate), L.rageFix[first.reason] ?? '')
  } else {
    title = MP().useTitle; lead = MP().useLead
    items = m.all.filter((x) => x.clicks).sort((a, b) => b.clicks - a.clicks).slice(0, 8).map((x) => mapItem(x.target, unnamed(x.target), num(x.clicks), `<code>${esc(x.target)}</code>`))
    const never = els.filter((x) => !x.clicks).length
    note = never ? MP().neverN(never) : ''
  }
  return `<h3>${esc(title)}</h3><p class="lead">${esc(lead)}</p>${items.length ? `<ol>${items.join('')}</ol>` : ''}${note ? `<div class="note">${esc(note)}</div>` : ''}`
}

// One element picked: its numbers, why it irritates, where people go after it and where they come from, and a reading.
function mapPanel(m, x, unnamed) {
  const name = unnamed(x.target)
  const after = x.out.map((p) => mapItem(p.to, MP().afterX(unnamed(p.to)), `${mapPct(p.share)}%`,
    esc(MP().times(p.n)) + (m.loop(p.from, p.to) ? ' · ' + mapChip('warn', MP().backForth) : ''), p.share < STEP_SHARE))
  const before = x.in.slice(0, 3).map((p) => mapItem(p.from, MP().beforeX(unnamed(p.from)), `${mapPct(p.share)}%`, esc(MP().arrivals(p.n, x.arrivals))))
  const top = x.out[0]
  const note = !top ? MP().noNext(name) : top.share >= 0.6 ? MP().oneNext(name, unnamed(top.to)) : MP().spread(name)
  return `<button class="back" data-map-el="">${MP().allRoutes}</button>
    <h3>${esc(name)}</h3><p class="lead">${esc(MP().clicks(x.clicks))}${x.bad ? ' · ' + mapChip('bad', MP().irritates(mapPct(x.rate))) : ''}
      ${x.bad && mapWhy(x) ? `<br>${esc(mapWhy(x))}` : ''}<br><code class="tech">${esc(x.target)}</code></p>
    ${after.length || before.length ? `<ol>${after.join('')}${before.join('')}</ol>` : ''}<div class="note">${esc(note)}</div>`
}

// The lens, the element picked and the window size redraw the card only; the screen size reads the other drawing.
function onMapClick(el) {
  if (el.dataset.mapView !== undefined) { state.mapView = el.dataset.mapView; state.mapSel = ''; return render() }
  // Like the reference: another lens drops the pick; picking an element shows its routes.
  if (el.dataset.mapLens !== undefined) { state.mapLens = el.dataset.mapLens; if (state.mapLens !== 'routes') state.mapSel = '' }
  if (el.dataset.mapEl !== undefined) { state.mapSel = state.mapSel === el.dataset.mapEl ? '' : el.dataset.mapEl; if (state.mapSel) state.mapLens = 'routes' }
  redrawMap(el.dataset.mapEl ?? null)
}
function redrawMap(focus = null) {
  const body = $('#map-body'); if (!body || !state.mapData?.layout) return
  document.querySelectorAll('[data-map-lens]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mapLens === (state.mapLens || 'routes'))))
  tip.hidden = true
  body.innerHTML = mapBody()
  fitMap()
  if (focus) body.querySelector(`.mapsvg [data-map-el="${CSS.escape(focus)}"]`)?.focus({ preventScroll: true })
}
// Measures the drawing once on the page: text and arrowheads keep their screen size at any width.
function fitMap() {
  const svg = $('#map-svg svg'), lay = state.mapData?.layout; if (!svg || !lay) return
  const k = Math.max(1, lay.dw / svg.getBoundingClientRect().width)
  ;(state.mapK ??= {})[lay.viewport + lay.vw] = k
  if (Math.abs(k - Number(svg.dataset.k)) / k > 0.04) { $('#map-body').innerHTML = mapBody() }
}
let mapResize = 0
addEventListener('resize', () => { clearTimeout(mapResize); mapResize = setTimeout(() => { if (state.tab === 'map' && $('#map-svg')) { state.mapK = {}; redrawMap() } }, 150) })

// Dictionary ---------------------------------------------------------------------------------------------------
const D = () => L.dict
async function dictionary() {
  const d = await read('/api/dictionary')
  state.dict = d
  return `<section class="card"><div class="head"><div><div class="label">${D().title}${help('dictionary')}</div><div class="meta">${D().hint}</div></div>
      <input id="dict-filter" type="search" placeholder="${D().filter}" aria-label="${D().filter}" value="${esc(state.dictFilter ?? '')}" style="min-width:260px"></div></section>
    <div id="dict-body">${dictBody()}</div>`
}
function dictBody() {
  const d = state.dict, f = (state.dictFilter ?? '').trim().toLowerCase()
  const hit = (x, ...extra) => !f || [x.key, x.auto, x.name, ...extra].some((v) => String(v ?? '').toLowerCase().includes(f))
  const section = (kind, title, list, keyHtml, extraHead = '', extraCell = () => '') => {
    const shown = list.filter((x) => hit(x, kind === 'control' ? screenText(x.route) : ''))
    return `<section class="card" data-scroll><div class="label">${title} · ${list.length}</div>
      ${shown.length ? table(`<th>${D().key}</th><th>${kind === 'account' ? '' : D().auto}</th><th>${D().name}</th>${extraHead}<th class="n">${D().used}</th>`,
        shown.map((x) => `<tr><td>${keyHtml(x)}</td><td>${esc(x.auto) || '<span class="meta">—</span>'}</td>
          <td><input class="dict-name" data-kind="${kind}" data-key="${esc(x.key)}" value="${esc(x.name)}" placeholder="${kind === 'account' ? D().accountPlaceholder : esc(x.auto || D().placeholder)}" aria-label="${D().name}"></td>
          ${extraCell(x)}<td class="n">${num(x.used)}</td></tr>`).join('')) : `<p class="meta">${D().none}</p>`}
      </section>`
  }
  const areaOf = (route) => (NM().areas ?? {})[route] ?? ''
  return section('screen', D().screens, d.screens, (x) => `<code>${esc(x.key)}</code>`, `<th>${PR().area}</th>`,
      (x) => `<td><input class="dict-name" data-kind="area" data-key="${esc(x.key)}" value="${esc(areaOf(x.key))}" placeholder="${PR().areaPh}" aria-label="${PR().area}"></td>`)
    + section('control', D().controls, d.controls, (x) => `<span class="nm">${esc(screenText(x.route) || x.route)}</span><code class="tech">${esc(x.target)}</code>`)
    + section('action', D().actions, d.actions, (x) => `<code>${esc(x.key)}</code>`)
    + section('account', D().accounts, d.accounts, (x) => `<code>${esc(x.key)}</code>`, `<th class="n">${D().users}</th>`, (x) => `<td class="n">${x.users}</td>`)
}
async function saveName(input) {
  const res = await fetch('/api/names?project=' + encodeURIComponent($('#project').value), { method: 'POST',
    body: JSON.stringify({ kind: input.dataset.kind, key: input.dataset.key, name: input.value }) })
  if (res.status === 401) return boot()
  if (!res.ok) return
  const item = input.dataset.kind === 'area' ? null : Object.values(state.dict).flat().find((x) => x.key === input.dataset.key)
  if (item) item.name = input.value.trim()
  state.names = await (await fetch('/api/names?project=' + encodeURIComponent($('#project').value))).json()
  await loadFilters(true)
  input.classList.add('saved'); setTimeout(() => input.classList.remove('saved'), 1200)
}

const TABS = { overview, product, frustration, failures, usage, journeys, map, people, actions, versions, features, accounts, dictionary }

async function render() {
  clearTimeout(waitTimer)
  const seq = ++renderSeq
  busy(true)
  try { await draw(seq) } finally { if (seq === renderSeq) busy(false) }
}
async function draw(seq) {
  const project = state.me.projects.find((p) => p.name === $('#project').value)
  markTab()
  filterBar()
  markChip()
  try {
    if (!(await hasEvents())) {
      if (seq !== renderSeq) return
      $('#content').innerHTML = setup(project)
      writeHash()
      // Poll until the first event lands, then show the dashboard and its filters, and say it arrived.
      const wait = async () => {
        if (await hasEvents().catch(() => false)) { state.arrived = { project: project.name, at: state.status.first_at }; await loadFilters(); return render() }
        waitTimer = setTimeout(wait, 3000)
      }
      waitTimer = setTimeout(wait, 3000)
      return
    }
  } catch (error) {
    if (error.message === 'signed out') return
  }
  try {
    const html = state.status?.in_view === false && !NO_PERIOD_TABS.includes(state.tab) ? emptyState() : await TABS[state.tab]()
    if (seq !== renderSeq) return // a newer tab or filter was picked meanwhile: that one draws
    const came = state.arrived?.project === project.name ? state.arrived : null
    $('#content').innerHTML = (came ? `<div class="card arrived" role="status"><span class="dot" aria-hidden="true"></span>${esc(L.nodata.arrived(project.name,
      new Date(came.at).toLocaleTimeString(PT ? 'pt-BR' : 'en', { hour: '2-digit', minute: '2-digit', second: '2-digit' })))}</div>` : '') + html
    state.arrived = null
    describeTips()
    $('#open-map')?.addEventListener('click', () => openMap(state.route))
    document.querySelectorAll('[data-open-map]').forEach((b) => b.addEventListener('click', () => openMap(state.route, b.dataset.openMap)))
    if (state.tab === 'map') fitMap()
    addCsvButtons()
    paginate()
    writeHash()
    if (state.focus) ($('#content .failure') ?? $('#content tr.sel'))?.scrollIntoView({ block: $('#content .failure') ? 'start' : 'center' })
    state.focus = false
  } catch (error) {
    if (error.message !== 'signed out' && seq === renderSeq) $('#content').innerHTML = empty(L.failed + esc(error.message))
  }
}

function onContentClick(e) {
  const mapEl = e.target.closest?.('[data-map-el],[data-map-lens],[data-map-view]')
  if (mapEl) return onMapClick(mapEl)
  const none = e.target.closest('[data-empty]')
  if (none) return onEmptyClick(none)
  const copy = e.target.closest('[data-copy]')
  if (copy) {
    const was = copy.textContent
    navigator.clipboard?.writeText(copy.dataset.copy).then(() => { copy.textContent = L.copied; setTimeout(() => { copy.textContent = was }, 1500) })
    return
  }
  const flow = e.target.closest('[data-flow]')
  if (flow) { e.preventDefault(); state.route = flow.dataset.flow; return render() }
  const drop = e.target.closest('[data-funnel-remove]')
  if (drop) { const s = funnelSteps(); s.splice(Number(drop.dataset.funnelRemove), 1); state.funnel = s.length ? JSON.stringify(s) : ''; return render() }
  const report = e.target.closest('#copy-report')
  if (report) {
    report.textContent = L.copying
    // Asked inside the click, so the browser lets the page write to the clipboard once the text arrives.
    const text = fetch(`/api/report?${query({ format: 'md' })}`).then((r) => r.text())
    const done = () => { report.textContent = L.copiedReport; setTimeout(() => { report.textContent = L.copyReport }, 1500) }
    const item = typeof ClipboardItem !== 'undefined' ? new ClipboardItem({ 'text/plain': text.then((t) => new Blob([t], { type: 'text/plain' })) }) : null
    ;(item ? navigator.clipboard.write([item]) : text.then((t) => navigator.clipboard.writeText(t))).then(done, () => { report.textContent = L.copyReport })
    return
  }
  const more = e.target.closest('[data-session]')
  if (more) return showSession(more)
  const tr = e.target.closest('tr.row'); if (!tr) return
  if (tr.dataset.signal !== undefined) return go('failures', { signal: tr.dataset.signal, detail: tr.dataset.detail })
  if (tr.dataset.open !== undefined) {
    const d = document.querySelector(`tr[data-of="${tr.dataset.open}"]`)
    d.hidden = !d.hidden; tr.setAttribute('aria-expanded', String(!d.hidden))
    state.route = d.hidden ? '' : tr.dataset.key; writeHash()
  } else if (tr.dataset.route !== undefined) { state.route = tr.dataset.route; render() }
  else if (tr.dataset.user !== undefined) { state.user = state.user === tr.dataset.user ? '' : tr.dataset.user; render() }
}

// A link, the back button or a pasted address: the hash decides the tab, the filters and what is open.
addEventListener('hashchange', async () => {
  if (!$('#content')) return
  const project = $('#project').value
  readHash()
  const want = state.hash.get('project')
  if (want && [...$('#project').options].some((o) => o.value === want)) $('#project').value = want
  $('#days').value = state.hash.get('days') || (state.hash.toString() ? '7' : $('#days').value)
  if ($('#project').value !== project) await loadFilters()
  for (const k of ['version', 'account', 'role', 'feature']) {
    const v = state.hash.get(k) || ''
    $('#' + k).value = [...$('#' + k).options].some((o) => o.value === v) ? v : ''
  }
  state.focus = true
  render()
})

async function boot() {
  readHash()
  state.me = await (await fetch('/api/me')).json()
  const params = new URLSearchParams(location.search)
  if (!state.me.signed_in) return signin(params.get('error'))
  if (params.has('error')) history.replaceState(null, '', location.pathname + location.hash)
  if (!state.me.projects.length) { $('#app').innerHTML = `<main>${empty(L.noProjects)}</main>`; return }
  shell()
  await loadFilters()
  render()
}
boot()
