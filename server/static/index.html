<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termometro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M14 14.76V5a2 2 0 0 0-4 0v9.76a4 4 0 1 0 4 0Z' fill='%23e5484d'/%3E%3C/svg%3E">
<style>
/* No web fonts and no third-party requests: the dashboard of a privacy tool should not call anyone. */
:root {
  --canvas: #f6f6f8; --surface: #ffffff; --sunken: #f1f1f4; --line: #e7e7ec; --line-strong: #d6d6de;
  --fg: #18181b; --fg2: #4b4b55; --faint: #6b6b76;
  --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: #eef0ff; --on-accent: #ffffff; --brand: #e5484d;
  --ok: #15803d; --ok-soft: #e8f7ee; --warn: #a16207; --warn-soft: #fdf4e3; --bad: #c2262e; --bad-soft: #fdecec;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04); --ease: cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #111114; --surface: #1a1a1f; --sunken: #15151a; --line: #2a2a31; --line-strong: #3a3a43;
    --fg: #f4f4f5; --fg2: #c9c9d1; --faint: #9b9ba6;
    --accent: #a5b4fc; --accent-hover: #c7d2fe; --accent-soft: #23243d; --on-accent: #111114; --brand: #ff6b70;
    --ok: #6ee7a0; --ok-soft: #12261b; --warn: #f5c451; --warn-soft: #2b2312; --bad: #ff8a8f; --bad-soft: #2f1618;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 400 14px/20px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--canvas); color: var(--fg);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
select, button, input { font: inherit; color: inherit; height: 36px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); }
button, .button { cursor: pointer; font-weight: 500; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
button:hover { background: var(--sunken); }
.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.primary:hover { background: var(--accent-hover); }
:is(select, button, input, a):focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.mark { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
.mark svg { width: 20px; height: 20px; color: var(--brand); }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; }
.top .mark { margin-right: auto; }
.field { display: flex; align-items: center; gap: 6px; }
.who { display: flex; align-items: center; gap: 8px; }
nav.tabs { display: flex; gap: 4px; padding: 0 16px; overflow-x: auto; }
nav.tabs a { display: flex; align-items: center; height: 40px; padding: 0 12px; color: var(--fg2); font-weight: 500; border-bottom: 2px solid transparent; text-decoration: none; white-space: nowrap; }
nav.tabs a.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.chip button { height: 22px; width: 22px; padding: 0; border: 0; background: none; color: inherit; }
main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.label { font-size: 12px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--faint); }
.meta { color: var(--faint); font-size: 12px; line-height: 16px; }
.numbers { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.big { font-size: 32px; line-height: 40px; font-weight: 700; margin-top: 4px; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); } .pill.idea { background: var(--accent-soft); color: var(--accent); } .pill.warn { background: var(--warn-soft); } .pill.bad { background: var(--bad-soft); }
.table { overflow-x: auto; margin: 8px -16px -16px; }
table { width: 100%; border-collapse: collapse; }
th { height: 40px; padding: 0 12px; text-align: left; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .03em; color: var(--faint); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr.row { cursor: pointer; transition: background .15s var(--ease); }
tbody tr.row:hover { background: var(--sunken); }
tbody tr.sel { background: var(--accent-soft); }
code { font: 12px/16px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg2); overflow-wrap: anywhere; }
.route { font-weight: 500; overflow-wrap: break-word; min-width: 8em; }
.bar { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; margin-top: 6px; min-width: 80px; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.signals { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--fg2); min-width: 10em; }
.detail td { background: var(--sunken); }
.detail ul { margin: 4px 0 8px; padding-left: 18px; }
.empty { padding: 32px 16px; text-align: center; color: var(--faint); }
details summary { cursor: pointer; color: var(--fg2); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; justify-content: space-between; }
/* Sign-in */
.signin { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.signin .card { width: 100%; max-width: 380px; padding: 28px; display: grid; gap: 16px; text-align: center; }
.signin form { display: grid; gap: 10px; }
.signin input { width: 100%; }
.or { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 12px; }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.setup { display: grid; gap: 16px; max-width: 760px; margin: 0 auto; width: 100%; }
.setup pre { margin: 8px 0 0; padding: 12px 14px; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto;
  font: 12px/18px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); white-space: pre; }
.snippet { position: relative; }
.snippet button { position: absolute; top: 6px; right: 6px; height: 28px; font-size: 12px; }
.waiting { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s var(--ease) infinite; }
@keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.error { color: var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
/* Search */
.search { position: relative; flex: 1 1 220px; max-width: 360px; }
.search input { width: 100%; }
.results { position: absolute; top: 40px; left: 0; right: 0; min-width: 300px; max-height: 70vh; overflow-y: auto; z-index: 10; background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,.12); padding: 6px; }
.results .group { padding: 8px 8px 4px; }
.results a { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; }
.results a:hover, .results a.on { background: var(--accent-soft); }
.results a code { flex: 1; min-width: 0; color: inherit; }
/* Failures */
.failure .title { margin: 4px 0; font-size: 15px; } .failure .title code { font-size: 14px; line-height: 20px; color: var(--fg); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-top: 16px; }
.counts { list-style: none; margin: 6px 0 0; padding: 0; } .counts li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.counts li span { overflow-wrap: anywhere; }
pre.stack { margin: 8px 0 0; padding: 10px 12px; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto;
  font: 12px/18px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
.trails { display: grid; gap: 12px; margin-top: 8px; }
.trail { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.steps { margin: 8px 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.steps li { display: flex; gap: 10px; padding: 3px 6px; border-radius: 4px; overflow-wrap: anywhere; }
.steps .t { flex: 0 0 76px; text-align: right; color: var(--faint); font-size: 12px; }
.steps li.sig { color: var(--warn); } .steps li.here { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
button.small { height: 28px; font-size: 12px; }
/* Journeys */
.flow { display: grid; grid-template-columns: 1fr minmax(160px, auto) 1fr; gap: 16px; align-items: start; margin-top: 12px; }
.flow .here { text-align: center; padding: 12px; border-radius: 10px; background: var(--accent-soft); align-self: center; }
@media (max-width: 640px) { .flow { grid-template-columns: 1fr; } }
.counts a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; } .counts a:hover { text-decoration: underline; }
.funnel { display: grid; gap: 12px; margin-top: 12px; max-width: 720px; }
.fhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 500; overflow-wrap: anywhere; }
.bar.big { height: 12px; border-radius: 4px; }
/* Overview */
.delta { font-size: 12px; font-weight: 600; margin-left: 4px; }
.insights { list-style: none; margin: 8px 0 0; padding: 0; display: grid; }
.insights li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.insights li:first-child { border-top: 0; }
.insights .text { flex: 1; min-width: 0; }
.insights a { white-space: nowrap; color: var(--accent); font-weight: 500; text-decoration: none; }
.insights a:hover { text-decoration: underline; }
.trend { display: block; width: 100%; height: 72px; margin-top: 8px; }
.trend rect.day { fill: var(--accent); }
.trend rect.hit { fill: transparent; }
.trend g:hover rect.day { fill: var(--accent-hover); }
.trend line { stroke: var(--line-strong); stroke-width: 1; }
</style>
</head>

const $ = (s) => document.querySelector(s)
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const band = (n) => (n >= 50 ? 'bad' : n >= 20 ? 'warn' : 'ok')
const say = (n) => (n >= 50 ? L.much : n >= 20 ? L.attention : L.calm)
const scoreHtml = (n) => `<b class="${band(n)}">${n}</b>`
const keep = (k, v) => { try { localStorage.setItem('termometro.' + k, v) } catch {} }
const recall = (k) => { try { return localStorage.getItem('termometro.' + k) } catch { return null } }
const ago = (at) => {
  const m = Math.floor((Date.now() - at) / 60000)
  return m < 1 ? L.now : m < 60 ? L.ago(m, 'm') : m < 1440 ? L.ago(Math.floor(m / 60), 'h') : L.ago(Math.floor(m / 1440), 'd')
}
const short = (id) => (id.length > 12 ? id.slice(0, 8) + '…' : id)
const table = (head, rows) => `<div class="table"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`
const empty = (msg) => `<div class="card empty">${msg}</div>`
const signals = (s) => {
  const items = Object.entries(s).sort((a, b) => b[1] - a[1])
  return items.length ? `<div class="signals">${items.map(([k, n]) => `<span>${esc(L.names[k] ?? k)} <b>${n}</b></span>`).join('')}</div>` : `<span class="meta">${L.none}</span>`
}

const state = { me: null, tab: 'overview', user: '', route: '', action: '', a: '', b: '', signal: '', detail: '', funnel: '', hash: new URLSearchParams(), focus: false }

// Address: #tab?project=…&days=…&route=… — every view can be linked to and the back button works.
const FILTERS = ['project', 'days', 'version', 'account', 'role']
const PARAMS = ['user', 'route', 'action', 'a', 'b', 'signal', 'detail', 'funnel']
function readHash() {
  const [tab, qs] = location.hash.slice(1).split('?')
  state.tab = TABS[tab] ? tab : 'overview'
  state.hash = new URLSearchParams(qs || '')
  for (const k of PARAMS) state[k] = state.hash.get(k) || ''
}
function hashFor(tab, params = {}) {
  const p = new URLSearchParams()
  for (const k of FILTERS) { const v = k in params ? params[k] : $('#' + k)?.value; if (v && !(k === 'days' && v === '7')) p.set(k, v) }
  for (const k of PARAMS) { const v = k in params ? params[k] : k === 'user' ? state.user : ''; if (v) p.set(k, v) }
  return '#' + tab + (p.toString() ? '?' + p : '')
}
function writeHash() {
  const h = hashFor(state.tab, Object.fromEntries(PARAMS.map((k) => [k, state[k]])))
  state.hash = new URLSearchParams(h.split('?')[1] || '')
  if (location.hash !== h) history.replaceState(null, '', h)
}
const go = (tab, params) => { location.hash = hashFor(tab, params).slice(1) }
const linkAttrs = (link) => `href="${esc(hashFor(link.tab, link.params))}"`

// Sign-in --------------------------------------------------------------------------------------------------
function signin(error) {
  const m = state.me.methods
  $('#app').innerHTML = `<div class="signin"><div class="card">
    <div class="mark" style="justify-content:center">${MARK}Termometro</div>
    <div class="meta">${L.signinTitle}</div>
    ${error ? `<div class="error" role="alert">${esc(L.errors[error] ?? error)}</div>` : ''}
    ${m.google ? `<a class="button primary" href="/auth/google" style="height:40px">${L.google}</a>` : ''}
    ${m.google && m.password ? `<div class="or">${L.or}</div>` : ''}
    ${m.password ? `<form id="pw"><input type="password" name="password" placeholder="${L.password}" aria-label="${L.password}" autocomplete="current-password" required>
      <button class="${m.google ? '' : 'primary'}" type="submit">${L.enter}</button></form>` : ''}
  </div></div>`
  $('#pw')?.addEventListener('submit', async (e) => {
    e.preventDefault()
    const res = await fetch('/api/login', { method: 'POST', body: JSON.stringify({ password: e.target.password.value }) })
    if (res.ok) return boot()
    signin(res.status === 429 ? 'limit' : 'wrong')
  })
}

// Shell ----------------------------------------------------------------------------------------------------
function shell() {
  const projects = state.me.projects
  $('#app').innerHTML = `
    <header>
      <div class="top">
        <div class="mark">${MARK}Termometro</div>
        <div class="search" role="search"><input id="search" type="search" placeholder="${L.search}" aria-label="${L.search}" autocomplete="off"
          aria-controls="results"><div id="results" class="results" hidden></div></div>
        <label class="field"><span class="meta">${L.project}</span><select id="project">${projects.map((p) => `<option>${esc(p.name)}</option>`).join('')}</select></label>
        <label class="field"><span class="meta">${L.period}</span><select id="days">
          <option value="1">${L.day}</option>${[7, 30, 90].map((n) => `<option value="${n}" ${n === 7 ? 'selected' : ''}>${L.days(n)}</option>`).join('')}</select></label>
        <label class="field"><span class="meta">${L.version}</span><select id="version"></select></label>
        <label class="field"><span class="meta">${L.account}</span><select id="account"></select></label>
        <label class="field"><span class="meta">${L.role}</span><select id="role"></select></label>
        <span id="user-chip"></span>
        ${state.me.no_auth ? '' : `<span class="who"><span class="meta">${esc(state.me.email)}</span><button id="signout">${L.signout}</button></span>`}
      </div>
      <nav class="tabs">${Object.entries(L.tabs).map(([k, v]) => `<a href="#${k}" data-tab="${k}">${v}</a>`).join('')}</nav>
    </header>
    <main id="content"></main>`
  const project = state.hash.get('project') ?? recall('project'); if (projects.some((p) => p.name === project)) $('#project').value = project
  const days = state.hash.get('days') ?? recall('days'); if ([...$('#days').options].some((o) => o.value === days)) $('#days').value = days
  $('#project').addEventListener('change', async () => {
    keep('project', $('#project').value); for (const k of PARAMS) state[k] = ''
    state.hash = new URLSearchParams(); await loadFilters(); render()
  })
  for (const id of ['days', 'version', 'account', 'role']) $('#' + id).addEventListener('change', () => { keep(id, $('#' + id).value); render() })
  $('nav.tabs').addEventListener('click', (e) => {
    const a = e.target.closest('a[data-tab]'); if (!a) return
    e.preventDefault(); go(a.dataset.tab, { route: state.route, a: state.a, b: state.b, funnel: state.funnel })
  })
  wireSearch()
  $('#signout')?.addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST' }); boot() })
  $('#content').addEventListener('click', onContentClick)
  $('#content').addEventListener('change', (e) => {
    if (e.target.id === 'cmp-a' || e.target.id === 'cmp-b') { state.a = $('#cmp-a').value; state.b = $('#cmp-b').value; render() }
    if (e.target.id === 'flow-screen') { state.route = e.target.value; render() }
    if (e.target.id === 'funnel-add' && e.target.value) { state.funnel = JSON.stringify([...funnelSteps(), e.target.value]); render() }
  })
  $('#content').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('tr.row')) e.target.click() })
  document.addEventListener('click', (e) => { if (e.target.closest('#remove-user')) { state.user = ''; render() } })
}

async function loadFilters() {
  const f = await (await fetch('/api/filters?project=' + encodeURIComponent($('#project').value))).json()
  const fill = (id, values, all) => {
    const current = state.hash.has(id) ? state.hash.get(id) : state.hash.toString() ? '' : $('#' + id).value || recall(id) || ''
    $('#' + id).innerHTML = `<option value="">${all}</option>` + values.map((v) => `<option>${esc(v)}</option>`).join('')
    $('#' + id).value = values.includes(current) ? current : ''
  }
  fill('version', f.versions, L.allf); fill('account', f.accounts, L.all); fill('role', f.roles, L.all)
}

function query(extra = {}) {
  const q = new URLSearchParams({ project: $('#project').value, days: $('#days').value })
  for (const k of ['version', 'account', 'role']) if ($('#' + k).value) q.set(k, $('#' + k).value)
  if (state.user) q.set('user', state.user)
  for (const [k, v] of Object.entries(extra)) if (v) q.set(k, v)
  return q
}
async function read(path, extra) {
  const res = await fetch(`${path}?${query(extra)}`)
  if (res.status === 401) { boot(); throw new Error('signed out') }
  return res.json()
}

// Search ---------------------------------------------------------------------------------------------------
function wireSearch() {
  const input = $('#search'), box = $('#results')
  let timer = 0, seq = 0
  const close = () => { box.hidden = true; input.setAttribute('aria-expanded', 'false') }
  const show = async () => {
    const q = input.value.trim()
    if (q.length < 2) return close()
    const mine = ++seq
    const { results } = await read('/api/search', { q }).catch(() => ({ results: [] }))
    if (mine !== seq) return
    const groups = {}
    for (const r of results) (groups[r.kind] ??= []).push(r)
    box.innerHTML = results.length ? Object.entries(groups).map(([kind, list]) => `<div class="group label">${L.kinds[kind]}</div>` + list.map((r) =>
      `<a ${linkAttrs(r.link)}><code>${esc(r.type ? (L.names[r.type] ?? r.type) + ': ' + r.label : r.label)}</code>
        <span class="meta">${r.route && r.kind !== 'screen' ? esc(r.route) + ' · ' : ''}${r.n}</span></a>`).join('')).join('')
      : `<div class="empty">${L.noResults}</div>`
    box.hidden = false; input.setAttribute('aria-expanded', 'true')
  }
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(show, 200) })
  input.addEventListener('focus', () => { if (box.innerHTML && input.value.trim().length >= 2) box.hidden = false })
  input.addEventListener('keydown', (e) => {
    const items = [...box.querySelectorAll('a')], at = items.findIndex((a) => a.classList.contains('on'))
    if (e.key === 'Escape') { close(); input.blur() }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!items.length) return
      const next = (at + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length
      items.forEach((a, i) => a.classList.toggle('on', i === next)); items[next].scrollIntoView({ block: 'nearest' })
    } else if (e.key === 'Enter' && items.length) { e.preventDefault(); (items[at] ?? items[0]).click() }
  })
  box.addEventListener('click', (e) => { if (e.target.closest('a')) { close(); input.blur() } })
  document.addEventListener('click', (e) => { if (!e.target.closest('.search')) close() })
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !e.target.matches('input, select, textarea')) { e.preventDefault(); input.focus(); input.select() }
  })
}

// Overview -------------------------------------------------------------------------------------------------
async function overview() {
  const o = await read('/api/overview')
  const n = o.now, b = o.before
  if (!n.visits && !b.visits) return empty(L.noVisits)
  // Higher is worse for the score and the failures; for visits and people it is only change.
  const diff = (now, before, worseUp) => {
    if (!before) return ''
    const pct = Math.round((now - before) / before * 100)
    if (!pct) return `<span class="delta meta">=</span>`
    const cls = worseUp === undefined ? 'meta' : (pct > 0) === worseUp ? 'bad' : 'ok'
    return `<span class="delta ${cls}">${pct > 0 ? '+' : ''}${pct}%</span>`
  }
  const points = n.score - b.score
  const vs = o.days === 1 ? L.vsDay : L.vsBefore(o.days)
  const W = 600, H = 72, gap = 2, days = o.daily, bw = days.length ? W / days.length : W
  const top = Math.max(10, ...days.map((d) => d.score)) // scaled to the worst day, so small changes still show
  const trend = days.length > 1 ? `<div class="card"><div class="label">${L.scoreByDay}</div>
    <svg class="trend" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${L.scoreByDay}">
      <line x1="0" x2="${W}" y1="${H - 0.5}" y2="${H - 0.5}"/>
      ${days.map((d, i) => { const h = Math.max(2, d.score / top * (H - 4)); return `<g><title>${esc(L.dayTip(d.day, d.score, d.visits))}</title>
        <rect class="hit" x="${i * bw}" y="0" width="${bw}" height="${H}"/>
        <rect class="day" x="${i * bw + gap / 2}" y="${H - h}" width="${Math.max(1, bw - gap)}" height="${h}" rx="2"/></g>` }).join('')}
    </svg><div class="meta">${esc(days[0].day)} → ${esc(days[days.length - 1].day)} · ${L.peak(Math.max(...days.map((d) => d.score)))}</div></div>` : ''
  const sentence = (i) => {
    const safe = Object.fromEntries(Object.entries(i).map(([k, v]) => [k, typeof v === 'string' ? esc(v) : v]))
    return L.insight[i.kind](safe, esc(L.names[i.type ?? i.top_signal] ?? i.type ?? i.top_signal ?? ''))
  }
  return `
    <section class="numbers">
      <div class="card"><div class="label">${L.overall}</div><div class="big ${band(n.score)}">${n.score}${b.visits ? `<span class="delta ${points > 0 ? 'bad' : points < 0 ? 'ok' : 'meta'}">${points > 0 ? '+' : ''}${points || '='}</span>` : ''}</div>
        <span class="pill ${band(n.score)}">${say(n.score)}</span></div>
      <div class="card"><div class="label">${L.visits}</div><div class="big">${n.visits}${diff(n.visits, b.visits)}</div><div class="meta">${L.sessions(n.sessions)}</div></div>
      <div class="card"><div class="label">${L.people}</div><div class="big">${n.users}${diff(n.users, b.users)}</div><div class="meta">${vs}</div></div>
      <div class="card"><div class="label">${L.failures}</div><div class="big ${n.failures ? 'bad' : 'ok'}">${n.failures}${diff(n.failures, b.failures, true)}</div><div class="meta">${vs}</div></div>
    </section>
    ${trend}
    <section class="card"><div class="label">${L.whatToSee}</div><div class="meta">${L.insightsHint}</div>
      ${o.insights.length ? `<ul class="insights">${o.insights.map((i) => `<li><span class="pill ${i.severity}">${L.sev[i.severity]}</span>
        <div class="text">${sentence(i)}</div><a ${linkAttrs(i.link)}>${L.see} →</a></li>`).join('')}</ul>` : `<p class="meta">${L.nothing}</p>`}
    </section>`
}

    const failed = x.failures.length ? `<div class="meta">${L.whatFailed}</div><ul>${x.failures.map((f) => `<li><a ${linkAttrs({ tab: 'failures', params: { signal: f.type, detail: f.detail } })}>${esc(L.names[f.type] ?? f.type)}</a>: <code>${esc(f.detail)}</code>${f.after ? ` ${L.after} <code>${esc(f.after)}</code>` : ''} — ${f.n}×${f.seconds ? `, ${L.average(f.seconds)}` : ''}

        <tr class="row ${x.key === state.route ? 'sel' : ''}" data-open="${i}" data-key="${esc(x.key)}" tabindex="0" aria-expanded="${x.key === state.route}">

    ${r.versions.length ? `<section class="card"><div class="label">${L.byVersion}</div><div class="meta">${L.versionHint}</div>
      ${table(`<th>${L.version}</th><th class="n">${L.score}</th><th class="n">${L.visits}</th><th>${L.signals}</th>`, r.versions.map((v) => `<tr><td><code>${esc(v.key)}</code></td>

// Failures -------------------------------------------------------------------------------------------------
const F = () => L.failureTab
const when = (at) => (at ? new Date(at).toLocaleString(PT ? 'pt-BR' : 'en', { dateStyle: 'short', timeStyle: 'short' }) : '—')
const offset = (ms) => {
  const s = Math.round(ms / 1000), a = Math.abs(s)
  const txt = a < 60 ? `${a} s` : a < 3600 ? `${Math.floor(a / 60)} min ${a % 60} s` : `${Math.floor(a / 3600)} h ${Math.floor(a % 3600 / 60)} min`
  return s ? (s < 0 ? '−' : '+') + txt : '0 s'
}
const stepText = (s) => (F().step[s.type] ?? ((x) => `${L.names[x.type] ?? x.type}: ${x.detail}`))(s)
const isFailure = (s) => ['js_error', 'http_5xx', 'http_4xx', 'slow'].includes(s.type)
const stepHtml = (s, zero, here) => `<li class="${here ? 'here' : isFailure(s) || s.type === 'rage' || s.type === 'dead' ? 'sig' : ''}">
  <span class="t">${offset(s.at - zero)}</span><span>${esc(stepText(s))}${s.route && s.type !== 'page' ? ` <span class="meta">${esc(s.route)}</span>` : ''}</span></li>`
const counts = (title, list, name = (k) => k) => `<div><div class="label">${title}</div>${list.length
  ? `<ul class="counts">${list.map((x) => `<li><span>${esc(name(x.key) || F().unknown)}</span><b>${x.n}</b></li>`).join('')}</ul>` : '<p class="meta">—</p>'}</div>`
const sameStep = (a, b) => a.at === b.at && a.type === b.type && a.detail === b.detail

function issueMarkdown(d) {
  const I = F().issue, name = L.names[d.type] ?? d.type, list = (xs) => xs.map((x) => `${x.key || F().unknown} (${x.n})`).join(', ')
  const t = d.trails[0]
  const lines = [`## ${name}: ${d.detail}`, '',
    `- ${I.occurrences}: ${F().occurrences(d)} ${I.period($('#days').value)}`,
    `- ${I.first}: ${d.first_version} (${when(d.first_at)}) · ${I.last}: ${when(d.last_at)}`,
    `- ${F().where}: ${list(d.routes)}`, `- ${F().versions}: ${list(d.versions)}`, `- ${F().agents}: ${list(d.agents)}`,
    `- ${F().devices}: ${list(d.devices.map((x) => ({ ...x, key: F().devicesNames[x.key] ?? x.key })))}`]
  if (d.after_clicking.length) lines.push(`- ${F().afterClicking}: ${list(d.after_clicking)}`)
  if (d.stacks.length) lines.push('', `### ${F().stack}`, '```', d.stacks[0].key, '```')
  if (t) {
    lines.push('', `### ${I.steps} (${t.agent || F().unknown}, ${F().devicesNames[t.device] ?? t.device}, ${t.version})`)
    ;[...t.before, t.failure].forEach((s, i, all) => lines.push(`${i + 1}. ${i === all.length - 1 ? '**' : ''}${stepText(s)}${s.type !== 'page' ? ` — ${s.route}` : ''}${i === all.length - 1 ? '**' : ''} (${offset(s.at - t.at)})`))
  }
  lines.push('', `${I.link}: ${location.href}`)
  return lines.join('\n')
}

  if (!list.length) return empty(F().none)

  const isSel = (f) => f.type === state.signal && f.detail === state.detail
  const detail = d?.n ? `<section class="card failure">
      <div class="head"><div style="min-width:0;flex:1"><div class="label">${esc(L.names[d.type] ?? d.type)} ${d.new ? `<span class="pill bad">${F().isNew}</span>` : ''}</div>
        <div class="title"><code>${esc(d.detail)}</code></div>
        <div class="meta">${esc(F().occurrences(d))} · ${F().since} ${esc(d.first_version)} (${when(d.first_at)}) · ${F().last} ${ago(d.last_at)}</div></div>
        <div class="field"><button data-copy="${esc(issueMarkdown(d))}">${F().copyIssue}</button><a class="button" style="height:36px;padding:0 12px;border:1px solid var(--line-strong)" ${linkAttrs({ tab: 'failures', params: {} })}>${F().close}</a></div></div>
      <div class="facts">${counts(F().where, d.routes)}${counts(F().versions, d.versions)}${counts(F().agents, d.agents)}
        ${counts(F().devices, d.devices, (k) => F().devicesNames[k] ?? k)}${d.after_clicking.length ? counts(F().afterClicking, d.after_clicking) : ''}</div>
      <div class="label" style="margin-top:16px">${F().stack}</div>
      ${d.stacks.length ? d.stacks.map((x) => `<pre class="stack">${esc(x.key)}</pre>${d.stacks.length > 1 ? `<div class="meta">${x.n}×</div>` : ''}`).join('') : `<p class="meta">${F().noStack}</p>`}
      <div class="label" style="margin-top:16px">${F().trails}</div><div class="meta">${F().trailsHint(15, 3)}</div>
      <div class="trails">${d.trails.map((t, i) => `<details class="trail" data-trail="${esc(t.session)}" data-zero="${t.at}" ${i ? '' : 'open'}>
        <summary class="meta"><b>${F().session} ${esc(short(t.session))}</b> · ${when(t.at)} · ${esc(t.version)} · ${esc(t.agent || F().unknown)} · ${esc(F().devicesNames[t.device] ?? t.device ?? '')}
          ${t.user ? ` · ${L.user} <code>${esc(short(t.user))}</code>` : ''}${t.role ? ` · ${esc(t.role)}` : ''}</summary>
        <ol class="steps">${t.before.map((s) => stepHtml(s, t.at)).join('')}${stepHtml(t.failure, t.at, true)}${t.after.map((s) => stepHtml(s, t.at)).join('')}</ol>
        <button class="small" data-session="${esc(t.session)}">${F().fullSession}</button></details>`).join('')}</div>
    </section>` : ''
  return `${detail}<section class="card"><div class="label">${F().list}</div><div class="meta">${F().hint}</div>
    ${table(`<th>${F().failure}</th><th class="n">${L.sessionsCol}</th><th class="n">${L.users}</th><th class="n">${L.times}</th><th>${F().since}</th><th>${F().last}</th>`,
      list.map((f) => `<tr class="row ${isSel(f) ? 'sel' : ''}" data-signal="${esc(f.type)}" data-detail="${esc(f.detail)}" tabindex="0">
        <td><div><span class="meta">${esc(L.names[f.type] ?? f.type)}</span> ${f.new ? `<span class="pill bad">${F().isNew}</span>` : ''}</div><code>${esc(f.detail)}</code>
          <div class="meta">${esc(f.route)}${f.routes > 1 ? ` +${f.routes - 1}` : ''}</div></td>
        <td class="n">${f.sessions}</td><td class="n">${f.users}</td><td class="n">${f.n}</td>
        <td><code>${esc(f.first_version)}</code></td><td class="meta">${ago(f.last_at)}</td></tr>`).join(''))}</section>`
}

async function showSession(button) {
  const box = button.closest('.trail'), zero = Number(box.dataset.zero)
  const s = await read('/api/session', { session: button.dataset.session })
  box.querySelector('.steps').innerHTML = s.steps.map((x) => stepHtml(x, zero, x.at === zero && isFailure(x))).join('')
  button.replaceWith(Object.assign(document.createElement('div'), { className: 'meta', textContent: s.truncated ? F().truncated : '' }))
}

// Journeys -------------------------------------------------------------------------------------------------
const J = () => L.journey
const funnelSteps = () => { try { const v = JSON.parse(state.funnel || '[]'); return Array.isArray(v) ? v : [] } catch { return [] } }
const stepLabel = (step) => { const [kind, ...rest] = step.split(':'); return `${J().stepKind[kind] ?? kind}: ${rest.join(':')}` }

async function journeys() {
  const j = await read('/api/journeys')
  if (!j.screens.length) return empty(L.noVisits)
  const steps = funnelSteps()
  const fu = steps.length ? await read('/api/funnel', { steps: JSON.stringify(steps) }) : { steps: [] }
  if (!j.screens.some((x) => x.route === state.route)) state.route = j.screens[0].route
  const sc = j.screens.find((x) => x.route === state.route)
  const pct = (x) => Math.round(x * 100)
  const flowList = (list, empty) => list.length ? `<ul class="counts">${list.map((x) => `<li>${x.route === '(exit)' ? `<span class="meta">${J().exit}</span>`
    : `<a href="#" data-flow="${esc(x.route)}">${esc(x.route)}</a>`}<b>${pct(x.share)}%</b></li>`).join('')}</ul>` : `<p class="meta">${empty}</p>`
  const reach = [...j.reach].sort((a, b) => b.uses - a.uses).slice(0, 50)
  const options = (kind, values) => values.map((v) => `<option value="${esc(kind + ':' + v)}">${esc(v)}</option>`).join('')
  const actionsSeen = [...new Set(j.reach.filter((r) => r.kind === 'action').map((r) => r.key))]
  const elementsSeen = [...new Set(j.reach.filter((r) => r.kind === 'element').map((r) => r.key))].slice(0, 60)
  const far = j.reach.filter((r) => r.far).slice(0, 10)
  const reachCard = () => `
    <section class="card"><div class="label">${J().reach}</div><div class="meta">${J().reachHint}</div>
      ${far.length ? reachTable(far) : `<p class="meta">${J().noneFar}</p>`}
      <details style="margin-top:12px"><summary>${J().allReach(j.reach.length)}</summary>${reachTable(reach)}</details>
    </section>`
  const reachTable = (rows) => table(`<th>${J().item}</th><th>${L.screen}</th><th class="n">${J().uses}</th><th class="n">${L.users}</th><th class="n">${J().clicksTo}</th><th class="n">${J().screensTo}</th>`,
        rows.map((r) => `<tr><td><span class="meta">${J()[r.kind]}</span> ${r.far ? `<span class="pill idea">${J().far}</span>` : ''}<br><code>${esc(r.key)}</code></td>
          <td>${esc(r.route)}</td><td class="n">${r.uses}</td><td class="n">${r.users}</td>
          <td class="n"><b class="${r.clicks_median >= 5 ? 'warn' : ''}">${r.clicks_median}</b></td><td class="n"><b class="${r.screens_median >= 2 ? 'warn' : ''}">${r.screens_median}</b></td></tr>`).join(''))
  return reachCard() + `
    <section class="card"><div class="label">${J().pairs}</div><div class="meta">${J().pairsHint}</div>
      ${j.pairs.length ? `<ul class="insights">${j.pairs.slice(0, 15).map((p) => { const e = { ...p, a: esc(p.a), b: esc(p.b), clicks: p.clicks_median, screens: p.screens_median }
        return `<li>${p.linked ? `<span class="pill idea">${J().linked}</span>` : ''}<div class="text">${J().pair(e)}<div class="meta">${J().pairMeta(e)}</div></div></li>` }).join('')}</ul>`
        : `<p class="meta">${J().noPairs}</p>`}
    </section>
    <section class="card"><div class="head"><div><div class="label">${J().flow}</div><div class="meta">${J().flowHint}</div></div>
        <select id="flow-screen" aria-label="${L.screen}">${j.screens.map((x) => `<option ${x.route === state.route ? 'selected' : ''}>${esc(x.route)}</option>`).join('')}</select></div>
      <div class="flow">
        <div><div class="label">${J().from}</div>${flowList(sc.from, J().start)}</div>
        <div class="here"><div class="route">${esc(sc.route)}</div><div class="meta">${L.visitsN(sc.visits)} · ${J().timeOn(sc.seconds_median)}</div></div>
        <div><div class="label">${J().to}</div>${flowList(sc.to, '—')}</div>
      </div>
    </section>
    <section class="card"><div class="label">${J().funnel}</div><div class="meta">${J().funnelHint}</div>
      <div class="funnel">${fu.steps.map((x, i) => `<div class="fstep">
          <div class="fhead"><span>${i + 1}. ${esc(stepLabel(x.step))}</span><button class="small" data-funnel-remove="${i}" aria-label="${J().removeStep}">×</button></div>
          <div class="bar big"><i style="width:${pct(x.share)}%;background:var(--accent)"></i></div>
          <div class="meta">${J().reached(x.sessions, pct(x.share))}${i && fu.steps[i - 1].sessions ? ` · <span class="${x.sessions < fu.steps[i - 1].sessions * 0.7 ? 'bad' : ''}">${J().lost(Math.round((1 - x.sessions / fu.steps[i - 1].sessions) * 100))}</span>` : ''}</div>
        </div>`).join('')}
        ${steps.length < 8 ? `<select id="funnel-add" aria-label="${J().addStep}"><option value="">${J().addStep}</option>
          <optgroup label="${J().screensG}">${options('page', j.screens.map((x) => x.route))}</optgroup>
          <optgroup label="${J().actionsG}">${options('action', actionsSeen)}</optgroup>
          <optgroup label="${J().elementsG}">${options('click', elementsSeen)}</optgroup></select>` : ''}
      </div>
    </section>`
}

// Usage ----------------------------------------------------------------------------------------------------
async function usage() {
  const { screens } = await read('/api/usage')
  if (!screens.length) return empty(L.noVisits)
  if (!screens.some((s) => s.route === state.route)) state.route = screens[0].route
  const d = await read('/api/usage', { route: state.route })
  const maxV = Math.max(...screens.map((s) => s.visits))
  const maxC = Math.max(1, ...d.elements.map((e) => e.clicks))
  const heat = (f) => `hsl(${Math.round(220 - f * 220)} 75% 50%)`
  const project = state.me.projects.find((p) => p.name === $('#project').value)
  return `
    <section class="two">
      <div class="card">
        <div class="label">${L.screensByUse}</div><div class="meta">${L.pickScreen}</div>
        ${table(`<th>${L.screen}</th><th class="n">${L.visits}</th><th class="n">${L.clicks}</th><th class="n">${L.users}</th><th class="n">${L.score}</th>`, screens.map((s) => `
          <tr class="row ${s.route === state.route ? 'sel' : ''}" data-route="${esc(s.route)}" tabindex="0">
            <td><div class="route">${esc(s.route)}</div><div class="bar"><i style="width:${s.visits / maxV * 100}%;background:var(--accent)"></i></div></td>
            <td class="n">${s.visits}</td><td class="n">${s.clicks}</td><td class="n">${s.users}</td><td class="n">${scoreHtml(s.score)}</td></tr>`).join(''))}
      </div>
      <div class="card">
        <div class="head"><div><div class="label">${esc(L.elementsOf(d.route))}</div><div class="meta">${L.visitsN(d.visits)}</div></div>
          ${project?.url ? `<button class="primary" id="open-map">${L.openMap}</button>` : `<span class="meta">${L.mapNoUrl}</span>`}</div>
        ${d.elements.length ? table(`<th>${L.element}</th><th class="n">${L.clicks}</th><th class="n">${L.users}</th><th class="n">${L.problems}</th>`, d.elements.map((e) => `
          <tr><td><span class="swatch" style="background:${heat(e.clicks / maxC)}"></span><code>${esc(e.target)}</code></td>
            <td class="n">${e.clicks}</td><td class="n">${e.users}</td>
            <td class="n">${e.rage + e.dead + e.errors ? `<span class="bad" title="${esc(L.problemTip(e))}">${e.rage + e.dead + e.errors}</span>` : '<span class="meta">—</span>'}</td></tr>`).join(''))
          : `<p class="meta">${L.noClicks}</p>`}
      </div>
    </section>
    <section class="card"><div class="label">${esc(L.neverIn(d.route))}</div><div class="meta">${L.neverHint}</div>
      ${d.never_clicked.length ? `<ul>${d.never_clicked.map((a) => `<li><code>${esc(a)}</code></li>`).join('')}</ul>` : `<p class="meta">${L.allClicked}</p>`}</section>`
}

async function openMap() {
  const res = await fetch('/api/map-token?project=' + encodeURIComponent($('#project').value), { method: 'POST' })
  if (!res.ok) return
  const { token, url } = await res.json()
  const target = new URL(url)
  target.searchParams.set('termometro_map', token)
  window.open(target.href, '_blank', 'noopener')
}

  const group = (title, hint, list, col) => `<div class="card"><div class="label">${title}</div><div class="meta">${hint}</div>
    ${table(`<th>${col}</th><th class="n">${L.users}</th><th class="n">${L.visits}</th><th class="n">${L.clicks}</th><th class="n">${L.score}</th><th>${L.topScreens}</th>`,
      list.map((g) => `<tr><td><b>${esc(g.key)}</b></td><td class="n">${g.users}</td><td class="n">${g.visits}</td><td class="n">${g.clicks}</td><td class="n">${scoreHtml(g.score)}</td><td>${top(g.screens)}</td></tr>`).join(''))}</div>`
  return `
    <section class="two">${group(L.byRole, L.roleHint, p.roles, L.role)}${group(L.byAccount, L.accountHint, p.accounts, L.account)}</section>
    <section class="card"><div class="label">${L.byUser}</div><div class="meta">${L.userHint}</div>
      ${table(`<th>${L.user}</th><th>${L.role}</th><th>${L.account}</th><th class="n">${L.visits}</th><th class="n">${L.clicks}</th><th class="n">${L.score}</th><th>${L.topScreens}</th>`,
        p.users.map((u) => `<tr class="row ${u.key === state.user ? 'sel' : ''}" data-user="${esc(u.key)}" tabindex="0">
          <td><code title="${esc(u.key)}">${esc(short(u.key))}</code></td><td>${esc(u.role)}</td><td>${esc(u.account)}</td>
          <td class="n">${u.visits}</td><td class="n">${u.clicks}</td><td class="n">${scoreHtml(u.score)}</td><td>${top(u.screens)}</td></tr>`).join(''))}</section>`
}

// Actions --------------------------------------------------------------------------------------------------
async function actions() {
  const { actions } = await read('/api/actions')
  if (!actions.length) return empty(L.noActions)
  const effort = (c) => (c >= 15 ? 'bad' : c >= 8 ? 'warn' : 'ok')
  return `<section class="card"><div class="label">${L.effort}</div><div class="meta">${L.effortHint}</div>
    ${table(`<th>${L.action}</th><th class="n">${L.times}</th><th class="n">${L.users}</th><th class="n">${L.clicksMed}</th><th class="n">${L.clicksP90}</th><th class="n">${L.timeMed}</th><th class="n">${L.timeP90}</th>`,
      actions.map((a) => `<tr class="${a.action === state.action ? 'sel' : ''}"><td><code>${esc(a.action)}</code></td><td class="n">${a.times}</td><td class="n">${a.users}</td>
        <td class="n"><span class="pill ${effort(a.clicks_median)}">${a.clicks_median}</span></td><td class="n">${a.clicks_p90}</td>
        <td class="n">${a.seconds_median} s</td><td class="n">${a.seconds_p90} s</td></tr>`).join(''))}</section>`
}

// Versions -------------------------------------------------------------------------------------------------
async function versions() {
  const c = await read('/api/compare', { a: state.a, b: state.b }) // the header's version filter does not apply here
  if (c.versions.length < 2) return empty(L.oneVersion)
  const pick = (id, value) => `<select id="${id}" aria-label="${L.version}">${c.versions.map((v) => `<option ${v === value ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>`
  const delta = (d) => d === null ? '<span class="meta">—</span>'
    : `<span class="pill ${d >= 10 ? 'bad' : d <= -10 ? 'ok' : d > 0 ? 'warn' : 'ok'}">${d > 0 ? '+' : ''}${d}</span>`
  const pair = (x, y, unit = '') => `${x ?? '—'}${x !== undefined && x !== null ? unit : ''} → <b>${y ?? '—'}${y !== undefined && y !== null ? unit : ''}</b>`
  const o = c.overall
  const d = o.b.score - o.a.score
  return `
    <section class="card"><div class="head"><div class="field" style="flex-wrap:wrap">${pick('cmp-b', c.b)}<span class="meta">${L.compareWith}</span>${pick('cmp-a', c.a)}</div></div>
      <div class="meta" style="margin-top:8px">${L.compareHint}</div></section>
    <section class="numbers">
      <div class="card"><div class="label">${L.overall}</div><div class="big">${scoreHtml(o.a.score)} → ${scoreHtml(o.b.score)}</div>
        <span class="pill ${d >= 10 ? 'bad' : d > 0 ? 'warn' : 'ok'}">${d > 0 ? L.worse : d < 0 ? L.better : L.same}</span></div>
      <div class="card"><div class="label">${L.visits}</div><div class="big">${o.a.visits} → ${o.b.visits}</div></div>
      <div class="card"><div class="label">${L.newFailures}</div><div class="big ${c.new_failures.length ? 'bad' : 'ok'}">${c.new_failures.length}</div></div>
    </section>
    <section class="card"><div class="label">${L.screensCompared}</div>
      ${table(`<th>${L.screen}</th><th class="n">${esc(c.a)}</th><th class="n">${esc(c.b)}</th><th class="n">${L.change}</th><th class="n">${L.visits} ${esc(c.b)}</th><th>${L.signals} ${esc(c.b)}</th>`,
        c.routes.map((r) => `<tr><td><div class="route">${esc(r.route)}</div></td>
          <td class="n">${r.a ? scoreHtml(r.a.score) : '<span class="meta">—</span>'}</td><td class="n">${r.b ? scoreHtml(r.b.score) : '<span class="meta">—</span>'}</td>
          <td class="n">${r.delta === null ? `<span class="meta">${esc(L.onlyIn(r.b ? c.b : c.a))}</span>` : delta(r.delta)}</td>
          <td class="n">${r.b?.visits ?? 0}</td><td>${r.b ? signals(r.b.signals) : ''}</td></tr>`).join(''))}</section>
    ${c.actions.length ? `<section class="card"><div class="label">${L.actionsCompared}</div>
      ${table(`<th>${L.action}</th><th class="n">${L.clicks}</th><th class="n">${L.timeMed}</th><th class="n">${L.times} ${esc(c.b)}</th>`,
        c.actions.map((x) => `<tr><td><code>${esc(x.action)}</code></td><td class="n">${pair(x.a?.clicks_median, x.b?.clicks_median)}</td>
          <td class="n">${pair(x.a?.seconds_median, x.b?.seconds_median, ' s')}</td><td class="n">${x.b?.times ?? 0}</td></tr>`).join(''))}</section>` : ''}
    <section class="card"><div class="label">${L.newFailures}</div>
      ${c.new_failures.length ? `<ul>${c.new_failures.map((f) => `<li>${esc(L.names[f.type] ?? f.type)}: <code>${esc(f.detail)}</code> <span class="meta">${esc(f.route)}</span> — ${f.n}×</li>`).join('')}</ul>`
        : `<p class="meta">${L.noNewFailures}</p>`}</section>`
}

// First run ------------------------------------------------------------------------------------------------
function setup(project) {
  const server = location.origin
  const npm = `npm install termometro\n\nimport { start } from 'termometro'\n\nstart({\n  key: '${project.key}',\n  url: '${server}',\n})`
  const tag = `<script src="${server}/termometro.js" data-key="${project.key}" async><\/script>` // escaped: a literal closing tag would end this very <script>
  const snippet = (code) => `<div class="snippet"><pre>${esc(code)}</pre><button data-copy="${esc(code)}">${L.copy}</button></div>`
  return `<section class="setup">
    <div class="card"><div class="label">${esc(L.setupTitle(project.name))}</div><p>${L.setupIntro}</p>
      <div class="waiting" role="status"><span class="pulse"></span>${L.waiting}</div></div>
    <div class="card"><div class="label">${L.withBundler}</div>${snippet(npm)}<p class="meta">${L.routerHint}</p></div>
    <div class="card"><div class="label">${L.withoutBundler}</div>${snippet(tag)}</div>
    <p class="meta">${project.origins?.length ? esc(L.originsHint(project.origins.join(', '))) : L.anyOrigin}</p>
  </section>`
}

let waitTimer = 0
async function hasEvents() {
  const status = await read('/api/status')
  return status.events > 0
}

// Render ---------------------------------------------------------------------------------------------------
const TABS = { overview, frustration, failures, usage, journeys, people, actions, versions }

async function render() {
  clearTimeout(waitTimer)
  const project = state.me.projects.find((p) => p.name === $('#project').value)
  try {
    if (!(await hasEvents())) {
      $('#content').innerHTML = setup(project)
      // Poll until the first event lands, then show the dashboard and its filters.
      const wait = async () => {
        if (await hasEvents().catch(() => false)) { await loadFilters(); return render() }
        waitTimer = setTimeout(wait, 3000)
      }
      waitTimer = setTimeout(wait, 3000)
      return
    }
  } catch (error) {
    if (error.message === 'signed out') return
  }
  document.querySelectorAll('nav.tabs a').forEach((a) => a.classList.toggle('on', a.dataset.tab === state.tab))
  $('#user-chip').innerHTML = state.user
    ? `<span class="chip">${L.user} <code>${esc(short(state.user))}</code><button id="remove-user" aria-label="${L.removeUser}">×</button></span>` : ''
  try {
    $('#content').innerHTML = await TABS[state.tab]()
    $('#open-map')?.addEventListener('click', openMap)
    writeHash()
    if (state.focus) ($('#content .failure') ?? $('#content tr.sel'))?.scrollIntoView({ block: $('#content .failure') ? 'start' : 'center' })
    state.focus = false
  } catch (error) {
    if (error.message !== 'signed out') $('#content').innerHTML = empty(L.failed + esc(error.message))
  }
}

function onContentClick(e) {
  const copy = e.target.closest('[data-copy]')
  if (copy) {
    navigator.clipboard?.writeText(copy.dataset.copy).then(() => { copy.textContent = L.copied; setTimeout(() => { copy.textContent = L.copy }, 1500) })
    return
  }
  const flow = e.target.closest('[data-flow]')
  if (flow) { e.preventDefault(); state.route = flow.dataset.flow; return render() }
  const drop = e.target.closest('[data-funnel-remove]')
  if (drop) { const s = funnelSteps(); s.splice(Number(drop.dataset.funnelRemove), 1); state.funnel = s.length ? JSON.stringify(s) : ''; return render() }
  const more = e.target.closest('[data-session]')
  if (more) return showSession(more)
  const tr = e.target.closest('tr.row'); if (!tr) return
  if (tr.dataset.signal !== undefined) return go('failures', { signal: tr.dataset.signal, detail: tr.dataset.detail })
  if (tr.dataset.open !== undefined) {
    const d = document.querySelector(`tr[data-of="${tr.dataset.open}"]`)
    d.hidden = !d.hidden; tr.setAttribute('aria-expanded', String(!d.hidden))
    state.route = d.hidden ? '' : tr.dataset.key; writeHash()
  } else if (tr.dataset.route !== undefined) { state.route = tr.dataset.route; render() }
  else if (tr.dataset.user !== undefined) { state.user = state.user === tr.dataset.user ? '' : tr.dataset.user; render() }
}

// A link, the back button or a pasted address: the hash decides the tab, the filters and what is open.
addEventListener('hashchange', async () => {
  if (!$('#content')) return
  const project = $('#project').value
  readHash()
  const want = state.hash.get('project')
  if (want && [...$('#project').options].some((o) => o.value === want)) $('#project').value = want
  $('#days').value = state.hash.get('days') || '7'
  if ($('#project').value !== project) await loadFilters()
  for (const k of ['version', 'account', 'role']) {
    const v = state.hash.get(k) || ''
    $('#' + k).value = [...$('#' + k).options].some((o) => o.value === v) ? v : ''
  }
  state.focus = true
  render()
})

async function boot() {
  readHash()
  state.me = await (await fetch('/api/me')).json()
  const params = new URLSearchParams(location.search)
  if (!state.me.signed_in) return signin(params.get('error'))
  if (params.has('error')) history.replaceState(null, '', location.pathname + location.hash)
  if (!state.me.projects.length) { $('#app').innerHTML = `<main>${empty(L.noProjects)}</main>`; return }
  shell()
  await loadFilters()
  render()
}
boot()
</script>
