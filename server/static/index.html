<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termometro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M14 14.76V5a2 2 0 0 0-4 0v9.76a4 4 0 1 0 4 0Z' fill='%23e5484d'/%3E%3C/svg%3E">
<style>
/* No web fonts and no third-party requests: the dashboard of a privacy tool should not call anyone. */
/* Palettes: warm tones (Nectar's) open the page; the viewer may pick cool tones or high contrast (kept in the browser). Each has its
   light and dark steps; --k1..--k5 are the kinds of frustration, validated for colour blindness in both modes. */
:root {
  --canvas: #faf7f0; --surface: #ffffff; --sunken: #f7f2e7; --line: #e6dfd0; --line-strong: #cfc6b2;
  --fg: #1f1a14; --fg2: #4a4235; --faint: #6b6152;
  --accent: #8a5e00; --accent-hover: #6e4b00; --accent-soft: #fff1c2; --on-accent: #ffffff; --fill: #fec10d; --on-fill: #1f1a14;
  --ok: #1d6b45; --ok-soft: #e2f2e9; --warn: #b3400a; --warn-soft: #fde8dc; --bad: #a81c3f; --bad-soft: #fbe3ea;
  --k1: #2a78d6; --k2: #eb6834; --k3: #1baf7a; --k4: #eda100; --k5: #e87ba4;
  --brand: #e5484d; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04); --ease: cubic-bezier(.16,1,.3,1);
}
:root[data-palette="cold"] {
  --canvas: #f4f7fb; --surface: #ffffff; --sunken: #eef2f8; --line: #e1e7f0; --line-strong: #c9d3e2;
  --fg: #111827; --fg2: #3b4658; --faint: #5b6678;
  --accent: #1d4ed8; --accent-hover: #1e40af; --accent-soft: #e8efff; --on-accent: #ffffff; --fill: #2563eb; --on-fill: #ffffff;
  --ok: #15803d; --ok-soft: #e8f7ee; --warn: #a16207; --warn-soft: #fdf4e3; --bad: #c2262e; --bad-soft: #fdecec;
  --k1: #2a78d6; --k2: #16a34a; --k3: #6250d6; --k4: #06b6d4; --k5: #4338ca;
}
:root[data-palette="contrast"] {
  --canvas: #ffffff; --surface: #ffffff; --sunken: #f2f2f2; --line: #000000; --line-strong: #000000;
  --fg: #000000; --fg2: #000000; --faint: #333333;
  --accent: #0040c0; --accent-hover: #002f8f; --accent-soft: #e6eeff; --on-accent: #ffffff; --fill: #000000; --on-fill: #ffffff;
  --ok: #006b2e; --ok-soft: #e3f5ea; --warn: #8a4b00; --warn-soft: #fff0d6; --bad: #b00020; --bad-soft: #fde6ea;
  --k1: #2a78d6; --k2: #eb6834; --k3: #1baf7a; --k4: #eda100; --k5: #e87ba4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --canvas: #15120d; --surface: #1e1a14; --sunken: #191610; --line: #3a3328; --line-strong: #5a4f3e;
  --fg: #f1ebe0; --fg2: #d6cdbd; --faint: #ada290;
  --accent: #fec10d; --accent-hover: #ffd24d; --accent-soft: #2a2412; --on-accent: #1f1a14; --fill: #fec10d; --on-fill: #1f1a14;
  --ok: #7fd1a5; --ok-soft: #173327; --warn: #ff9a6b; --warn-soft: #3d2215; --bad: #ff8fab; --bad-soft: #3d1a26;
  --k1: #3987e5; --k2: #d95926; --k3: #199e70; --k4: #c98500; --k5: #d55181;
  --brand: #ff6b70; --shadow: none; color-scheme: dark;
}
  :root:not([data-theme="light"])[data-palette="cold"] {
  --canvas: #0f131a; --surface: #161a22; --sunken: #12161d; --line: #262d3a; --line-strong: #384254;
  --fg: #eef2f8; --fg2: #c5cfdd; --faint: #94a0b4;
  --accent: #8ab4ff; --accent-hover: #b0cbff; --accent-soft: #1c2740; --on-accent: #0f131a; --fill: #8ab4ff; --on-fill: #0f131a;
  --ok: #6ee7a0; --ok-soft: #12261b; --warn: #f5c451; --warn-soft: #2b2312; --bad: #ff8a8f; --bad-soft: #2f1618;
  --k1: #3987e5; --k2: #1f9d55; --k3: #8b7cf0; --k4: #14a3bd; --k5: #6d6ee8;
}
  :root:not([data-theme="light"])[data-palette="contrast"] {
  --canvas: #000000; --surface: #000000; --sunken: #111111; --line: #ffffff; --line-strong: #ffffff;
  --fg: #ffffff; --fg2: #ffffff; --faint: #dddddd;
  --accent: #ffd400; --accent-hover: #ffe666; --accent-soft: #222222; --on-accent: #000000; --fill: #ffffff; --on-fill: #000000;
  --ok: #6ee7a0; --ok-soft: #0c2416; --warn: #ffd166; --warn-soft: #2b2312; --bad: #ff8a8f; --bad-soft: #2f1618;
  --k1: #3987e5; --k2: #d95926; --k3: #199e70; --k4: #c98500; --k5: #d55181;
}
}
:root[data-theme="dark"] {
  --canvas: #15120d; --surface: #1e1a14; --sunken: #191610; --line: #3a3328; --line-strong: #5a4f3e;
  --fg: #f1ebe0; --fg2: #d6cdbd; --faint: #ada290;
  --accent: #fec10d; --accent-hover: #ffd24d; --accent-soft: #2a2412; --on-accent: #1f1a14; --fill: #fec10d; --on-fill: #1f1a14;
  --ok: #7fd1a5; --ok-soft: #173327; --warn: #ff9a6b; --warn-soft: #3d2215; --bad: #ff8fab; --bad-soft: #3d1a26;
  --k1: #3987e5; --k2: #d95926; --k3: #199e70; --k4: #c98500; --k5: #d55181;
  --brand: #ff6b70; --shadow: none; color-scheme: dark;
}
:root[data-theme="dark"][data-palette="cold"] {
  --canvas: #0f131a; --surface: #161a22; --sunken: #12161d; --line: #262d3a; --line-strong: #384254;
  --fg: #eef2f8; --fg2: #c5cfdd; --faint: #94a0b4;
  --accent: #8ab4ff; --accent-hover: #b0cbff; --accent-soft: #1c2740; --on-accent: #0f131a; --fill: #8ab4ff; --on-fill: #0f131a;
  --ok: #6ee7a0; --ok-soft: #12261b; --warn: #f5c451; --warn-soft: #2b2312; --bad: #ff8a8f; --bad-soft: #2f1618;
  --k1: #3987e5; --k2: #1f9d55; --k3: #8b7cf0; --k4: #14a3bd; --k5: #6d6ee8;
}
:root[data-theme="dark"][data-palette="contrast"] {
  --canvas: #000000; --surface: #000000; --sunken: #111111; --line: #ffffff; --line-strong: #ffffff;
  --fg: #ffffff; --fg2: #ffffff; --faint: #dddddd;
  --accent: #ffd400; --accent-hover: #ffe666; --accent-soft: #222222; --on-accent: #000000; --fill: #ffffff; --on-fill: #000000;
  --ok: #6ee7a0; --ok-soft: #0c2416; --warn: #ffd166; --warn-soft: #2b2312; --bad: #ff8a8f; --bad-soft: #2f1618;
  --k1: #3987e5; --k2: #d95926; --k3: #199e70; --k4: #c98500; --k5: #d55181;
}
/* The screen map's scales, one hue each and light→dark (dark mode: dark→light), checked with the dataviz validator
   (monotone lightness, visible steps, the lightest clears the surface); the ink on each step is ≥ 4.5:1. --mu: clicks; --ms: how
   much of an element's clicks irritate. High contrast keeps the warm steps. */
:root { --mu1: #d9a12b; --mu2: #b07c00; --mu3: #835a00; --mu4: #563a00; --mu-ink1: #1f1a14; --mu-ink2: #1f1a14; --mu-ink3: #ffffff; --mu-ink4: #ffffff; --ms1: #ec8a76; --ms2: #c4452f; --ms3: #9a2416; --ms-ink1: #1f1a14; --ms-ink2: #ffffff; --ms-ink3: #ffffff; }
:root[data-palette="cold"] { --mu1: #6f9be6; --mu2: #3a6dcc; --mu3: #1f4fb0; --mu4: #14326f; --mu-ink1: #1f1a14; --mu-ink2: #ffffff; --mu-ink3: #ffffff; --mu-ink4: #ffffff; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --mu1: #7a5a12; --mu2: #b08419; --mu3: #e3ad2c; --mu4: #ffd56b; --mu-ink1: #f1ebe0; --mu-ink2: #1f1a14; --mu-ink3: #1f1a14; --mu-ink4: #1f1a14; --ms1: #8f3a2c; --ms2: #dc6a52; --ms3: #ff9a83; --ms-ink1: #f1ebe0; --ms-ink2: #1f1a14; --ms-ink3: #1f1a14; }
  :root:not([data-theme="light"])[data-palette="cold"] { --mu1: #2c4a86; --mu2: #3866c0; --mu3: #78a3f3; --mu4: #bcd2ff; --mu-ink1: #eef2f8; --mu-ink2: #eef2f8; --mu-ink3: #0f131a; --mu-ink4: #0f131a; }
}
:root[data-theme="dark"] { --mu1: #7a5a12; --mu2: #b08419; --mu3: #e3ad2c; --mu4: #ffd56b; --mu-ink1: #f1ebe0; --mu-ink2: #1f1a14; --mu-ink3: #1f1a14; --mu-ink4: #1f1a14; --ms1: #8f3a2c; --ms2: #dc6a52; --ms3: #ff9a83; --ms-ink1: #f1ebe0; --ms-ink2: #1f1a14; --ms-ink3: #1f1a14; }
:root[data-theme="dark"][data-palette="cold"] { --mu1: #2c4a86; --mu2: #3866c0; --mu3: #78a3f3; --mu4: #bcd2ff; --mu-ink1: #eef2f8; --mu-ink2: #eef2f8; --mu-ink3: #0f131a; --mu-ink4: #0f131a; }
/* Colour-blind mode: low / moderate / high become blue / neutral / orange (no red against green); labels stay. */
:root[data-cvd="on"] { --ok: #1f68c0; --ok-soft: #e6f0fb; --warn: #6f695e; --warn-soft: #f1efea; --bad: #b23a0b; --bad-soft: #fde8dc; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"])[data-cvd="on"] { --ok: #5c9cec; --ok-soft: #142338; --warn: #a39d91; --warn-soft: #24211c; --bad: #ec7442; --bad-soft: #3d2215; } }
:root[data-theme="dark"][data-cvd="on"] { --ok: #5c9cec; --ok-soft: #142338; --warn: #a39d91; --warn-soft: #24211c; --bad: #ec7442; --bad-soft: #3d2215; }
/* Bigger text: the whole dashboard, charts included, scales; the tooltip follows. */
:root[data-text="large"] #app { zoom: 1.15; } :root[data-text="larger"] #app { zoom: 1.3; }
:root[data-text="large"] .tip { font-size: 14px; line-height: 19px; } :root[data-text="larger"] .tip { font-size: 16px; line-height: 22px; }
/* Less motion: the system's wish, or the viewer's. */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
:root[data-motion="reduce"] *, :root[data-motion="reduce"] *::before, :root[data-motion="reduce"] *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 400 14px/20px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--canvas); color: var(--fg);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
select, button, input { font: inherit; color: inherit; height: 36px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); }
button, .button { color: var(--fg); cursor: pointer; font-weight: 500; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
button:hover { background: var(--sunken); }
.primary { background: var(--fill); border-color: var(--fill); color: var(--on-fill); }
.primary:hover { background: var(--fill); filter: brightness(.94); }
:is(select, button, input, a):focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.mark { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
.mark svg { width: 20px; height: 20px; color: var(--brand); }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; }
.top .mark { margin-right: auto; }
.field { display: flex; align-items: center; gap: 6px; }
.who { display: flex; align-items: center; gap: 8px; }

nav.tabs { display: flex; gap: 4px; padding: 0 16px; overflow-x: auto; }
nav.tabs a { display: flex; align-items: center; height: 40px; padding: 0 12px; color: var(--fg2); font-weight: 500; border-bottom: 2px solid transparent; text-decoration: none; white-space: nowrap; }
nav.tabs a.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.chip button { height: 22px; width: 22px; padding: 0; border: 0; background: none; color: inherit; }
main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
.card { position: relative; } .card > .csv { position: absolute; top: 12px; right: 12px; } .card > .csv ~ .label, .card > .csv ~ .meta { padding-right: 56px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.label { font-size: 12px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--faint); }
.meta { color: var(--faint); font-size: 12px; line-height: 16px; }
.numbers { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.big { font-size: 32px; line-height: 40px; font-weight: 700; margin-top: 4px; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); } .pill.idea { background: var(--accent-soft); color: var(--accent); } .pill.warn { background: var(--warn-soft); } .pill.bad { background: var(--bad-soft); }
.table { overflow-x: auto; margin: 8px -16px -16px; }
table { width: 100%; border-collapse: collapse; }
th { height: 40px; padding: 0 12px; text-align: left; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .03em; color: var(--faint); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr.row { cursor: pointer; transition: background .15s var(--ease); }
tbody tr.row:hover { background: var(--sunken); }
tbody tr.sel { background: var(--accent-soft); }
code { font: 12px/16px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg2); overflow-wrap: anywhere; }
.route { font-weight: 500; overflow-wrap: break-word; min-width: 8em; }
.bar { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; margin-top: 6px; min-width: 80px; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.signals { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--fg2); min-width: 10em; }
.detail td { background: var(--sunken); }
.detail ul { margin: 4px 0 8px; padding-left: 18px; }
.empty { padding: 32px 16px; text-align: center; color: var(--faint); }
details summary { cursor: pointer; color: var(--fg2); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; justify-content: space-between; }
/* Sign-in */
.signin { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.signin .card { width: 100%; max-width: 380px; padding: 28px; display: grid; gap: 16px; text-align: center; }
.signin form { display: grid; gap: 10px; }
.signin input { width: 100%; }
.or { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 12px; }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.setup { display: grid; gap: 16px; max-width: 760px; margin: 0 auto; width: 100%; }
.setup pre { margin: 8px 0 0; padding: 12px 14px; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto;
  font: 12px/18px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); white-space: pre; }
.snippet { position: relative; }
.snippet button { position: absolute; top: 6px; right: 6px; height: 28px; font-size: 12px; }
.waiting { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s var(--ease) infinite; }
@keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.error { color: var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
/* Search */
.search { position: relative; flex: 1 1 220px; max-width: 360px; }
.search input { width: 100%; }
.results { position: absolute; top: 40px; left: 0; right: 0; min-width: 300px; max-height: 70vh; overflow-y: auto; z-index: 10; background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,.12); padding: 6px; }
.results .group { padding: 8px 8px 4px; }
.results a { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; }
.results a:hover, .results a.on { background: var(--accent-soft); }
.results a code { flex: 1; min-width: 0; color: inherit; }
/* Failures */
.failure .title { margin: 4px 0; font-size: 15px; } .failure .title code { font-size: 14px; line-height: 20px; color: var(--fg); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-top: 16px; }
.counts { list-style: none; margin: 6px 0 0; padding: 0; } .counts li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.counts li span { overflow-wrap: anywhere; }
pre.stack { margin: 8px 0 0; padding: 10px 12px; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto;
  font: 12px/18px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
.trails { display: grid; gap: 12px; margin-top: 8px; }
.trail { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.steps { margin: 8px 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.steps li { display: flex; gap: 10px; padding: 3px 6px; border-radius: 4px; overflow-wrap: anywhere; }
.steps .t { flex: 0 0 76px; text-align: right; color: var(--faint); font-size: 12px; }
.steps li.sig { color: var(--warn); } .steps li.here { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
button.small { height: 28px; font-size: 12px; }
/* Journeys */
.flow { display: grid; grid-template-columns: 1fr minmax(160px, auto) 1fr; gap: 16px; align-items: start; margin-top: 12px; }
.flow .here { text-align: center; padding: 12px; border-radius: 10px; background: var(--accent-soft); align-self: center; }
@media (max-width: 640px) { .flow { grid-template-columns: 1fr; } }
.counts a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; } .counts a:hover { text-decoration: underline; }
.funnel { display: grid; gap: 12px; margin-top: 12px; max-width: 720px; }
.fhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 500; overflow-wrap: anywhere; }
.bar.big { height: 12px; border-radius: 4px; }
/* Overview */
.delta { white-space: nowrap; font-size: 12px; font-weight: 600; margin-left: 4px; }
.insights { list-style: none; margin: 8px 0 0; padding: 0; display: grid; }
.insights li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.insights li:first-child { border-top: 0; }
.insights .text { flex: 1; min-width: 0; }
.insights a { white-space: nowrap; color: var(--accent); font-weight: 500; text-decoration: none; }
.insights a:hover { text-decoration: underline; }
#dict-body { display: grid; gap: 16px; } #account, #feature { max-width: 220px; text-overflow: ellipsis; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.feature { display: grid; gap: 10px; } .feature .row { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.fname { font-size: 16px; font-weight: 600; } .big-name { font-size: 22px; line-height: 28px; margin-top: 6px; }
.actions-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.adopt .bar { margin-top: 4px; }
button.link { border: 0; background: none; padding: 0; height: auto; color: var(--accent); font-weight: 500; }
.rules { display: grid; gap: 6px; margin-top: 10px; } .rules > div { display: flex; gap: 8px; align-items: flex-start; }

a.kind:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.progress { position: absolute; top: 0; left: 0; right: 0; height: 3px; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity .2s; }
.progress i { position: absolute; top: 0; bottom: 0; width: 35%; background: var(--fill); border-radius: 0 3px 3px 0; animation: progress 1.1s var(--ease) infinite; }
header.busy .progress { opacity: 1; transition-delay: .12s; }
@keyframes progress { from { left: -35%; } to { left: 100%; } }
#content { transition: opacity .15s; } #content.stale { opacity: .5; transition-delay: .12s; }
.skel { display: grid; gap: 16px; } .sk { display: block; border-radius: 14px; border: 1px solid var(--line);
  background: linear-gradient(90deg, var(--surface) 0%, var(--sunken) 50%, var(--surface) 100%) 0 0 / 200% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@media (max-width: 640px) {
  .top { gap: 8px; padding: 8px 16px; } .top .mark { margin-right: 0; } .mark .brand-name { display: none; }
  .search { order: 1; flex: 1 1 0; min-width: 0; max-width: none; } .f-more { order: 2; } .who { order: 3; } .who .meta { display: none; }
  .top::after { content: ""; order: 4; flex-basis: 100%; height: 0; }
  .f-days { order: 5; } .f-days .meta { display: none; } .f-open { order: 6; } .f-marks { order: 7; flex: 1 1 0; min-width: 0; }
  #marks-open { width: 100%; max-width: none; }
  .tg { padding-top: 4px; } .tgroup.tg-config { margin-left: 0; }
}
/* Failure detail, dates on charts, accounts' trend. */
.failure { scroll-margin-top: calc(var(--hh, 0px) + 8px); }
.fbar { position: sticky; top: var(--hh, 0px); z-index: 4; display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin: -16px -16px 12px; padding: 8px 16px;
  background: var(--surface); border-bottom: 1px solid var(--line); border-radius: 14px 14px 0 0; }
.fbar-title { flex: 1 1 160px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.fbar-act { display: flex; gap: 8px; flex-wrap: wrap; }
code.idm { color: var(--faint); font-size: 11px; } .steps:not(:has(.t:not(:empty))) .t { display: none; }
.xl { display: flex; margin: 4px 28px 0 0; font-size: 11px; line-height: 14px; color: var(--faint); }
.xl.sm { margin-right: 0; }
.xl span { flex: 1 1 0; min-width: 0; display: flex; justify-content: center; white-space: nowrap; visibility: hidden; }
.xl span.w { visibility: visible; }
.heat .xl.hx { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px; margin: 2px 0 0; }
.chart .rule { border-top-style: dashed; }
.chart .rule em { position: absolute; left: 0; top: -15px; padding-right: 4px; font: normal 11px/14px system-ui, sans-serif; color: var(--faint); pointer-events: none;
  background: color-mix(in srgb, var(--surface) 80%, transparent); }
.spark .pt rect { fill: transparent; } .spark .pt circle { fill: var(--fg2); stroke: none; opacity: 0; } .spark .pt:hover circle { opacity: 1; }
.pill.flat { background: var(--sunken); color: var(--fg2); }
.pill.trend { gap: 4px; } td > button[data-copy] { white-space: nowrap; } .chips button[disabled] { opacity: .45; cursor: default; }
.acc-name { min-width: 9em; max-width: 18em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 640px) { .xl { margin-right: 24px; } .xl.sm { margin-right: 0; } .xl span.w { visibility: hidden; } .xl span.m { visibility: visible; } }
/* Failures for developers: per-day series, first and last version, who it hit; a screen's "Onde irrita" one line per element. */
.fhead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.fhead .title { flex: 1 0 100%; }
.fspan { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 16px; margin-top: 12px; }
.fspan b { font-variant-numeric: tabular-nums; }
.fchart { margin-top: 16px; } .fchart .chart.small { margin-top: 24px; }
.fchart .cols i.acc { max-width: 14px; }
.counts li a { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fcell { min-width: 15em; } .fcell code { overflow-wrap: anywhere; }
.irr { list-style: none; margin: 4px 0 12px; padding: 0; max-width: 760px; }
.irr li { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); }
.irr li:first-child { border-top: 0; }
.irr-name { min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irr-name code.tech { display: inline; margin-left: 8px; font-weight: 400; }
.irr-name a { font-weight: 500; }
.irr-n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.irr-n b { display: inline-block; min-width: 4.5ch; }
.irr .why { grid-column: 1 / -1; color: var(--faint); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.irr .irr-kind, .irr .why.kind-only { display: none; }
@media (max-width: 640px) {
  .irr { max-width: calc(100vw - 80px); }
  .irr .irr-kind { display: inline; } .irr .why.kind-only { display: block; }
  .irr-n .meta { display: none; }
}
/* Início: the to-do grouped by screen (the other insights of a row folded under it) and the Following card. */
.fw-more { font-size: 12px; white-space: nowrap; }
.fw-rest { list-style: none; margin: 8px 0 0; padding: 0 0 0 10px; border-left: 2px solid var(--line); display: grid; gap: 6px; }
.fw-rest[hidden] { display: none; }
.fw-rest li { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; }
.fw-rest li > .pill { flex: none; height: 20px; font-size: 11px; } .fw-rest li > a { flex: none; font-size: 12px; }
.fw-say { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fw-rest .fw-say { flex: 1; }
.fw-on { height: 28px; }
.fw-verdict .meta { margin-top: 2px; }
.follow .fw-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; }
.fw-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.fw-row:first-child { border-top-color: transparent; } .fw-row[hidden] { display: none; } .fw-row > .pill { justify-self: start; }
.fw-main { min-width: 0; } .fw-main .fw-say { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; } .fw-main .meta { font-size: 12px; line-height: 16px; }
#fw-all { margin-top: 8px; } .fw-empty { margin: 8px 0 0; max-width: 72ch; }
@media (max-width: 640px) { .fw-row { grid-template-columns: minmax(0, 1fr); } .fw-row .todo-acts { justify-content: flex-start; flex-wrap: wrap; } }
/* Routing, empty states, links (ux2/a) */
:root { --link: var(--accent); --link-hover: var(--accent-hover); }
:where(a:not(.button)) { color: var(--link); } :where(a:not(.button):hover) { color: var(--link-hover); }
.nodata { padding: 24px; } .nodata p { margin: 6px 0 0; color: var(--fg2); max-width: 70ch; }
.nodata-acts { justify-content: flex-end; margin-top: 16px; }
.arrived { display: flex; align-items: center; gap: 10px; border-color: var(--ok); background: var(--ok-soft); font-weight: 500; }
.arrived .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
.widened { margin-top: 8px; color: var(--fg2); font-weight: 500; }
#marks-open:empty::before { content: '…'; }
/* Accounts' health, deltas on Uso/Produto/Pessoas/Features (usability sprint 2). */
.acc-cell { display: grid; min-width: 13em; max-width: 18em; }
.table:has(td.act) { border-radius: 0 0 13px 13px; } .acc-cell .acc-name { min-width: 0; max-width: none; }
.acc-cell code.tech { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
th.act, td.act { position: sticky; right: 0; width: 1%; padding-left: 8px; padding-right: 8px; background: var(--surface); box-shadow: -1px 0 0 var(--line); }
tbody tr.row:hover td.act { background: var(--sunken); }
button.icon { width: 32px; height: 32px; padding: 0; color: var(--fg2); }
button.icon svg { width: 16px; height: 16px; } button.icon .ok-i, button.icon.done .copy-i { display: none; } button.icon.done .ok-i { display: block; color: var(--ok); }
.chips .sep { align-self: center; margin-left: 8px; font-size: 12px; color: var(--faint); }
.pain { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 8px; }
.pain .counts li { align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--line); } .pain .counts li:first-child { border-top: 0; }
.pain .counts li > span:first-child { min-width: 0; } .pain .counts li > span:last-child { flex: none; text-align: right; }
.pain .why { display: block; margin-top: 2px; }
.pain code { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pointer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.pointer .button { height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); }
td.n .delta { display: inline-block; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const HELP_PT = {
  overall: ['O que é', 'O nível de frustração de todas as telas juntas, de 0 a 100 (quanto maior, pior): pontos dos sinais (rage click, clique sem resposta, erro…) divididos pelas visitas, vezes 20. Até 19 é baixa, 20–49 moderada, 50+ alta.', 'É média: uma tela ruim some no meio das boas. Para achar onde está o problema, use o veredito e o mapa de telas dia a dia.'],
  scoreByDay: ['O que é', 'A frustração de cada dia, na cor da faixa. Os riscos verticais marcam o dia em que cada versão começou a ser usada.', 'Degrau logo depois de um risco de versão quer dizer que o deploy mudou a experiência. Pico isolado costuma ser incidente.'],
  heat: ['O que é', 'As telas que mais pesam no período, uma linha por tela e uma célula por dia. Mais escuro, mais frustração naquele dia; cinza, ninguém visitou.', 'Procure a linha que escurece a partir de um dia: algo mudou ali. Confira se coincide com o início de uma versão.'],
  whatToSee: ['O que é', 'O que fugiu do normal, em grupos: Bugs, Irritação, Engajamento, Sugestões e Melhorou, do mais grave para o menos.', 'Comece por Bugs e Engajamento. Sugestões são hipóteses para o produto validar, não ordens.'],
  screensByFrustration: ['O que é', 'Cada tela com a frustração e os sinais que a compõem.', 'Abra a primeira da lista: mostra em qual botão as pessoas se irritam e o que falhou logo depois de clicar.'],
  byVersion: ['O que é', 'A frustração de cada versão do app no período.', 'Versão nova com mais frustração que a anterior piorou algo. A aba Versões mostra em qual tela e ação.'],
  failures: ['O que é', 'Erros de tela, do servidor, pedidos recusados e respostas lentas, agrupados pela mensagem.', 'Priorize pelas sessões atingidas, não pelo número de vezes. "Nova" é a que não existia antes do período.'],
  whereIrritates: ['O que é', 'Os botões e elementos desta tela com sinais de irritação, do que mais acontece para o que menos: rage click (vários cliques seguidos), clique sem resposta e falhas logo depois do clique. "Por quê" diz o que veio depois do rage click: esperando resposta, deu erro, nada aconteceu ou não era clicável.', 'Elemento sem nome no dicionário aparece pelo tipo (ícone, botão…), com o seletor embaixo. Dê um nome a ele no Dicionário.'],
  failureDays: ['O que é', 'Quantas vezes a falha aconteceu em cada dia do período. O risco marca o dia em que ela apareceu pela primeira vez.', 'Subida depois de um dia tranquilo costuma vir de um deploy: compare com a primeira versão em que apareceu.'],
  screensByUse: ['O que é', 'As telas pela quantidade de visitas, com cliques, pessoas e frustração.', 'Tela muito visitada e com frustração alta é onde uma melhoria rende mais.'],
  elements: ['O que é', 'Os botões e links da tela, com cliques, pessoas e problemas (rage, clique sem resposta e falhas logo depois do clique) A variação dos cliques é por visita: o "antes" é ajustado ao número de visitas de agora.', 'Muitos problemas num elemento muito usado é prioridade. O mapa de calor mostra onde ele fica na tela.'],
  never: ['O que é', 'Elementos que apareceram na tela e ninguém clicou no período.', 'Candidatos a sair, mudar de lugar ou ser explicados. Confira antes se não são de uso raro por natureza, como excluir conta.'],
  reach: ['O que é', 'Quantos cliques e telas as pessoas percorrem, desde a última gravação, até usar cada botão ou ação.', 'Muito usado e longe é candidato a atalho: traga para perto de onde as pessoas já estão.'],
  pairs: ['O que é', 'Ações que costumam vir uma logo depois da outra, e o esforço entre elas.', 'Par marcado como "juntas" e com muitos cliques no meio sugere juntar as duas numa tela ou num passo só.'],
  flow: ['O que é', 'Para a tela escolhida: de quais telas as pessoas chegam e para quais vão em seguida, em porcentagem das passagens. "Saíram do app" é onde a sessão terminou.', 'Saída alta numa tela do meio de um fluxo indica abandono. Ida e volta frequente entre duas telas sugere que falta informação numa delas.'],
  funnel: ['O que é', 'Uma sequência de telas e ações, e quantas sessões chegam a cada passo, na ordem.', 'O passo com a maior perda é onde o fluxo trava. Veja a frustração e as falhas daquela tela.'],
  byUser: ['O que é', 'Uso e frustração por pessoa, só pelo id. Clique numa pessoa para filtrar o painel por ela.', 'Frustração alta em poucas pessoas costuma ser treinamento; espalhada por todos, é a tela.'],
  effort: ['O que é', 'Cada gravação aceita pelo servidor, com os cliques e o tempo desde a anterior: o esforço para conseguir fazer aquilo. "Até a tela" são os cliques no caminho até a tela da ação; "na tela", os cliques nela.', 'Ação frequente com muitos cliques ou muito tempo é candidata a simplificar.'],
  compare: ['O que é', 'Uma versão contra outra: frustração por tela, esforço por ação e falhas que só a nova tem.', 'Variação positiva grande é regressão do deploy; falha que só a nova tem é bug introduzido por ela.'],
  release: ['O que é', 'A versão mais nova contra a anterior, por visita e por sessão: a frustração (pontos dos sinais por visita) e as falhas a cada 100 sessões. O volume de visitas fica só como contexto, porque cada versão ficou no ar por um tempo diferente. Variação de até 2 pontos na frustração conta como igual.', 'Piorou logo depois do deploy: abra as telas que mais pioraram. Se a versão anterior já saiu do período, a comparação amplia sozinha até ela.'],
  follow: ['O que é', 'O que você decidiu corrigir. Ao clicar em Acompanhar, o valor de hoje vira a linha de base: a frustração da tela, as falhas a cada 100 sessões, os cliques por vez da ação ou as pessoas por dia da conta. Depois, o mesmo número é medido só com o que veio desde então, com os filtros em uso.', 'Melhorou ou piorou só quando a mudança passa da tolerância (5 pontos de frustração, ou 20% nas outras medidas); dentro dela é Igual. Sem dados ainda: ninguém passou por ali desde que começou.'],
  todo: ['O que é', 'Tudo o que fugiu do normal, numa lista só: bugs, irritação, contas esfriando e sugestões. A ordem é a gravidade vezes o alcance: quantas sessões e pessoas foram atingidas.', 'Comece pelo topo. "Ver evidência" leva à aba que prova o problema; "Copiar como demanda" gera o texto para o backlog. Sugestões são hipóteses para o produto validar, não ordens.'],
  features: ['O que é', 'Features que o produto escolheu acompanhar: um nome e as telas, botões, ações ou eventos do app que a formam.', 'Compare os usos com o período anterior e a adoção. Feature nova com adoção baixa pede divulgação ou revisão.'],
  adoption: ['O que é', 'A parte das sessões do período em que a feature foi usada ao menos uma vez. Abaixo, quantas das pessoas ativas usaram. A adoção por pessoa chega a 100% rápido num produto de uso diário e deixa de separar uma feature da outra; a parte das sessões continua separando.', 'Presente em poucas sessões e usada por muita gente: é de uso esporádico. Em poucas sessões e por pouca gente: pede divulgação ou revisão.'],
  featureScore: ['O que é', 'A frustração da feature: sinais nas telas e botões dela, divididos pelos usos.', 'Feature importante com frustração alta é a melhor candidata a revisão de experiência.'],
  byAccount: ['O que é', 'Os usos da feature em cada conta, agora contra o período anterior.', 'Conta que usava muito e caiu merece contato antes que vire cancelamento.'],
  accountPain: ['O que é', 'As telas com mais frustração e as falhas que mais atingiram esta conta no período, só com o uso dela. Os links abrem a aba já filtrada pela conta.', 'Leve isto para a conversa com o cliente e para o time: o que dói nesta conta, com a evidência a um clique.'],
  accounts: ['O que é', 'Para cada conta: frustração (de 0 a 100, pontos dos sinais por visita), falhas que ela encontrou, pessoas e sessões por dia e uso das features vigiadas, contra o período anterior. "Pior primeiro" soma 25 pontos por número que caiu, a frustração, o quanto ela subiu e as falhas a cada 100 visitas. A Tendência diz "Caiu" quando um desses números ficou em 60% ou menos do que era e além da oscilação normal; "Subiu" é o espelho (o de antes era 60% ou menos do atual, além da oscilação) sem nada caindo; o resto é "Estável". A variação aparece em %; passe o mouse para ver o número de antes.', 'Conta que esfria costuma avisar antes de cancelar. Abra a conta para ver o dia em que começou a cair.'],
  usersDay: ['O que é', 'A média de pessoas diferentes que usaram o app por dia, nos dias com dados.', 'Queda aqui é o sinal mais cedo de que a conta está deixando o produto.'],
  kinds: ['O que é', 'A frustração separada pelo que a causa: Irritação (rage click), Clique sem efeito, Falha (erros e pedidos recusados), Lentidão e Desistência (formulário abandonado, voltou na hora). Cada tipo usa os mesmos pontos e as mesmas visitas, então as partes somam o total. O Esforço é outra medida: cliques até concluir uma ação, no caso típico.', 'O tipo que mais pesa diz quem resolve: Falha e Lentidão são do dev; Clique sem efeito e Irritação costumam ser de experiência; Desistência e Esforço, de fluxo e produto. Clique num tipo para ver as telas em que ele pesa. Em Irritação, o "por quê" é o motivo provável de cada rajada de cliques: esperando resposta, deu erro, nada aconteceu, parece clicável mas não é, botão desabilitado, sem retorno claro.'],
  map: ['O que é', 'Uma prévia da tela desenhada pelas posições dos botões, links e regiões (menu, cabeçalho, conteúdo) que o app enviou, sem nada do que a tela mostra. Problemas pinta só o que irrita, pela parte dos cliques que viram raiva, clique sem resposta ou erro logo depois; Uso pinta pelo número de cliques (tracejado: ninguém clica); Rotas desenha para onde as pessoas vão depois de cada elemento. Clique num elemento para ver os números dele. "Abrir no app" mostra o mesmo sobre a tela real, por uma hora.', 'Elemento vermelho forte é o primeiro a consertar. Botão importante claro ou tracejado está escondido ou mal nomeado. "Vai e volta" entre dois elementos, ou setas que cruzam a tela de ponta a ponta, sugerem juntar os dois ou mudar a ordem.'],
  detours: ['O que é', 'Tarefas começadas numa tela (clicou ou digitou, sem salvar) em que a pessoa sai e volta para concluir: para outra tela do sistema, ou para fora do navegador. Vale para formulário, filtro, modal, configuração — qualquer coisa. Nada do que foi digitado é coletado.', 'Saída frequente para a mesma tela é informação que falta aqui: trazer, buscar ou preencher automaticamente. Saída do navegador é informação que vem de fora: integração ou importação.'],
  ways: ['O que é', 'Por quais telas as pessoas passam, desde a última coisa que salvaram, antes de usar cada botão ou ação, comparado com o normal do app. A tela inicial e os menus estão no caminho de tudo, por isso só se destaca a tela que aparece bem mais do que o normal.', 'Uma tela que aparece no caminho muito mais do que o normal, e onde a pessoa clicou por lá, é onde ela procura aquilo primeiro: um atalho ali, ou mudar o recurso de lugar.'],
  patterns: ['O que é', 'O que as pessoas fazem sempre do mesmo jeito: o campo em que clicam primeiro ao abrir uma tela, o clique que quase sempre vem depois de outro, o botão que clicam depois de digitar em vez de usar Enter, o botão que precisou de dois cliques e o clique que quase acertou um botão. Só clique de pessoa conta; nada do que é digitado sai do navegador.', 'Cada padrão é um atrito pequeno e repetido: foco automático, Enter que funciona, área de clique maior. Somados, viram minutos por dia de quem usa muito.'],
  areas: ['O que é', 'O produto dividido em áreas (grupos de telas), com a parte das visitas, a parte das sessões que passaram pela área, a frustração e as falhas de cada uma, contra o período anterior. "Nas sessões" troca a adoção por pessoa: num produto de uso diário quase todo mundo passa por tudo, então 100% das pessoas não separa uma área da outra; a parte das sessões separa. A variação das falhas é por visita: o "antes" é ajustado ao número de visitas de agora. A área de cada tela se ajusta no Dicionário.', 'Área presente em muitas sessões e com frustração alta é onde o time mais incomoda gente. Área em poucas sessões pode ser nicho ou algo difícil de achar.'],
  low: ['O que é', 'Botões que muitas sessões viram e quase ninguém clicou.', 'Construído e pouco usado: candidato a sair, mudar de lugar ou ser explicado. Confira se não é de uso raro por natureza.'],
  news: ['O que é', 'O que apareceu pela primeira vez no período, e a parte das sessões que viram e usaram.', 'Novidade com uso baixo depois de alguns dias pede divulgação, ajuste ou revisão do valor.'],
  dictionary: ['O que é', 'O nome que as pessoas usam para cada tela, botão, ação e conta. Vazio usa o nome que o app mostra.', 'Dê nome primeiro aos ícones sem rótulo e às telas de detalhe: são os que aparecem crus no painel.'],
}
const HELP_EN = {
  overall: ['What it is', 'The frustration of every screen together: signal points (rage click, dead click, error…) divided by visits, times 20, capped at 100. From 0 to 100, the higher the worse: up to 19 low, 20–49 medium, 50+ high.', 'It is an average: one bad screen hides among the good ones. To find where the problem is, use the verdict and the screens-by-day map.'],

  heat: ['What it is', 'The screens that weigh the most, one row per screen and one cell per day. Darker is more frustration that day; grey, nobody visited.', 'Look for the row that darkens from one day on: something changed there. Check whether it matches a version start.'],

const $ = (s) => document.querySelector(s)
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const band = (n) => (n >= 50 ? 'bad' : n >= 20 ? 'warn' : 'ok')
const say = (n) => (n >= 50 ? L.much : n >= 20 ? L.attention : L.calm)
const scoreHtml = (n) => `<b class="${band(n)}">${n}</b>`
const keep = (k, v) => { try { localStorage.setItem('termometro.' + k, v) } catch {} }
const recall = (k) => { try { return localStorage.getItem('termometro.' + k) } catch { return null } }
const ago = (at) => {
  const m = Math.floor((Date.now() - at) / 60000)
  return m < 1 ? L.now : m < 60 ? L.ago(m, 'm') : m < 1440 ? L.ago(Math.floor(m / 60), 'h') : L.ago(Math.floor(m / 1440), 'd')
}
const short = (id) => (id.length > 12 ? id.slice(0, 8) + '…' : id)
const table = (head, rows) => `<div class="table"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`
// "No visits in this period" anywhere becomes the empty state that says why and offers the way out (see emptyState).
const empty = (msg) => msg === L.noVisits && state.status?.events ? emptyState() : `<div class="card empty">${msg}</div>`

// Names people use, from /api/names: the business name leads, the technical key always comes with it.
const NM = () => state.names ?? { screens: {}, controls: {}, actions: {} }
function screenText(route) {
  if (!route) return ''
  const n = NM().screens[route]
  if (n) return n
  const m = route.match(/^(.*?)\/:id(\/.*)?$/) // a record's page: named after the list it belongs to
  const parent = m && NM().screens[m[1] || '/']
  return parent ? `${parent} › ${L.record}${m[2] ? ' › ' + m[2].slice(1) : ''}` : ''
}
const controlLabel = (route, target) => NM().controls[route + '\t' + target] ?? ''
const controlText = (route, target) => { const l = controlLabel(route, target); return l ? `${screenText(route) || route} › ${l}` : '' }
const actionText = (detail) => NM().actions[detail] ?? ''
const named = (name, tech) => name ? `<span class="nm">${esc(name)}</span><code class="tech">${esc(tech)}</code>` : `<code>${esc(tech)}</code>`
const scr = (route) => named(screenText(route), route)
const ctl = (route, target) => named(controlText(route, target), target)
const act = (detail) => named(actionText(detail), detail)
// An insight's facts with the business names in place of the keys (escaped for HTML unless raw), and its keys apart.
function nameFields(i, raw = false) {
  const e = raw ? (x) => x : esc
  const pick = (name, key) => e(name || key)
  const out = Object.fromEntries(Object.entries(i).map(([k, v]) => [k, typeof v === 'string' ? e(v) : v]))
  if (i.route) out.route = pick(screenText(i.route), i.route)
  if (i.target) out.target = pick(controlLabel(i.route, i.target), raw ? i.target : L.unnamed)
  if (i.next_target) out.next_target = pick(controlLabel(i.next_route, i.next_target), raw ? i.next_target : L.unnamed)
  if (i.action) out.action = pick(actionText(i.action), i.action)
  if (i.key) out.key = pick(i.kind_of === 'action' ? actionText(i.key) : controlLabel(i.route, i.key), i.key)
  if (i.kind === 'pair_linked') { out.a = pick(actionText(i.a), i.a); out.b = pick(actionText(i.b), i.b) }
  if (i.account) out.account = e(accountText(i.account))
  if (i.via) out.via = pick(screenText(i.via), i.via)
  return out
}
const techOf = (i) => [...new Set([i.route, i.via, i.target, i.next_target, i.action, i.key, i.kind === 'pair_linked' && i.a, i.kind === 'pair_linked' && i.b,
  i.account && `account=${i.account}`].filter(Boolean))]
  .map((x) => `<code>${esc(x)}</code>`).join(' · ')
const signals = (s) => {
  const items = Object.entries(s).sort((a, b) => b[1] - a[1])
  return items.length ? `<div class="signals">${items.map(([k, n]) => `<span title="${esc(L.help[k] ?? '')}">${esc(L.names[k] ?? k)} <b>${num(n)}</b></span>`).join('')}</div>` : `<span class="meta">${L.none}</span>`
}

const state = { me: null, tab: 'overview', user: '', all: '', cat: '', route: '', action: '', a: '', b: '', signal: '', detail: '', funnel: '', hash: new URLSearchParams(), focus: false }

// Address: #tab?project=…&days=…&route=… — every view can be linked to and the back button works.
const FILTERS = ['project', 'days', 'version', 'account', 'role', 'feature']
const PARAMS = ['user', 'all', 'cat', 'route', 'action', 'a', 'b', 'signal', 'detail', 'funnel']
// What each tab reads from the address besides the filters, the person (user) and the whole period (all): a tab switch
// carries only these, so a screen picked on one tab does not ride along in the next one's link.
const TAB_PARAMS = { frustration: ['route', 'cat'], failures: ['signal', 'detail'], usage: ['route'], journeys: ['route', 'funnel'],
  map: ['route'], actions: ['action'], versions: ['a', 'b'] }
const tabParams = (tab, from = state) => Object.fromEntries(PARAMS.map((k) => [k, k === 'user' || k === 'all' || (TAB_PARAMS[tab] ?? []).includes(k) ? from[k] : '']))
function readHash() {
  const [tab, qs] = location.hash.slice(1).split('?')
  state.tab = TABS[tab] ? tab : 'overview'
  state.hash = new URLSearchParams(qs || '')
  for (const k of PARAMS) state[k] = state.hash.get(k) || ''
}
function hashFor(tab, params = {}) {
  const p = new URLSearchParams()
  // The period always goes along: it is remembered per browser, and a link opened elsewhere must show the same numbers.
  for (const k of FILTERS) { const v = k in params ? params[k] : $('#' + k)?.value; if (v) p.set(k, v) }
  for (const k of PARAMS) { const v = k in params ? params[k] : k === 'user' || k === 'all' ? state[k] : ''; if (v) p.set(k, v) }
  return '#' + tab + (p.toString() ? '?' + p : '')
}
function writeHash() {
  const h = hashFor(state.tab, tabParams(state.tab))
  state.hash = new URLSearchParams(h.split('?')[1] || '')
  if (location.hash !== h) history.replaceState(null, '', h)
}
const go = (tab, params) => { location.hash = hashFor(tab, params).slice(1) }
const linkAttrs = (link) => `href="${esc(hashFor(link.tab, link.params))}"`

    ${m.google && m.password ? `<div class="or">${L.or}</div>` : ''}

// Marks: saved moments (a redesign, a version) the dashboard can count from, one at a time, or the whole period.
const projectNow = () => state.me.projects.find((p) => p.name === $('#project').value)
const dateOf = (at) => new Date(at).toLocaleDateString(PT ? 'pt-BR' : 'en', { day: '2-digit', month: '2-digit', year: 'numeric' })
function markChip() {
  const p = projectNow(), M = L.mark, active = (p?.marks ?? []).find((m) => m.at === p?.mark)
  const b = $('#marks-open')
  if (!b) return
  // Short date on the chip (the year only when it is not this one), the full one in the tooltip.

  if (p?.mark && state.all) { b.innerHTML = `<span class="ell">${esc(`${M.button}: ${M.whole}`)}</span>`; b.title = L.nodata.allChip; b.classList.remove('on'); return }

async function markAction(body) {
  const p = projectNow()
  const res = await fetch(`/api/mark?project=${encodeURIComponent(p.name)}`, { method: 'POST', body: JSON.stringify(body) })
  if (res.status === 401) return boot()
  const out = await res.json()
  if (!res.ok) { const e = $('#mark-error'); if (e) { e.textContent = L.mark.future; e.hidden = false }; return }
  p.mark = out.mark; p.marks = out.marks; state.all = ''
  $('#marks')?.remove(); $('#marks-open')?.setAttribute('aria-expanded', 'false')
  render()
}
document.addEventListener('click', (e) => {
  const open = e.target.closest?.('#marks-open'), panel = $('#marks')
  if (open) {
    if (panel) panel.remove()
    else {
      open.insertAdjacentHTML('afterend', marksPanel())
      const box = $('#marks'), r = open.getBoundingClientRect()
      box.style.top = r.bottom + 6 + 'px'; box.style.left = Math.max(16, Math.min(r.left, innerWidth - box.offsetWidth - 16)) + 'px'
    }
    open.setAttribute('aria-expanded', String(!panel)); return
  }
  const use = e.target.closest?.('[data-mark-use]')
  if (use && !use.disabled) return markAction(use.dataset.markUse ? { action: 'use', id: use.dataset.markUse } : { action: 'none' })
  const del = e.target.closest?.('[data-mark-del]')
  if (del) { const m = projectNow().marks.find((x) => x.id === del.dataset.markDel); if (confirm(L.mark.confirmRemove(m?.name || dateOf(m.at)))) markAction({ action: 'delete', id: del.dataset.markDel }); return }
  if (panel && !e.target.closest('#marks')) { panel.remove(); $('#marks-open')?.setAttribute('aria-expanded', 'false') }
})
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'mark-new') return
  e.preventDefault()
  const f = e.target, [y, m, d] = f.date.value.split('-').map(Number)
  const day = new Date(y, m - 1, d), now = new Date()
  // Today: from this moment; a past day: from its start.
  const at = day.toDateString() === now.toDateString() ? now.getTime() : day.getTime()
  markAction({ action: 'create', name: f.name.value, at })
})

// Header bar: the period and the account at hand, the rest behind "Filters"; what is on shows as chips under the tabs.
// The tabs in groups, by the question they answer; the hashes stay the same, so old links still open.
const NAV = [['summary', ['overview']], ['problems', ['frustration', 'failures', 'actions', 'versions']],
  ['usage', ['usage', 'journeys', 'map', 'product', 'features']], ['people', ['people', 'accounts']], ['config', ['dictionary']]]
const NARROW = matchMedia('(max-width: 899px)')
const BAR = () => L.bar
// On a narrow screen the account goes inside the panel too; the select is moved, never copied, so its value and listeners stay.
const placeAccount = () => { const f = $('#f-account'); if (f) $(NARROW.matches ? '.f-account-panel' : '.f-account-top').append(f) }
const optText = (id) => { const s = $('#' + id); return s?.selectedOptions[0]?.textContent ?? s?.value }
function filterBar() {

  const n = inPanel.filter((id) => $('#' + id)?.value).length
  const open = $('#filters-open'); if (open) open.textContent = n ? `${BAR().filters} · ${n}` : BAR().filters

// Tabs on a narrow screen scroll sideways: a fade on the side that has more, and the open tab brought into view.
function navEdges() {
  const nav = $('nav.tabs'); if (!nav) return
  nav.classList.toggle('fade-l', nav.scrollLeft > 2)
  nav.classList.toggle('fade-r', nav.scrollLeft + nav.clientWidth < nav.scrollWidth - 2)
}
function markTab() {
  const nav = $('nav.tabs'); if (!nav) return
  nav.querySelectorAll('a[data-tab]').forEach((a) => {
    const on = a.dataset.tab === state.tab
    a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current')
  })
  const a = nav.querySelector('a.on')
  if (a && nav.scrollWidth > nav.clientWidth) {
    const r = a.getBoundingClientRect(), box = nav.getBoundingClientRect()
    if (r.left < box.left + 24 || r.right > box.right - 24) nav.scrollLeft += r.left - box.left - (box.width - r.width) / 2
  }
  navEdges()
}
function closeFilters(focus) {
  const panel = $('#filters'); if (!panel || panel.hidden) return
  panel.hidden = true; $('#filters-open').setAttribute('aria-expanded', 'false'); if (focus) $('#filters-open').focus()
}
function wireBar() {
  placeAccount(); NARROW.addEventListener('change', () => { placeAccount(); filterBar() })
  const nav = $('nav.tabs'); nav.addEventListener('scroll', navEdges, { passive: true }); addEventListener('resize', navEdges)
  markTab()
  $('header').addEventListener('click', (e) => {
    const c = e.target.closest('[data-clear]')
    if (c) {
      const ids = c.dataset.clear === '*' ? ['version', 'account', 'role', 'feature', 'user'] : [c.dataset.clear]
      for (const id of ids) if (id === 'user' || id === 'all') state[id] = ''; else { $('#' + id).value = ''; keep(id, '') }
      return render()
    }
    if (e.target.closest('#filters-done')) return closeFilters(true)
    if (e.target.closest('#filters-open')) {
      const panel = $('#filters'), open = $('#filters-open')
      if (!panel.hidden) return closeFilters()
      panel.hidden = false; open.setAttribute('aria-expanded', 'true')
      const r = open.getBoundingClientRect()
      panel.style.top = r.bottom + 6 + 'px'; panel.style.left = Math.max(16, Math.min(r.left, innerWidth - panel.offsetWidth - 16)) + 'px'
      panel.querySelector('select')?.focus()
    }
  })
  document.addEventListener('click', (e) => { if (!e.target.closest('#filters, #filters-open')) closeFilters() })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#filters')?.hidden) closeFilters(true) })
}
// Loading: a thin bar on top and the previous content dimmed while the next one comes; the very first time, a skeleton.
let renderSeq = 0
// Chart columns and heat cells take focus to show their tooltip; a screen reader gets the same text as their name.
const describeTips = () => document.querySelectorAll('#content [tabindex="0"][data-tip]:not([aria-label])').forEach((el) => {
  el.setAttribute('role', 'img'); el.setAttribute('aria-label', el.dataset.tip) })
const skeleton = () => `<div class="skel" aria-hidden="true"><i class="sk" style="height:76px"></i><div class="numbers">${'<i class="sk" style="height:120px"></i>'.repeat(4)}</div>
  <i class="sk" style="height:260px"></i><i class="sk" style="height:180px"></i></div>`
function busy(on) {
  const c = $('#content'); if (!c) return
  $('header')?.classList.toggle('busy', on)
  c.classList.toggle('stale', on && !!c.textContent.trim() && !c.querySelector('.skel'))

  const live = $('#live'); if (live) live.textContent = on ? BAR().loading : BAR().loaded(L.tabs[state.tab] ?? '')
}

const personName = (id) => NM().people?.[id] ?? ''
const featureName = (id) => (NM().features ?? []).find((x) => x.id === id)?.name ?? id
const accountText = (id) => { const n = NM().accounts?.[id]; return n ? (n.includes(id) ? n : `${n} (${id})`) : id }
async function loadFilters(keepNames = false) {
  const f = await (await fetch('/api/filters?project=' + encodeURIComponent($('#project').value))).json()
  const fill = (id, values, all) => {
    const current = state.hash.has(id) ? state.hash.get(id) : state.hash.toString() ? '' : $('#' + id).value || recall(id) || ''
    $('#' + id).innerHTML = `<option value="">${all}</option>` + values.map((v) => `<option value="${esc(v)}">${esc(id === 'account' ? accountText(v) : id === 'feature' ? featureName(v) : v)}</option>`).join('')
    $('#' + id).value = values.includes(current) ? current : ''
  }
  if (!keepNames) state.names = await (await fetch('/api/names?project=' + encodeURIComponent($('#project').value))).json().catch(() => null)
  fill('version', f.versions, L.allf); fill('account', f.accounts, L.all); fill('role', f.roles, L.all)
  fill('feature', (NM().features ?? []).map((x) => x.id), L.allf)
}

function query(extra = {}) {
  const q = new URLSearchParams({ project: $('#project').value, days: $('#days').value })
  for (const k of ['version', 'account', 'role', 'feature']) if ($('#' + k).value) q.set(k, $('#' + k).value)
  if (state.user) q.set('user', state.user)
  if (state.all) q.set('all', '1')
  for (const [k, v] of Object.entries(extra)) if (v) q.set(k, v)
  return q
}
async function read(path, extra) {
  const res = await fetch(`${path}?${query(extra)}`)
  if (res.status === 401) { boot(); throw new Error('signed out') }
  return res.json()
}

// Search ---------------------------------------------------------------------------------------------------
function wireSearch() {
  const input = $('#search'), box = $('#results')
  let timer = 0, seq = 0
  const close = () => { box.hidden = true; input.setAttribute('aria-expanded', 'false') }
  const show = async () => {
    const q = input.value.trim()
    if (q.length < 2) return close()
    const mine = ++seq
    const { results } = await read('/api/search', { q }).catch(() => ({ results: [] }))
    if (mine !== seq) return
    const groups = {}
    for (const r of results) (groups[r.kind] ??= []).push(r)
    box.innerHTML = results.length ? Object.entries(groups).map(([kind, list]) => `<div class="group label">${L.kinds[kind]}</div>` + list.map((r) =>
      `<a ${linkAttrs(r.link)}><span>${r.type ? `<code>${esc((L.names[r.type] ?? r.type) + ': ' + r.label)}</code>`
          : named(r.kind === 'screen' ? screenText(r.label) : r.kind === 'element' ? controlText(r.route, r.label) : r.kind === 'action' ? actionText(r.label) : r.kind === 'user' ? personName(r.label) : r.kind === 'account' && accountText(r.label) !== r.label ? accountText(r.label) : '', r.label)}</span>
        <span class="meta">${r.route && r.kind !== 'screen' && r.kind !== 'element' ? esc(screenText(r.route) || r.route) + ' · ' : ''}${r.n || ''}</span></a>`).join('')).join('')
      : `<div class="empty">${L.noResults}</div>`
    box.hidden = false; input.setAttribute('aria-expanded', 'true')
  }
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(show, 200) })
  input.addEventListener('focus', () => { if (box.innerHTML && input.value.trim().length >= 2) box.hidden = false })
  input.addEventListener('keydown', (e) => {
    const items = [...box.querySelectorAll('a')], at = items.findIndex((a) => a.classList.contains('on'))
    if (e.key === 'Escape') { close(); input.blur() }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!items.length) return
      const next = (at + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length
      items.forEach((a, i) => a.classList.toggle('on', i === next)); items[next].scrollIntoView({ block: 'nearest' })
    } else if (e.key === 'Enter' && items.length) { e.preventDefault(); (items[at] ?? items[0]).click() }
  })
  box.addEventListener('click', (e) => { if (e.target.closest('a')) { close(); input.blur() } })
  document.addEventListener('click', (e) => { if (!e.target.closest('.search')) close() })
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !e.target.matches('input, select, textarea')) { e.preventDefault(); input.focus(); input.select() }
  })
}

// An insight as a request for the backlog: the business story first, the technical detail last.
function demandOf(i, sentenceHtml, days) {
  const M = L.demand, k = M.kinds[i.kind] ?? ['', '', () => '']
  const plain = Object.assign(document.createElement('div'), { innerHTML: sentenceHtml }).textContent.replace(/\s+/g, ' ').trim()
  const named = nameFields(i, true)
  const where = named.route || named.account || named.action || named.key || ''
  const url = location.origin + location.pathname + hashFor(i.link.tab, i.link.params)
  return [`## ${k[0]}${where ? ': ' + where : ''}`, '',
    `**${M.problem}:** ${plain}`,
    `**${M.who}:** ${M.reach(i) || '—'}${i.account ? '' : ' ' + M.period(days)}`,
    ...(i.b || i.first_version ? [`**${M.since}:** ${i.b || i.first_version}`] : []),
    `**${M.suggestion}:** ${i.kind === 'element_irritating' && i.reason && L.rageFix[i.reason] ? L.rageFix[i.reason] : k[1]}`,
    `**${M.accept}:** ${k[2](i)}`,
    `**${M.evidence}:** ${url}`, '',
    `---`, `${M.tech}: ${techOf(i).replace(/<[^>]+>/g, '')}${i.detail ? ' · ' + i.detail : ''}`].join('\n')
}

// Kinds of frustration: a fixed colour per kind (categorical slots 1-5), always with its name beside it.
const KINDS = ['irritation', 'no_effect', 'failure', 'slowness', 'giving_up']
const C = () => L.cat
// One whole split in its parts: a thin bar, a part per kind, its name and value in the tooltip.
const kindBar = (cats, total) => { const sum = KINDS.reduce((a, k) => a + (cats?.[k] ?? 0), 0) || 1
  return `<div class="kbar" role="img" aria-label="${esc(KINDS.filter((k) => cats?.[k]).map((k) => `${C().names[k]} ${cats[k]}`).join(', '))}">${KINDS.filter((k) => cats?.[k]).map((k) =>
    `<i class="k-${k}" style="width:${cats[k] / sum * Math.min(100, total)}%" data-tip="${esc(`${C().names[k]}: ${cats[k]}`)}"></i>`).join('')}</div>` }
// The likely reasons of the rage clicks, most common first: "62% waiting for an answer · 30% nothing happened".
const reasonsText = (r, top = 2) => { const total = Object.values(r ?? {}).reduce((a, b) => a + b, 0)
  return total ? Object.entries(r).sort((a, b) => b[1] - a[1]).slice(0, top).map(([k, n]) => `${Math.round(n / total * 100)}% ${L.rageWhy[k] ?? k}`).join(' · ') : '' }
const kindLegend = () => `<div class="legend">${KINDS.map((k) => `<span><i class="sw k-${k}"></i>${C().names[k]}</span>`).join('')}</div>`

function kindsCard(o) {
  const k = o.kinds, total = KINDS.reduce((a, c) => a + k.now[c], 0) || 1
  const comparable = o.before_daily.length >= Math.max(1, Math.ceil(o.daily.length / 2))
  const delta = (now, before) => !comparable || now === before ? '' : `<span class="delta ${now > before ? 'bad' : 'ok'}">${now > before ? '▲ +' : '▼ '}${now - before}</span>`
  const e = k.effort
  return `<section class="card"><div class="head"><div><div class="label">${C().title}${help('kinds')}</div><div class="meta">${C().hint}</div></div></div>
    <div class="kinds">${KINDS.map((c) => `<a class="kind" ${linkAttrs({ tab: 'frustration', params: { cat: c } })}>
        <span class="kname"><i class="sw k-${c}"></i>${C().names[c]}</span>
        <span class="kval">${k.now[c]}${delta(k.now[c], k.before[c])}</span>
        ${spark(k.daily.map((d) => d[c]), `${C().names[c]}: ${L.perDay}`, 96, 24)}
        <span class="meta">${C().what[c]} · ${C().share(Math.round(k.now[c] / total * 100))}</span>
        ${c === 'irritation' && reasonsText(k.rage_reasons) ? `<span class="why">${C().why}: ${esc(reasonsText(k.rage_reasons))}</span>` : ''}
        <span class="kshare"><i class="k-${c}" style="width:${k.now[c] / total * 100}%"></i></span></a>`).join('')}
      <a class="kind effort" ${linkAttrs({ tab: 'actions', params: {} })}><span class="kname">${C().effort}</span>
        <span class="kval">${C().effortUnit(e.now.clicks)}${comparable && e.before.actions && e.now.clicks !== e.before.clicks
          ? `<span class="delta ${e.now.clicks > e.before.clicks ? 'bad' : 'ok'}">${e.now.clicks > e.before.clicks ? '▲' : '▼'}&nbsp;${FT().before(num(e.before.clicks))}</span>` : ''}</span>
        ${spark(e.daily.map((d) => d.clicks), `${C().effort}: ${L.perDay}`, 96, 24)}
        ${e.now.here_median !== null && e.now.here_median !== undefined ? `<span class="why">${esc(C().effortSplit(e.now.path_median, e.now.here_median))}</span>` : ''}
        <span class="meta">${C().effortWhat} · ${num(e.now.actions)} ${PT ? 'ações' : 'actions'}</span></a>
    </div></section>`
}

// Overview -------------------------------------------------------------------------------------------------
const GROUPS = { bugs: ['failure_new', 'failure_recurring'], irritation: ['version_worse', 'screen_worse', 'screen_frustrating', 'element_irritating', 'action_laborious', 'retry_needed', 'near_miss'],
  engagement: ['account_fading', 'account_feature_drop'], ideas: ['reach_far', 'pair_linked', 'form_detour', 'form_away', 'looked_elsewhere', 'focus_candidate', 'click_follows', 'search_no_enter'], better: ['screen_better'] }
const groupOf = (kind) => Object.keys(GROUPS).find((g) => GROUPS[g].includes(kind)) ?? 'ideas'
const num = (n) => Number(n).toLocaleString(PT ? 'pt-BR' : 'en')

// Counts said the way people read them: thousands separated, the noun agreeing ("1 sessão", "1.234 sessões").
const plural = (n, one, many) => `${num(n)} ${Math.abs(n) === 1 ? one : many}`
// A day (YYYY-MM-DD, a UTC day as SQLite counts them) as people write it: 05/11, or 11/05 in English.
const dayText = (d) => (/^\d{4}-\d{2}-\d{2}$/.test(d) ? new Date(d + 'T12:00:00Z').toLocaleDateString(PT ? 'pt-BR' : 'en', { day: '2-digit', month: '2-digit', timeZone: 'UTC' }) : d)
// Day labels under columns, thinned to fit: every day, every 2 or every week (the latest day always labelled);
// "w" marks the ones shown on a wide screen, "m" the ones shown on a phone.
const every = (n, fit) => [1, 2, 7, 14, 28].find((k) => Math.ceil(n / k) <= fit) ?? 28
const dayAxis = (days, cls = '') => { const n = days.length, w = every(n, 16), m = every(n, 6)
  return `<div class="xl ${cls}" aria-hidden="true">${days.map((d, i) => `<span class="${(n - 1 - i) % w ? '' : 'w'} ${(n - 1 - i) % m ? '' : 'm'}">${esc(dayText(d))}</span>`).join('')}</div>` }
// Frustration now against before, in points: going up is worse (▲ +42), down is better (▼ −12); the number before in the tooltip.
const scoreDelta = (now, before) => before === null || before === undefined ? '' : now === before ? `<span class="delta meta" title="${esc(FT().before(before))}">=</span>`
  : `<span class="delta ${now > before ? 'bad' : 'ok'}" title="${esc(FT().before(before))}">${now > before ? '▲ +' : '▼ −'}${Math.abs(now - before)}</span>`
// A count now against before, in %: neither good nor bad by itself (visits), so no colour; the number before in the tooltip.
// A small base makes a giant percent, as on Início: below 20 before, the value before; beyond ±500%, how many times.
const countDelta = (now, before) => { if (before === null || before === undefined || !before) return ''
  const pct = Math.round((now - before) / before * 100)
  if (!pct) return `<span class="delta meta" title="${esc(FT().before(num(before)))}">=</span>`
  const text = before < 20 ? L.dwas(num(before)) : Math.abs(pct) > 500 ? `×${num(Math.round(now / before))}` : `${pct > 0 ? '+' : '−'}${Math.abs(pct)}%`
  return `<span class="delta meta" title="${esc(FT().before(num(before)))} · ${esc(L.dtip(pct))}">${pct > 0 ? '▲' : '▼'} ${text}</span>` }

// A 2px line of the values, oldest to newest, with a dot on the latest. Each point has a hover target as wide as its
// slot, its value (and its day, when given) in the tooltip; the whole names the range.
function spark(values, tip, w = 120, h = 28, days) {
  if (values.length < 2) return ''
  const top = Math.max(...values), low = Math.min(...values), span = top - low || 1
  const xy = values.map((v, i) => [i / (values.length - 1) * (w - 8) + 4, h - 4 - (v - low) / span * (h - 8)])
  const [lx, ly] = xy[xy.length - 1]
  const slot = (w - 8) / (values.length - 1), name = tip.split(':')[0]
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(tip)}" data-tip="${esc(tip)}">
    <polyline points="${xy.map((p) => p.join(',')).join(' ')}"/><circle cx="${lx}" cy="${ly}" r="4"/>
    ${xy.map(([x, y], i) => `<g class="pt" data-tip="${esc(`${days?.[i] ? dayText(days[i]) : name}: ${num(values[i])}`)}"><rect x="${Math.max(0, x - slot / 2)}" y="0" width="${slot}" height="${h}"/><circle cx="${x}" cy="${y}" r="3"/></g>`).join('')}</svg>`
}

// Score per day: one column per day in its band's colour, the 20 and 50 lines named after the band they open, a mark
// where each version began, the days under the columns; the tooltip says the day, its score and the change from the day before.
function scoreChart(o) {
  const days = o.daily, n = days.length
  if (n < 2) return ''
  const top = Math.max(25, ...days.map((d) => d.score)) * 1.1
  const y = (v) => 100 - v / top * 100
  const at = Object.fromEntries(days.map((d, i) => [d.day, i]))
  const marks = o.deploys.filter((d) => d.day in at && at[d.day] > 0)
  const col = 100 / n
  const vsPrev = (i) => { if (!i) return ''; const x = days[i].score - days[i - 1].score
    return ' · ' + L.vsPrevDay(x > 0 ? `▲ +${x}` : x < 0 ? `▼ −${-x}` : '=') }
  return `<section class="card"><div class="head"><div><div class="label">${L.scoreByDay}${help('scoreByDay')}</div>
      <div class="meta">${esc(dayText(days[0].day))} → ${esc(dayText(days[n - 1].day))} · ${L.peak(Math.max(...days.map((d) => d.score)))}</div></div>
      <div class="legend">${['ok', 'warn', 'bad'].map((b) => `<span><i class="sw ${b}"></i>${L.bands[b]}</span>`).join('')}</div></div>
    <div class="chart">
      ${[[20, L.attention], [50, L.much]].filter(([v]) => v < top).map(([v, name]) => `<div class="rule" style="top:${y(v)}%"><span>${v}</span><em>${name}</em></div>`).join('')}
      ${marks.map((d) => `<div class="deploy" style="left:${at[d.day] * col}%" data-tip="${esc(L.deployTip(d.version, when(d.at)))}"><span>${esc(d.version)}</span></div>`).join('')}
      <div class="cols">${days.map((d, i) => `<div class="c" tabindex="0" data-tip="${esc(L.dayTip(d.day, d.score, d.visits) + vsPrev(i))}">
        <i class="${band(d.score)}" style="height:${Math.max(1.5, d.score / top * 100)}%"></i></div>`).join('')}</div>
    </div>${dayAxis(days.map((d) => d.day))}</section>`
}

// Screens by day: the darker the cell, the worse that day's score (one hue, the scale below says how much).
const HEAT = [[50, 5], [35, 4], [20, 3], [10, 2], [0, 1]]
function heatMap(o) {
  const days = o.daily.map((d) => d.day)
  if (days.length < 3 || !o.screens.length) return ''
  const at = new Set(o.deploys.map((d) => d.day))
  const first = days[0]
  return `<section class="card"><div class="head"><div><div class="label">${L.heat}${help('heat')}</div><div class="meta">${L.heatHint}</div></div>
      <div class="legend"><span class="meta">${L.heatScale}</span>${HEAT.slice().reverse().map(([v, k]) => `<span><i class="sw h${k}"></i>${v}${k === 5 ? '+' : ''}</span>`).join('')}</div></div>
    <div class="heat" style="--n:${days.length}">
      <div></div><div class="vers">${days.map((d) => `<span>${at.has(d) && d !== first ? esc(o.deploys.find((x) => x.day === d).version) : ''}</span>`).join('')}</div>
      ${o.screens.map((r) => `<a class="hl" ${linkAttrs({ tab: 'frustration', params: { route: r.route } })} title="${esc(r.route)}">${esc(screenText(r.route) || r.route)}</a>
        <div class="cells">${days.map((d) => { const x = r.days[d]; const k = x ? HEAT.find(([v]) => x.score >= v)[1] : 0
          return `<i class="h${k}${at.has(d) && d !== first ? ' dep' : ''}" tabindex="0" data-tip="${esc(L.heatTip(screenText(r.route) || r.route, d, x))}"></i>` }).join('')}</div>`).join('')}
      <div></div>${dayAxis(days, 'hx')}
    </div></section>`
}

// To do this week: one row per root (a screen, or a failure when it is a bug, an account, an action), led by its
// strongest insight, the others of the same root folded under it; ordered by the group's impact, the top 5 first.
const TODO_TOP = 5
const plain = (html) => Object.assign(document.createElement('div'), { innerHTML: html }).textContent.replace(/\s+/g, ' ').trim()
const rootOf = (i) => i.kind.startsWith('failure_') ? { kind: 'failure', key: `${i.type}\t${i.detail}` }
  : i.account ? { kind: 'account', key: i.account } : i.route ? { kind: 'screen', key: i.route }
  : i.action || i.a ? { kind: 'action', key: i.action || i.a } : { kind: 'other', key: i.kind }
const FOLLOWABLE = ['screen', 'failure', 'account', 'action']
// A group weighs its strongest insight plus a tenth of the others: three problems on one screen pass one of the same size.
function groupTodos(list) {
  const by = new Map()
  for (const i of list) { const r = rootOf(i), id = r.kind + '\n' + r.key; if (!by.has(id)) by.set(id, { ...r, items: [] }); by.get(id).items.push(i) }
  return [...by.values()].map((g) => {
    g.items.sort((a, b) => b.impact - a.impact)
    g.impact = g.items[0].impact + g.items.slice(1).reduce((t, i) => t + i.impact, 0) / 10
    return g
  }).sort((a, b) => b.impact - a.impact)
}
const followLabel = (g) => g.kind === 'screen' ? screenText(g.key) || g.key : g.kind === 'account' ? accountText(g.key)
  : g.kind === 'action' ? actionText(g.key) || g.key : `${L.names[g.key.split('\t')[0]] ?? ''}: ${g.key.split('\t')[1]}`
const followOf = (g, follows) => (follows ?? []).find((x) => x.kind === g.kind && x.key === g.key)
function todoRow(g, k, days, follows) {
  const T = L.todo, W = L.fw, i = g.items[0], say = g.says[0], rest = g.items.slice(1)
  const reach = [i.reach_sessions && T.sessions(i.reach_sessions), i.reach_people && T.people(i.reach_people)].filter(Boolean).join(' · ')
  let demand = demandOf(i, say, days)
  if (rest.length) { const cut = demand.lastIndexOf('\n---'); demand = demand.slice(0, cut) + `**${W.alsoHere}:**\n${rest.map((x, n) => '- ' + plain(g.says[n + 1])).join('\n')}\n` + demand.slice(cut) }
  const followed = followOf(g, follows)
  const follow = !FOLLOWABLE.includes(g.kind) ? '' : followed ? `<span class="pill same fw-on" title="${esc(W.followTip)}">✓ ${W.following}</span>`
    : `<button class="small" data-follow="${esc(g.kind)}" data-key="${esc(g.key)}" data-label="${esc(followLabel(g))}" title="${esc(W.followTip)}">${W.follow}</button>`
  return `<li class="todo-row" id="todo-${k}" ${k >= TODO_TOP ? 'hidden' : ''}>
    <span class="pill ${i.severity} kchip" title="${esc(L.sev[i.severity])}">${T.chip[groupOf(i.kind)]}</span>
    <div class="todo-main"><div class="todo-say" title="${esc(plain(say))}">${say}</div>
      <div class="todo-meta">${reach ? `<b>${reach}</b>` : ''}<span class="tech">${techOf(i)}</span>
        ${rest.length ? `<button class="link fw-more" data-todo-more="${k}" aria-expanded="false" aria-controls="todo-more-${k}" data-n="${rest.length}" data-kind="${g.kind}">${W.more(rest.length, g.kind)}</button>` : ''}</div>
      ${rest.length ? `<ul class="fw-rest" id="todo-more-${k}" hidden>${rest.map((x, n) => `<li><span class="pill ${x.severity}">${T.chip[groupOf(x.kind)]}</span>
        <span class="fw-say" title="${esc(plain(g.says[n + 1]))}">${g.says[n + 1]}</span><a ${linkAttrs(x.link)}>${L.see} →</a></li>`).join('')}</ul>` : ''}</div>
    <div class="todo-acts"><button class="small" data-copy="${esc(demand)}">${L.demand.copy}</button>${follow}
      <a class="button small primary" ${linkAttrs(i.link)}>${T.evidence}</a></div></li>`
}
function showTodos(open) {
  document.querySelectorAll('.todo-row').forEach((r, k) => { if (k >= TODO_TOP) r.hidden = !open })
  const b = $('#todo-all')
  if (b) { b.setAttribute('aria-expanded', String(open)); b.textContent = open ? L.todo.fewer : L.todo.all(b.dataset.n) }
}
// "2 telas e 1 falha": how many of each root, in words.
const countText = (groups) => {
  const n = {}
  for (const g of groups) n[g.kind] = (n[g.kind] ?? 0) + 1
  const parts = Object.keys(L.fw.things).filter((k) => n[k]).map((k) => `${n[k]} ${L.fw.things[k][n[k] === 1 ? 0 : 1]}`)
  return parts.length > 1 ? parts.slice(0, -1).join(', ') + ` ${L.fw.and} ` + parts.at(-1) : parts[0] ?? ''
}
// The banner: one line, the verdict in roots, never the list again; its link goes to the list.
function verdictBanner(groups) {
  const bad = groups.filter((g) => g.items.some((i) => i.severity === 'bad')), warn = groups.filter((g) => !bad.includes(g) && g.items.some((i) => i.severity === 'warn'))
  const level = bad.length ? 'bad' : warn.length ? 'warn' : 'ok'
  const headline = level === 'bad' ? L.fw.bad(countText(bad), bad.length) : level === 'warn' ? L.fw.warn(countText(warn)) : L.verdict.ok
  return `<section class="card verdict ${level}"><span class="dot" aria-hidden="true">${{ bad: '!', warn: '•', ok: '✓' }[level]}</span><div class="fw-verdict">
      <div class="vh">${headline}</div>
      <div class="meta">${level === 'ok' ? L.verdict.okHint : `<button class="link" data-todo-go>${L.fw.toList}</button>`}</div></div></section>`
}
// Following: what someone decided to fix, its baseline against now (since the day it was followed).
const FW_CLS = { better: 'ok', same: 'same', worse: 'bad', waiting: 'same' }
const fwNum = (n) => num(Math.round(n * 10) / 10)
function followCard(follows) {
  const W = L.fw
  const day = (at) => new Date(at).toLocaleDateString(PT ? 'pt-BR' : 'en', { day: '2-digit', month: '2-digit' })
  const row = (x, k) => {
    const name = x.label || x.key, what = `${W.metric[x.metric]} ${x.metric === 'score' ? scoreHtml(x.before) : fwNum(x.before)}${x.now === null ? ''
      : ` → ${x.metric === 'score' ? scoreHtml(x.now) : fwNum(x.now)}`}`
    const since = W.since(x.state, day(x.at), x.version) + (x.state === 'waiting' ? `, ${W.waitingHint}` : '')
    return `<li class="fw-row" ${k >= TODO_TOP ? 'hidden' : ''}><span class="pill ${FW_CLS[x.state]}">${W.state[x.state]}</span>
      <div class="fw-main"><div class="fw-say" title="${esc(`${name}: ${plain(what)} · ${since}`)}"><b>${esc(name)}</b>: ${what}</div><div class="meta">${esc(since)}</div></div>
      <div class="todo-acts"><button class="small" data-unfollow="${esc(x.id)}" data-label="${esc(name)}">${W.stop}</button>
        <a class="button small primary" ${linkAttrs(x.link)}>${L.todo.evidence}</a></div></li>`
  }

  return c.a && c.b ? { c, widened } : null
}
